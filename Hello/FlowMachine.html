    L('dim', '$ python '+path+'   # simulated — no code, network or file access really runs');
    let input = null;
    const raw = String(inputs.json || '').trim();
    if(raw){
      try{ input = JSON.parse(raw); }
      catch(e){ L('err', 'The debug input is not valid JSON: '+e.message); L('info', 'Fix it on the Input tab, then run again.'); return done(2, 'invalid input JSON'); }
    }
    L('dim', 'input = '+clip(pyRepr(input), 240));

    const parsed = parsePython(source);
    if(parsed.error){
      const e = parsed.error;
      L('err', '  File "'+path+'", line '+e.line, e.line);
      L('err', '    '+e.text.trim(), e.line);
      L('err', e.type+': '+e.message, e.line);
      L('info', 'Click an error line to jump to it in the editor.');
      return done(1, e.type+' on line '+e.line);
    }
    const isBareString = st=>/^[rRbBuU]{0,2}("""|'''|"|')/.test(st.text.trim()) && /^[rRbBuU]{0,2}s$/.test(st.code.trim());
    const stmts = parsed.stmts.filter(st=>!isBareString(st));
    L('ok', '✓ Compiled · '+source.replace(/\n+$/, '').split('\n').length+' lines');
    const imports = [];
    stmts.forEach(st=>{
      if(st.indent) return;
      const c = st.code.trim();
      let m;
      if((m = /^import\s+(.+)$/.exec(c))) m[1].split(',').forEach(x=>imports.push(x.trim().split(/\s+as\s+/)[0]));
      else if((m = /^from\s+([\w.]+)\s+import\b/.exec(c))) imports.push(m[1]);
    });
    if(imports.length) L('dim', 'imports '+Array.from(new Set(imports)).join(', ')+' (not loaded in a simulated run)');

    // Names a statement may bind or change: assignment targets, loop/with targets, def/class names, x.append(…), x[k] = ….
    function bindings(st){
      const code = st.code.trim();
      let m;
      if(st.header==='def' || st.header==='class') return (m = /^(?:async\s+)?(?:def|class)\s+([A-Za-z_]\w*)/.exec(code)) ? [m[1]] : [];
      if(st.header==='with') return (code.match(/\bas\s+[A-Za-z_]\w*/g) || []).map(a=>a.replace(/^as\s+/, ''));
      if(st.header==='for') return (m = /^(?:async\s+)?for\s+([\w\s,()]+?)\s+in\b/.exec(code)) ? m[1].replace(/[()]/g, '').split(',').map(n=>n.trim()).filter(Boolean) : [];
      if(st.header) return [];
      m = /^([A-Za-z_][\w\s,]*?)\s*(?::[^=]*)?(?:[-+*/%&|^@<>]{1,3}=|=(?!=)|[.[])/.exec(code);
      return m ? m[1].split(',').map(n=>n.trim()).filter(n=>/^[A-Za-z_]\w*$/.test(n)) : [];
    }

    // Runs statements in order. Bodies of def/class and of branches/loops are skipped (names they bind become
    // unknown); `with`, `try` and `finally` bodies run. An error inside `try` is reported but treated as handled.
    // Returns { returned, value | unknown, st } | { error, st } | { branchReturns }.
    function exec(block, scope){
      const stack = [], branchReturns = [];
      const raise = (error, st)=>{
        const t = stack.slice().reverse().find(h=>h.tryBlock);
        if(!t) return { error, st };
        L('dim', 'line '+st.line+': raises '+error.type+(error.message ? ': '+error.message : '')+' inside try — the except handling is not traced', st.line);
        t.skip = true;
        return null;
      };
      for(const st of block){
        while(stack.length && stack[stack.length-1].indent>=st.indent) stack.pop();
        const skipped = stack.some(h=>h.skip), inDef = stack.some(h=>h.def);
        const code = st.code.trim(), text = st.text.trim();
        if(!inDef) PY_EFFECTS.forEach(([re, what])=>{ if(re.test(code)) L('info', 'line '+st.line+': '+what+' skipped'+(skipped ? ' (inside a branch)' : '')+' — '+clip(firstLine(text), 90), st.line); });
        if(skipped){
          if(!inDef){ bindings(st).forEach(n=>{ scope[n] = PY_UNKNOWN; }); if(/^return\b/.test(code)) branchReturns.push(st); }
          if(st.header && !st.inline) stack.push({ indent: st.indent, skip:true, def: st.header==='def' || st.header==='class' });
          continue;
        }
        let m, r;
        if(st.header){
          const h = st.header, def = h==='def' || h==='class', runs = h==='with' || h==='try' || h==='finally';
          bindings(st).forEach(n=>{ scope[n] = PY_UNKNOWN; });
          if(h==='if' || h==='for' || h==='while') L('dim', 'line '+st.line+': '+clip(firstLine(text), 80)+' — not traced, depends on runtime data', st.line);
          if(st.inline){ if(!def && !runs && /:\s*return\b/.test(code)) branchReturns.push(st); }
          else stack.push({ indent: st.indent, skip: !runs, def, tryBlock: h==='try' });
          continue;
        }
        if(/^return\b/.test(code)){
          const expr = text.replace(/^return\b/, '').trim();
          if(!expr) return { returned:true, value:null, st };
          r = evalPy(expr, scope);
          if(r.error){ const f = raise(r.error, st); if(f) return f; continue; }
          return r.ok ? { returned:true, value:r.value, st } : { returned:true, unknown:expr, st };
        }
        if(/^raise\b/.test(code)){
          const expr = text.replace(/^raise\b/, '').replace(/\s+from\s+[\s\S]*$/, '').trim();
          const em = /^([A-Za-z_][\w.]*)\s*(?:\(([\s\S]*)\))?$/.exec(expr);
          let err;
          if(!expr) err = { type:'RuntimeError', message:'No active exception to reraise' };
          else if(!em) err = { type:'Exception', message:expr };
          else {
            r = em[2] && em[2].trim() ? evalPy(em[2], scope) : null;
            err = { type:em[1], message: !r ? '' : r.ok ? pyStr(r.value) : em[2].trim() };
          }
          const f = raise(err, st); if(f) return f; continue;
        }
        if(/^print\s*\(/.test(code) && /\)$/.test(text)){
          const args = text.slice(text.indexOf('(')+1, -1);
          r = evalPy('['+args+']', scope);
          if(r.error){ const f = raise(r.error, st); if(f) return f; continue; }
          if(r.ok) r.value.map(pyStr).join(' ').split('\n').forEach(t=>L('', t));
          else L('dim', 'line '+st.line+': print('+clip(args, 80)+') — value depends on runtime data', st.line);
          continue;
        }
        if((m = /^([A-Za-z_]\w*)\s*(?::[^=]*)?=(?!=)/.exec(code))){
          const tm = /^([A-Za-z_]\w*)\s*(?::[^=]*)?=/.exec(text);
          r = tm ? evalPy(text.slice(tm[0].length), scope) : { ok:false };
          scope[m[1]] = r.ok ? r.value : PY_UNKNOWN;
          if(r.error){ const f = raise(r.error, st); if(f) return f; }
          continue;
        }
        bindings(st).forEach(n=>{ scope[n] = PY_UNKNOWN; });
      }
      return { branchReturns };
    }

    const globals = {};
    const mod = exec(stmts, globals);
    if(mod.error) return traceback(mod.st, '<module>', mod.error);

    const defIdx = stmts.findIndex(st=>st.indent===0 && /^def\s+run\s*\(/.test(st.code.trim()));
    if(defIdx<0){
      L('err', 'Traceback (most recent call last):');
      L('err', '  File "<flow runner>", line 1, in <module>');
      L('err', "AttributeError: module '"+baseName(path).replace(/\.py$/, '')+"' has no attribute 'run'");
      L('info', 'A Script step calls a top-level  def run(input):  with the previous step’s output.');
      return done(1, 'no run() function');
    }
    const def = stmts[defIdx];
    const open = def.text.indexOf('(');
    let depth = 0, close = open;
    for(; close<def.text.length; close++){ const c = def.text[close]; if('([{'.includes(c)) depth++; else if(')]}'.includes(c) && --depth===0) break; }
    const params = def.text.slice(open+1, close).split(',').map(p=>p.trim()).filter(p=>p && p!=='/' && p!=='*');
    const positional = params.filter(p=>!p.startsWith('*')), varargs = params.some(p=>/^\*[^*]/.test(p));
    const required = positional.filter(p=>!p.includes('=')).map(p=>p.split(':')[0].trim());
    if(!positional.length && !varargs){
      L('err', 'TypeError: run() takes 0 positional arguments but 1 was given', def.line);
      L('info', 'Give run() a parameter for the previous step’s output:  def run(input):');
      return done(1, 'TypeError on line '+def.line);
    }
    if(required.length>1){
      const missing = required.slice(1).map(n=>"'"+n+"'");
      L('err', 'TypeError: run() missing '+missing.length+' required positional argument'+(missing.length===1 ? '' : 's')+': '+
        (missing.length===1 ? missing[0] : missing.slice(0, -1).join(', ')+' and '+missing[missing.length-1]), def.line);
      return done(1, 'TypeError on line '+def.line);
    }
    const pname = positional.length ? positional[0].split(/[:=]/)[0].trim() : params.find(p=>/^\*[^*]/.test(p)).slice(1).split(':')[0].trim();
    const scope = Object.assign({}, globals);
    scope[pname] = positional.length ? input : [input];
    L('dim', 'calling run('+pname+') · line '+def.line, def.line);
    const body = [];
    for(let k=defIdx+1; k<stmts.length && stmts[k].indent>def.indent; k++) body.push(stmts[k]);
    const res = exec(body, scope);
    if(res.error) return traceback(res.st, 'run', res.error);
    if(res.returned && 'unknown' in res){
      L('info', 'run() returns  '+clip(firstLine(res.unknown), 100)+'  · line '+res.st.line, res.st.line);
      L('dim', 'Not evaluated — it depends on values only known at runtime (calls, loops or network data).');
      return done(0);
    }
    if(res.returned){
      const v = res.value;
      const desc = Array.isArray(v) ? 'a list of '+v.length+' item'+(v.length===1 ? '' : 's') : isPyDict(v) ? 'a dict with '+Object.keys(v).length+' key'+(Object.keys(v).length===1 ? '' : 's')
        : typeof v==='string' ? 'a str ('+v.length+' chars)' : pyTypeName(v);
      L('ok', '✓ run() returned '+desc+' · line '+res.st.line, res.st.line);
      const json = JSON.stringify(v, null, 2).split('\n');
      json.slice(0, 300).forEach(t=>L('', t));
      if(json.length>300) L('dim', '… '+(json.length-300)+' more lines');
      return done(0);
    }
    if(res.branchReturns.length){
      const b = res.branchReturns[0];
      L('info', 'run() only returns inside a branch (line '+b.line+') — the traced path falls through', b.line);
    }
    L('ok', '✓ run() returned None');
    L('', 'null');
    return done(0);
  }

  // Simulated prompt run: renders {{variables}} from the debug inputs, flags problems, and answers with a
  // deterministic stand-in reply so the data flowing through the step can be checked.
  function simulatePrompt(path, source, inputs){
    const out = [];
    const L = (cls, text, line)=>{ out.push(line ? [cls, text, line] : [cls, text]); };
    const task = String(inputs.task || '').trim(), values = inputs.vars || {};
    let warnings = 0;
    L('dim', '$ prompt '+path+'   # simulated model — no request leaves the browser');
    L('dim', 'task: '+(task ? '“'+clip(task, 120)+'”' : '(none)')+' · reasoning '+(inputs.reasoning ? 'on' : 'off'));
    if(!source.trim()){
      L('err', 'The prompt is empty — write its instructions first.');
      return { code:1, lines:out, summary:'empty prompt' };
    }
    if(!task){ L('info', '⚠ No task — the step’s “for task” text is required when the flow runs'); warnings++; }
    const vars = templateVariables(source);
    vars.forEach(v=>{
      const val = values[v]==null ? '' : String(values[v]);
      if(val) L('', '{{'+v+'}} = '+clip(val, 160));
      else { L('info', '⚠ {{'+v+'}} has no value — it is sent as an empty string'); warnings++; }
    });
    source.split('\n').forEach((l, idx)=>{
      if(/\{\{|\}\}/.test(l.replace(/\{\{\s*[\w.]+\s*\}\}/g, ''))){ L('info', '⚠ line '+(idx+1)+': braces that aren’t a valid {{variable}} are sent as written', idx+1); warnings++; }
    });
    const rendered = source.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, v)=>values[v]==null ? '' : String(values[v]));
    const tokens = s=>Math.max(1, Math.ceil(String(s).length/4));
    L('head', '── Rendered prompt · '+rendered.length+' chars · ~'+tokens(rendered+task)+' tokens');
    rendered.replace(/\s+$/, '').split('\n').forEach(l=>L('', l));
    const lines = rendered.split('\n');
    const title = (lines.find(l=>/^#{1,6}\s/.test(l)) || '').replace(/^#+\s*/, '').trim();
    const rules = lines.filter(l=>/^\s*(?:[-*+]|\d+\.)\s+\S/.test(l)).map(l=>l.replace(/^\s*(?:[-*+]|\d+\.)\s+/, '').replace(/\*\*/g, '').trim());
    if(inputs.reasoning){
      L('head', '── Thinking (simulated)');
      L('dim', 'Reading '+lines.filter(l=>l.trim()).length+' lines of instructions'+(rules.length ? ' with '+rules.length+' rule'+(rules.length===1 ? '' : 's') : '')+'.');
      L('dim', 'Planning '+(task ? 'how to “'+clip(task, 80)+'”' : 'the answer')+'.');
    }
    const reply = [];
    reply.push('[simulated] '+(task ? 'Answer to “'+clip(task, 80)+'”' : 'Answer')+(title ? ' for “'+clip(title, 60)+'”' : '')+'.');
    const filled = vars.filter(v=>values[v]);
    if(filled.length) reply.push('Based on '+filled.map(v=>v+' = '+clip(values[v], 60)).join(', ')+'.');
    if(rules.length){
      reply.push('Following '+rules.length+' instruction'+(rules.length===1 ? '' : 's')+':');
      rules.slice(0, 12).forEach(r=>reply.push('  ✓ '+clip(r, 100)));
    }
    reply.push('The real model’s reply replaces this text when the flow runs on the execution server.');
    L('head', '── Simulated reply');
    reply.forEach(l=>L('', l));
    L('ok', '✓ Done · ~'+tokens(rendered+task)+' tokens in · ~'+tokens(reply.join('\n'))+' out');
    return { code:0, lines:out, warnings, summary: warnings ? warnings+' warning'+(warnings===1 ? '' : 's') : '' };
  }

  /* ---------------- Webhook endpoint view ---------------- */
  function copyText(text, what){
    const done = ()=>setStatus('Copied '+what+'.');
    const fallback = ()=>{
      const t = document.createElement('textarea');
      t.value = text; t.setAttribute('readonly',''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); done(); }catch(e){ setStatus('Copy failed — select the text and copy it manually.'); }
      t.remove();
    };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  // Wheel events inside the view must scroll it, not pan the canvas underneath.
  fileViewEl.addEventListener('wheel', e=>e.stopPropagation(), { passive:true });

  document.addEventListener('keydown', e=>{
    if(e.key!=='Escape' || !fileView) return;

    e.preventDefault();

  // Ctrl/Cmd+Enter runs the open prompt or script for debugging.
  document.addEventListener('keydown', e=>{

  function renderNodes(){
    canvas.querySelectorAll('.node').forEach(el=>el.remove());
    state.nodes.forEach(node=>{
      const def = NODE_TYPES[node.type];
      const el = document.createElement('div');
      el.className = 'node' + (node.id===selectedNodeId ? ' selected' : '');
      el.style.left = node.x+'px';
      el.style.top = node.y+'px';
      el.dataset.id = node.id;

      const header = document.createElement('div');
      header.className='node-header';
      header.innerHTML = '<span class="pal-icon" data-state="idle" title="Idle">'+(ICONS[node.type]||'')+'</span>'+
        '<input class="title-input" value="'+escapeHtml(node.name)+'" title="Rename node">'+
        (node.type!=='trigger' ? '<span class="del" title="Delete node">&times;</span>' : '<span style="width:14px;display:inline-block;"></span>');
      el.appendChild(header);

      const type = document.createElement('div');
      type.className='node-type';
      type.textContent = def.label;
      el.appendChild(type);

      const body = document.createElement('div');
      body.className='node-body';
      renderNodeBody(node, body);
      el.appendChild(body);
      el.addEventListener('dblclick', e=>{
        if(e.target.closest('input, .phrase-pill, .phrase-popover, .port, .del')) return;
        if(canOpenNode(node)) openNode(node);
      });

      // input port
      if(def.hasInput){
        const p = document.createElement('div');
        p.className='port in';
        p.dataset.nodeId = node.id;
        p.dataset.portType = 'in';
        el.appendChild(p);
      }
      // output ports
      def.outputs.forEach((portName, idx)=>{
        const p = document.createElement('div');
        p.className='port out';
        p.dataset.nodeId = node.id;
        p.dataset.portType = 'out';
        p.dataset.portName = portName;
        const count = def.outputs.length;
        const topPct = count===1 ? 50 : (30 + idx*40);
        p.style.top = topPct+'%';
        el.appendChild(p);
        if(count>1){
          const lbl = document.createElement('div');
          lbl.className='port-label';
          lbl.style.top = topPct+'%';
          lbl.style.transform='translateY(-50%)';
          lbl.textContent = portName;
          el.appendChild(lbl);
        }
        p.addEventListener('pointerdown', onPortMouseDown);
      });

      header.addEventListener('pointerdown', e=>{
        if(e.target.classList.contains('del') || e.target.classList.contains('title-input')) return;
        e.stopPropagation();
        startNodeDrag(e, node);
      });
      header.querySelector('.del') && header.querySelector('.del').addEventListener('click', e=>{
        e.stopPropagation();
        removeNode(node.id);
      });
      const titleInput = header.querySelector('.title-input');
      titleInput.addEventListener('pointerdown', e=>e.stopPropagation());
      titleInput.addEventListener('click', ()=>selectNode(node.id));
      titleInput.addEventListener('input', ()=>{
        node.name = titleInput.value;
        if(node.id===selectedNodeId) renderAiCtx();
        // Loops downstream name this node in their sentence.
        state.edges.filter(ed=>ed.from===node.id).forEach(ed=>{
          const target = state.nodes.find(n=>n.id===ed.to);
          if(target && target.type==='loop') updateNodeVisual(target);
        });
        if(fileView) renderFileViewMeta();
      });
      el.addEventListener('pointerdown', e=>{
        if(e.target.classList.contains('port')) return;
        selectNode(node.id);
      });

      bindNodeStatusListener(node, el);
      canvas.appendChild(el);
    });
  }

  // Applies a run-state event (idle/running/done/error) to a node's header icon and border —
  // the icon itself is the status indicator, so no separate dot is needed.
  function applyNodeRunState(el, runState, detail){
    const icon = el.querySelector('.node-header .pal-icon');
    if(icon){ icon.dataset.state = runState; icon.title = runState.charAt(0).toUpperCase()+runState.slice(1) + (detail && detail.message ? ': '+detail.message : ''); }
    el.classList.toggle('node-error', runState==='error');
  }

  // Wires a node card to server-pushed run-state events for its lifetime; re-subscribes on every
  // renderNodes() call since the DOM element is rebuilt from scratch.
  function bindNodeStatusListener(node, el){
    const prevUnsub = nodeStateUnsub.get(node.id);
    if(prevUnsub) prevUnsub();
    const unsub = NodeStateBus.on(node.id, (runState, detail) => applyNodeRunState(el, runState, detail));
    nodeStateUnsub.set(node.id, unsub);
  }

  // Nodes with something to open: prompt/script files, the Data step's database tables, a webhook endpoint.
  function canOpenNode(node){
    if(node.type==='runPrompt' || node.type==='script' || node.type==='data') return true;
    return node.type==='trigger' && node.config.triggerType==='webhook';
  }

  function firstLine(text){ return (text||'').split('\n').map(l=>l.trim()).find(Boolean) || ''; }
  function baseName(path){ return String(path||'').split(/[\\/]/).filter(Boolean).pop() || ''; }

  // The card body is the sentence; file and endpoint pills inside it open the full view.
  function renderNodeBody(node, body){
    renderSentence(node, body);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function nodeEl(id){ return canvas.querySelector('.node[data-id="'+id+'"]'); }

  // Update just one node's visible text (name/summary/sentence pills) without rebuilding all node DOM.
  function updateNodeVisual(node){
    const el = nodeEl(node.id);
    if(!el) return;
    const titleInput = el.querySelector('.title-input');
    if(titleInput && document.activeElement!==titleInput) titleInput.value = node.name;
    const body = el.querySelector('.node-body');
    if(!body) return;
    if(!body.querySelector('.phrase-popover')){
      body.innerHTML = '';
      renderNodeBody(node, body);
    }
  }


  function portCenter(nodeId, portType, portName){
    const el = nodeEl(nodeId);
    if(!el) return {x:0,y:0};
    const sel = portType==='in' ? '.port.in' : '.port.out[data-port-name="'+portName+'"]';
    const port = el.querySelector(sel);
    if(!port) return {x:0,y:0};
    const canvasRect = canvas.getBoundingClientRect();
    const pr = port.getBoundingClientRect();
    return { x: (pr.left + pr.width/2 - canvasRect.left)/view.zoom, y: (pr.top + pr.height/2 - canvasRect.top)/view.zoom };
  }

  function renderEdges(){
    svg.innerHTML = '';
    // resize svg / canvas to fit content
    let maxX=2600, maxY=1800;
    state.nodes.forEach(n=>{ maxX=Math.max(maxX, n.x+400); maxY=Math.max(maxY, n.y+300); });
    canvas.style.width = maxX+'px';
    canvas.style.height = maxY+'px';

    state.edges.forEach(edge=>{
      const p1 = portCenter(edge.from, 'out', edge.fromPort);
      const p2 = portCenter(edge.to, 'in');
      const path = buildPath(p1,p2);
      const pathEl = document.createElementNS('http://www.w3.org/2000/svg','path');
      pathEl.setAttribute('d', path);
      pathEl.setAttribute('class', 'edge' + (edge.id===selectedEdgeId ? ' selected' : ''));
      pathEl.dataset.id = edge.id;
      pathEl.addEventListener('pointerdown', e=>{ e.stopPropagation(); selectEdge(edge.id); });
      svg.appendChild(pathEl);

      if(edge.fromPort !== 'out'){
        const midX = (p1.x+p2.x)/2, midY=(p1.y+p2.y)/2;
        const label = document.createElementNS('http://www.w3.org/2000/svg','text');
        label.setAttribute('x', midX);
        label.setAttribute('y', midY-6);
        label.setAttribute('class','edge-label');
        label.textContent = edge.fromPort;
        svg.appendChild(label);
      }
    });
  }

  function buildPath(p1,p2){
    const dx = Math.max(60, Math.abs(p2.x-p1.x)/2);
    return 'M '+p1.x+' '+p1.y+' C '+(p1.x+dx)+' '+p1.y+', '+(p2.x-dx)+' '+p2.y+', '+p2.x+' '+p2.y;
  }

  /* ---------------- Run animation (simulated execution walk-through) ---------------- */
  let isRunning = false;
  let runHadError = false;
  function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

  // Basic per-node config validation, used to surface a realistic "error" run-state instead of
  // always succeeding — mirrors the kind of pre-flight checks a real execution server would do.
  function validateNodeConfig(node){
    const cfg = node.config;
    const fileCheck = (path, noun)=>{
      if(!path) return 'Choose a '+noun+' file.';
      if(!Workspace.exists(path)) return noun.charAt(0).toUpperCase()+noun.slice(1)+' file "'+path+'" not found.';
      if(!Workspace.read(path).trim()) return noun.charAt(0).toUpperCase()+noun.slice(1)+' file "'+path+'" is empty.';
      return null;
    };
    switch(node.type){
      case 'trigger':
        if(cfg.triggerType==='cron' && !/^(\S+\s+){4}\S+$/.test((cfg.cronExpression||'').trim())) return 'Cron expression must have 5 space-separated fields.';
        if(cfg.triggerType==='webhook'){
          if(!cfg.webhookPath) return 'The webhook endpoint has not been generated.';
          const p = describePayload(cfg);
          if(!p.ok) return 'Test payload is not valid JSON: '+p.error;
        }
        return null;
      case 'runPrompt':
        if(!cfg.task || !cfg.task.trim()) return 'Task is required.';
        return fileCheck(cfg.promptFile, 'prompt');
      case 'loop': {
        if(!cfg.itemVariable || !cfg.itemVariable.trim()) return 'Item variable name is required.';
        const src = loopSourceNode(node);
        if(!src) return 'Connect the step whose output this loop iterates over.';
        if(src.type==='trigger' && src.config.triggerType!=='webhook') return 'A manual or scheduled trigger has no list output — connect a Script or Data step, or use a webhook trigger.';
        return null;
      }
      case 'script':
        return fileCheck(cfg.scriptFile, 'script');
      case 'data': {
        if(!cfg.database) return 'Choose a database.';
        if(!Workspace.exists(cfg.database)) return 'Database file "'+cfg.database+'" not found.';
        if(!cfg.table) return 'Choose a table.';
        if(!tablesOf(cfg.database).some(t=>t.name===cfg.table)) return 'Table "'+cfg.table+'" is not defined in '+cfg.database+'.';
        return null;
      }
      default: return null;
    }
  }

  function edgePathEl(edgeId){ return svg.querySelector('path.edge[data-id="'+edgeId+'"]'); }

  // Animates a glowing dot travelling along an edge's SVG path over `duration` ms.
  function animateToken(edgeId, duration){
    return new Promise(resolve=>{
      const pathEl = edgePathEl(edgeId);
      if(!pathEl){ resolve(); return; }
      pathEl.classList.add('edge-active');
      const len = pathEl.getTotalLength();
      const token = document.createElementNS('http://www.w3.org/2000/svg','circle');
      token.setAttribute('r','6');
      token.setAttribute('class','flow-token');
      svg.appendChild(token);
      const start = performance.now();
      function step(now){
        const t = Math.min(1, (now-start)/duration);
        const pt = pathEl.getPointAtLength(t*len);
        token.setAttribute('cx', pt.x);
        token.setAttribute('cy', pt.y);
        if(t<1){
          requestAnimationFrame(step);
        } else {
          token.remove();
          pathEl.classList.remove('edge-active');
          resolve();
        }
      }
      requestAnimationFrame(step);
    });
  }

  // Returns a node's outgoing edges ordered to match its port definition (e.g. true before false).
  function outgoingEdges(node){
    const def = NODE_TYPES[node.type];
    const edges = [];
    def.outputs.forEach(port=>{
      const e = state.edges.find(ed=>ed.from===node.id && ed.fromPort===port);
      if(e) edges.push(e);
    });
    return edges;
  }

  // Walks the flow from the trigger, highlighting each node and animating a token along
  // every traversed edge. A visited-edge set stops infinite loops (e.g. loop body cycles).
  // Publishes running/done/error state for each node via ServerLink so its status dot updates
  // live, and stops descending into a node's own branch (without aborting the whole run) if
  // that node reports (or throws) an error.
  async function walkNode(nodeId, visitedEdges){
    const node = state.nodes.find(n=>n.id===nodeId);
    if(!node) return;
    const el = nodeEl(node.id);
    if(el) el.classList.add('node-active');
    setStatus('Running: '+node.name);
    ServerLink.publishNodeState(node.id, 'running');
    Logger.info('Node started: '+node.name, { nodeId: node.id, type: node.type });

    try{
      await sleep(350);
      const validationError = validateNodeConfig(node);
      if(validationError) throw new Error(validationError);
    }catch(err){
      if(el) el.classList.remove('node-active');
      ServerLink.publishNodeState(node.id, 'error', { message: err.message });
      Logger.error('Node failed: '+node.name, { nodeId: node.id, error: err.message });
      setStatus('Error in "'+node.name+'": '+err.message);
      runHadError = true;
      return;
    }

    if(node.type==='trigger' && node.config.triggerType==='webhook') Logger.info('Webhook received the test payload: '+describePayload(node.config).text+'.', { nodeId: node.id });
    ServerLink.publishNodeState(node.id, 'done');
    Logger.success('Node completed: '+node.name, { nodeId: node.id });

    const edges = outgoingEdges(node);
    for(const edge of edges){
      if(visitedEdges.has(edge.id)) continue;
      visitedEdges.add(edge.id);
      await animateToken(edge.id, 500);
      await walkNode(edge.to, visitedEdges);
    }

    if(el) el.classList.remove('node-active');
  }

  async function runFlowAnimation(){
    if(isRunning) return;
    const trigger = state.nodes.find(n=>n.type==='trigger');
    if(!trigger){ setStatus('Add a Trigger node to run the flow.'); Logger.warn('Run aborted: no Trigger node in flow.'); return; }
    isRunning = true;
    runHadError = false;
    const btn = document.getElementById('btnRun');
    btn.disabled = true;
    canvas.querySelectorAll('.node.node-active').forEach(el=>el.classList.remove('node-active'));
    state.nodes.forEach(n=>ServerLink.publishNodeState(n.id, 'idle'));
    Logger.info('Run started.', { nodes: state.nodes.length });
    try{
      await walkNode(trigger.id, new Set());
      if(runHadError){
        setStatus('Run finished with errors — see Logs.');
        Logger.warn('Run finished with at least one node error.');
      } else {
        setStatus('Run animation complete.');
        Logger.success('Run completed successfully.');
      }
    }catch(err){
      Logger.error('Run aborted by an unexpected error.', { error: String(err) });
      setStatus('Run aborted: '+err.message);
    } finally {
      isRunning = false;
      btn.disabled = false;
    }
  }

  /* ---------------- Node dragging (rAF-throttled for smooth movement) ---------------- */
  let dragCtx = null;
  let dragLastEvent = null;
  let dragRafPending = false;
  function startNodeDrag(e, node){
    e.preventDefault();
    selectNode(node.id);
    const rect = canvas.getBoundingClientRect();
    dragCtx = { node, offX: (e.clientX - rect.left)/view.zoom - node.x, offY: (e.clientY - rect.top)/view.zoom - node.y };
    document.body.classList.add('dragging-node');
    window.addEventListener('pointermove', onNodeDragMove);
    window.addEventListener('pointerup', onNodeDragEnd);
    window.addEventListener('pointercancel', onNodeDragEnd);
  }
  function onNodeDragMove(e){
    if(!dragCtx) return;
    dragLastEvent = e;
    if(!dragRafPending){
      dragRafPending = true;
      requestAnimationFrame(applyNodeDrag);
    }
  }
  function applyNodeDrag(){
    dragRafPending = false;
    if(!dragCtx || !dragLastEvent) return;
    const e = dragLastEvent;
    const rect = canvas.getBoundingClientRect();
    dragCtx.node.x = Math.max(0, (e.clientX - rect.left)/view.zoom - dragCtx.offX);
    dragCtx.node.y = Math.max(0, (e.clientY - rect.top)/view.zoom - dragCtx.offY);
    const el = nodeEl(dragCtx.node.id);
    if(el){ el.style.left = dragCtx.node.x+'px'; el.style.top = dragCtx.node.y+'px'; }
    renderEdges();
  }
  function onNodeDragEnd(){
    dragCtx = null;
    dragLastEvent = null;
    document.body.classList.remove('dragging-node');
    window.removeEventListener('pointermove', onNodeDragMove);
    window.removeEventListener('pointerup', onNodeDragEnd);
    window.removeEventListener('pointercancel', onNodeDragEnd);
  }

  /* ---------------- Port connecting (rAF-throttled with live drop-target highlight) ---------------- */
  let connectCtx = null;
  let connectLastEvent = null;
  let connectRafPending = false;
  let hoveredPort = null;
  function onPortMouseDown(e){
    e.stopPropagation();
    e.preventDefault();
    const nodeId = e.target.dataset.nodeId;
    const portName = e.target.dataset.portName;
    connectCtx = { fromId: nodeId, fromPort: portName };
    document.body.classList.add('connecting-edge');
    window.addEventListener('pointermove', onConnectMove);
    window.addEventListener('pointerup', onConnectEnd);
    window.addEventListener('pointercancel', onConnectEnd);
  }
  function onConnectMove(e){
    if(!connectCtx) return;
    connectLastEvent = e;
    if(!connectRafPending){
      connectRafPending = true;
      requestAnimationFrame(applyConnectMove);
    }
  }
  function applyConnectMove(){
    connectRafPending = false;
    if(!connectCtx || !connectLastEvent) return;
    const e = connectLastEvent;
    const rect = canvas.getBoundingClientRect();
    const p1 = portCenter(connectCtx.fromId, 'out', connectCtx.fromPort);
    const p2 = { x: (e.clientX-rect.left)/view.zoom, y: (e.clientY-rect.top)/view.zoom };
    let tempPath = svg.querySelector('.temp');
    if(!tempPath){
      tempPath = document.createElementNS('http://www.w3.org/2000/svg','path');
      tempPath.setAttribute('class','edge temp');
      svg.appendChild(tempPath);
    }
    tempPath.setAttribute('d', buildPath(p1,p2));

    const target = document.elementFromPoint(e.clientX, e.clientY);
    const validPort = (target && target.classList.contains('port') && target.dataset.portType==='in') ? target : null;
    if(hoveredPort && hoveredPort!==validPort) hoveredPort.classList.remove('port-target');
    if(validPort) validPort.classList.add('port-target');
    hoveredPort = validPort;
  }
  function onConnectEnd(e){
    window.removeEventListener('pointermove', onConnectMove);
    window.removeEventListener('pointerup', onConnectEnd);
    window.removeEventListener('pointercancel', onConnectEnd);
    document.body.classList.remove('connecting-edge');
    const tempPath = svg.querySelector('.temp');
    if(tempPath) tempPath.remove();
    if(hoveredPort){ hoveredPort.classList.remove('port-target'); hoveredPort=null; }
    if(!connectCtx){ connectLastEvent=null; return; }
    const target = document.elementFromPoint(e.clientX, e.clientY);
    if(target && target.classList.contains('port') && target.dataset.portType==='in'){
      connect(connectCtx.fromId, connectCtx.fromPort, target.dataset.nodeId);
    }
    connectCtx = null;
    connectLastEvent = null;
  }

  /* ---------------- Selection ---------------- */
  // Toggle only the 'selected' class on the affected DOM elements instead of re-rendering everything.
  function applySelectionClasses(prevNodeId, prevEdgeId){
    if(prevNodeId && prevNodeId!==selectedNodeId){ const el=nodeEl(prevNodeId); if(el) el.classList.remove('selected'); }
    if(selectedNodeId){ const el=nodeEl(selectedNodeId); if(el) el.classList.add('selected'); }
    if(prevEdgeId && prevEdgeId!==selectedEdgeId){ const el=svg.querySelector('path[data-id="'+prevEdgeId+'"]'); if(el) el.classList.remove('selected'); }
    if(selectedEdgeId){ const el=svg.querySelector('path[data-id="'+selectedEdgeId+'"]'); if(el) el.classList.add('selected'); }
    renderAiCtx();
  }
  function selectNode(id){
    const prevNodeId = selectedNodeId, prevEdgeId = selectedEdgeId;
    selectedNodeId = id;
    selectedEdgeId = null;
    applySelectionClasses(prevNodeId, prevEdgeId);
  }
  function selectEdge(id){
    const prevNodeId = selectedNodeId, prevEdgeId = selectedEdgeId;
    selectedEdgeId = id;
    selectedNodeId = null;
    applySelectionClasses(prevNodeId, prevEdgeId);
  }
  canvasWrapper.addEventListener('pointerdown', e=>{
    if(pinch || (e.pointerType==='mouse' && e.button!==0)) return;
    if(e.target===canvasWrapper || e.target===canvas || e.target===svg){
      panCtx = { startX:e.clientX, startY:e.clientY, startPanX:view.panX, startPanY:view.panY, moved:false };
      window.addEventListener('pointermove', onPanMove);
      window.addEventListener('pointerup', onPanEnd);
      window.addEventListener('pointercancel', onPanEnd);
    }
  });

  /* Two-finger pinch zoom on touch screens; the world point between the fingers stays put. */
  const touchPoints = new Map();
  let pinch = null;
  canvasWrapper.addEventListener('pointerdown', e=>{
    if(e.pointerType!=='touch' || e.target.closest('#fileView, #aiDock, #canvasControls')) return;
    touchPoints.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(touchPoints.size===2){
      if(panCtx){ panCtx.moved = true; onPanEnd(); }
      if(dragCtx) onNodeDragEnd();
      const [a, b] = Array.from(touchPoints.values());
      const rect = canvasWrapper.getBoundingClientRect();
      const mid = { x:(a.x+b.x)/2 - rect.left, y:(a.y+b.y)/2 - rect.top };
      pinch = { dist: Math.hypot(a.x-b.x, a.y-b.y) || 1, zoom: view.zoom, wx:(mid.x - view.panX)/view.zoom, wy:(mid.y - view.panY)/view.zoom };
    }
  }, true);
  window.addEventListener('pointermove', e=>{
    if(!touchPoints.has(e.pointerId)) return;
    touchPoints.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(!pinch || touchPoints.size<2) return;
    const [a, b] = Array.from(touchPoints.values());
    const rect = canvasWrapper.getBoundingClientRect();
    const mid = { x:(a.x+b.x)/2 - rect.left, y:(a.y+b.y)/2 - rect.top };
    view.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, pinch.zoom * Math.hypot(a.x-b.x, a.y-b.y) / pinch.dist));
    view.panX = mid.x - pinch.wx*view.zoom;
    view.panY = mid.y - pinch.wy*view.zoom;
    applyView();
  });
  const endTouch = e=>{ touchPoints.delete(e.pointerId); if(touchPoints.size<2) pinch = null; };
  window.addEventListener('pointerup', endTouch);
  window.addEventListener('pointercancel', endTouch);
  window.addEventListener('keydown', e=>{
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='k'){
      e.preventDefault();
      openCommandPalette();
      return;
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='s'){
      e.preventDefault();
      document.getElementById('btnSave').click();
      return;
    }
    // Enter opens the selected node's file/details; canvas shortcuts are inactive while that view is open.
    if(e.key==='Enter' && !fileView && document.activeElement===document.body && selectedNodeId){
      const sel = state.nodes.find(n=>n.id===selectedNodeId);
      if(sel && canOpenNode(sel)){ e.preventDefault(); openNode(sel); return; }
    }
    if(fileView) return;
    if((e.key==='Delete' || e.key==='Backspace') && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
      if(selectedEdgeId) removeEdge(selectedEdgeId);
      else if(selectedNodeId && selectedNodeId!=='trigger') removeNode(selectedNodeId);
    }
    if((e.ctrlKey || e.metaKey) && (e.key==='=' || e.key==='+')){ e.preventDefault(); setZoom(view.zoom+ZOOM_STEP); }
    if((e.ctrlKey || e.metaKey) && e.key==='-'){ e.preventDefault(); setZoom(view.zoom-ZOOM_STEP); }
    if((e.ctrlKey || e.metaKey) && e.key==='0'){ e.preventDefault(); fitToView(); }
  });

  /* ---------------- Canvas panning (drag empty space to pan, click to deselect) ---------------- */
  let panCtx = null;
  function onPanMove(e){
    if(!panCtx || pinch) return;
    const dx = e.clientX - panCtx.startX;
    const dy = e.clientY - panCtx.startY;
    if(Math.abs(dx)>3 || Math.abs(dy)>3) panCtx.moved = true;
    if(panCtx.moved){
      view.panX = panCtx.startPanX + dx;
      view.panY = panCtx.startPanY + dy;
      applyView();
      canvasWrapper.classList.add('panning');
    }
  }
  function onPanEnd(){
    window.removeEventListener('pointermove', onPanMove);
    window.removeEventListener('pointerup', onPanEnd);
    window.removeEventListener('pointercancel', onPanEnd);
    canvasWrapper.classList.remove('panning');
    if(panCtx && !panCtx.moved){
      const prevNodeId = selectedNodeId, prevEdgeId = selectedEdgeId;
      selectedNodeId=null; selectedEdgeId=null;
      applySelectionClasses(prevNodeId, prevEdgeId);
      }
    panCtx = null;
  }

  canvasWrapper.addEventListener('wheel', e=>{
    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      setZoom(view.zoom * Math.exp(-e.deltaY * 0.001), e.clientX, e.clientY);
    } else {
      e.preventDefault();
      view.panX -= e.deltaX;
      view.panY -= e.deltaY;
      applyView();
    }
  }, { passive:false });

  document.getElementById('btnZoomIn').addEventListener('click', ()=>setZoom(view.zoom+ZOOM_STEP));
  document.getElementById('btnZoomOut').addEventListener('click', ()=>setZoom(view.zoom-ZOOM_STEP));
  document.getElementById('zoomLabel').addEventListener('click', ()=>setZoom(1));
  document.getElementById('btnFit').addEventListener('click', fitToView);
  document.getElementById('btnResetView').addEventListener('click', ()=>{ view.zoom=1; view.panX=0; view.panY=0; applyView(); });

  /* ---------------- Side panel: workspace file tree (Prompts · Scripts · Data · Flows) ---------------- */
  const SECTION_BOXES = { prompt:'promptsBox', script:'scriptsBox', data:'dataBox', flow:'flowsBox' };
  const SECTION_IDS = { prompt:'promptsSection', script:'scriptsSection', data:'dataSection', flow:'flowsSection' };

  function flowsUsing(path){
    return Workspace.list('flow').filter(fp=>{ const e = Workspace.entry(fp); return e && e.state && e.state.nodes.some(n=>nodeFilePath(n)===path); });
  }

  function renderSidebar(){ Object.keys(SECTION_BOXES).forEach(renderFileSection); }

  function renderFileSection(kind){
    const box = document.getElementById(SECTION_BOXES[kind]);
    if(!box) return;
    const folder = FOLDERS[kind];
    const files = Workspace.list(kind);
    const count = document.querySelector('[data-count="'+kind+'"]');
    if(count) count.textContent = files.length ? String(files.length) : '';
    box.innerHTML = '';
    if(!files.length){
      const empty = document.createElement('div');
      empty.className = 'lib-empty-hint';
      empty.textContent = kind==='flow' ? 'No saved flows yet. Press Save to write this flow to flows/.' : 'No '+folder.label.toLowerCase()+' yet. Use + to create one in '+folder.dir+'.';
      box.appendChild(empty);
      return;
    }
    const list = document.createElement('ul');
    list.className = 'lib-file-list';
    files.forEach(path=>{
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'lib-file';
      const active = kind==='flow' ? path===currentFlowPath : (fileView && fileView.type==='file' && fileView.path===path);
      if(active) row.classList.add('is-active');
      const users = kind==='flow' ? 0 : usersOf(path).length;
      const dirty = kind==='flow' && path===currentFlowPath && isDirty();
      row.innerHTML =
        '<button type="button" class="lib-file-main"><span class="lib-file-icon" style="color:'+folder.color+'">'+ICONS[folder.icon]+'</span>'+
          '<span class="lib-file-name"></span>'+
          (users ? '<span class="lib-file-badge" title="Used by '+users+' step'+(users===1?'':'s')+' in this flow">'+users+'</span>' : '')+
          (dirty ? '<span class="lib-file-dot" title="Unsaved changes"></span>' : '')+
        '</button>'+
        '<span class="lib-file-actions"><button type="button" class="lib-file-action del-action" title="Delete">'+ICONS.trash+'</button></span>';
      const main = row.querySelector('.lib-file-main');
      row.querySelector('.lib-file-name').textContent = baseName(path);
      main.title = kind==='flow' ? (path===currentFlowPath ? path+' — open on the canvas' : 'Open '+path+' on the canvas') : 'Open '+path;
      main.setAttribute('aria-label', (kind==='flow' ? 'Open flow ' : 'Open ')+path+(users ? ', used by '+users+' step'+(users===1?'':'s') : '')+(dirty ? ', unsaved changes' : ''));
      if(active) main.setAttribute('aria-current', 'true');
      main.addEventListener('click', ()=>{ if(kind==='flow') loadFlowFile(path); else openFile(path); });
      const del = row.querySelector('.del-action');
      del.setAttribute('aria-label', 'Delete '+path);
      del.addEventListener('click', e=>{ e.stopPropagation(); deleteFile(path); });
      li.appendChild(row);
      // Databases list their tables; a table opens straight to its card in the configurator.
      if(kind==='data'){
        const tables = tablesOf(path);
        if(tables.length){
          const sub = document.createElement('ul');
          sub.className = 'lib-sub-list';
          tables.forEach(t=>{
            const sli = document.createElement('li');
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'lib-file-sub';
            b.innerHTML = '<span class="lib-sub-name"></span><span class="lib-sub-meta"></span>';
            b.querySelector('.lib-sub-name').textContent = t.name;
            b.querySelector('.lib-sub-meta').textContent = t.columns.length+' col'+(t.columns.length===1?'':'s');
            b.title = 'Edit table '+t.name;
            b.setAttribute('aria-label', 'Edit table '+t.name+' in '+path+', '+t.columns.length+' columns');
            b.addEventListener('click', ()=>openFile(path, { table:t.name, mode:'tables' }));
            sli.appendChild(b);
            sub.appendChild(sli);
          });
          li.appendChild(sub);
        }
      }
      list.appendChild(li);
    });
    box.appendChild(list);
  }

  // + in a section header: create an untitled file and open it with its name selected for renaming.
  function createFile(kind){
    const path = uniquePath(kind, 'untitled');
    Workspace.write(path, newFileContent(kind, path));
    const section = document.getElementById(SECTION_IDS[kind]);
    if(section) section.open = true;
    renderSidebar();
    openFile(path, { focusName:true });
    setStatus('Created '+path+' — type a name, then press Enter.');
    return path;
  }

  function deleteFile(path){
    const kind = fileKindOf(path);
    let msg = 'Delete '+path+'?';
    if(kind==='flow'){
      if(path===currentFlowPath) msg += '\n\nThe flow stays open on the canvas; saving creates the file again.';
    } else {
      const users = usersOf(path).map(n=>'“'+n.name+'”');
      const others = flowsUsing(path).filter(p=>p!==currentFlowPath);
      if(users.length || others.length) msg += '\n\nStill used by '+users.concat(others).join(', ')+'. Those steps will show it as missing.';
    }
    if(!confirm(msg)) return;
    Workspace.remove(path);
    DebugInputs.remove(path);
    if(fileView && fileView.type==='file' && fileView.path===path) closeFileView();
    if(path===currentFlowPath){ setCurrentFlow(null); savedSnapshot = ''; }
    refreshFileUsers(path);
    renderSidebar();
    setStatus('Deleted '+path+'.');
  }

  [['btnAddPrompt','prompt'],['btnAddScript','script'],['btnAddData','data']].forEach(([id, kind])=>{
    const el = document.getElementById(id);
    el.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); createFile(kind); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); e.stopPropagation(); createFile(kind); } });
  });
  const btnAddFlow = document.getElementById('btnAddFlow');
  btnAddFlow.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); newFlow(); });
  btnAddFlow.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); e.stopPropagation(); newFlow(); } });

  /* ---------------- Flow files (flows/*.yaml) ---------------- */
  // The .yaml is the flow's file on disk; its canvas layout is kept alongside it so it reopens as drawn.
  let currentFlowPath = null;
  let savedSnapshot = '';
  let draftSnapshot = '';

  function currentFlowName(){ return String(flowMeta.name||'').trim() || 'Untitled Flow'; }
  function snapshot(){ return JSON.stringify({ s: state, n: flowMeta.name, d: flowMeta.desc }); }
  function isDirty(){ return snapshot()!==savedSnapshot; }
  function markSaved(){ savedSnapshot = snapshot(); lastDirty = null; updateDirtyIndicator(); }
  function recountIds(){
    nodeCounter = state.nodes.reduce((m,n)=>{ const match = /_(\d+)$/.exec(n.id); return match ? Math.max(m, parseInt(match[1],10)) : m; }, 0);
  }

  function setCurrentFlow(path){
    currentFlowPath = path || null;
    try{ localStorage.setItem('flow_machine_current', currentFlowPath || ''); }catch(e){}
  }

  let lastDirty = null;
  function updateDirtyIndicator(){
    const dirty = isDirty();
    const btn = document.getElementById('btnSave');
    btn.classList.toggle('is-dirty', dirty);
    btn.title = (dirty ? 'Save unsaved changes to ' : 'Saved to ')+(currentFlowPath || 'flows/'+(slugify(currentFlowName()) || 'flow')+'.yaml')+' (Ctrl+S)';
    btn.setAttribute('aria-label', dirty ? 'Save (unsaved changes)' : 'Save');
    if(dirty!==lastDirty){ lastDirty = dirty; renderFileSection('flow'); }
  }

  // The canvas draft survives reloads even when it hasn't been saved to its .yaml file yet.
  function saveDraft(){
    try{
      const snap = snapshot();
      localStorage.setItem('flow_machine_state', JSON.stringify({ state, name: flowMeta.name, desc: flowMeta.desc, path: currentFlowPath, saved: savedSnapshot }));
      draftSnapshot = snap;
    }catch(e){ /* storage full: the explicit Save still reports its own error */ }
  }
  setInterval(()=>{ updateDirtyIndicator(); if(snapshot()!==draftSnapshot) saveDraft(); }, 1200);
  window.addEventListener('beforeunload', saveDraft);

  function saveFlow(){
    const name = currentFlowName(), desc = flowMeta.desc;
    const path = currentFlowPath && Workspace.exists(currentFlowPath) ? currentFlowPath : (currentFlowPath || uniquePath('flow', slugify(name) || 'flow'));
    Workspace.write(path, generateYaml(), { state: JSON.parse(JSON.stringify(state)), name, desc });
    Workspace.flush();
    setCurrentFlow(path);
    markSaved();
    saveDraft();
    renderSidebar();
    Logger.success('Saved '+path);
    setStatus('Saved '+path+'.');
    return path;
  }

  function loadFlowFile(path){
    const entry = Workspace.entry(path);
    if(!entry) return;
    if(!entry.state){ setStatus(path+' has no canvas layout, so it can’t be opened here.'); return; }
    if(path===currentFlowPath && !isDirty()){ setStatus(path+' is already open.'); return; }
    if(isDirty() && !confirm('Discard unsaved changes to “'+currentFlowName()+'” and open '+path+'?')) return;
    closeFileView();
    state = migrateState(JSON.parse(JSON.stringify(entry.state)));
    recountIds();
    flowMeta.name = entry.name || 'Untitled Flow';
    flowMeta.desc = entry.desc || '';
    selectedNodeId = null; selectedEdgeId = null;
    setCurrentFlow(path);
    renderAll();
    fitToView();
    markSaved();
    saveDraft();
    setStatus('Opened '+path+'.');
  }

  function newFlow(){
    if(state.nodes.length && isDirty() && !confirm('Discard unsaved changes to “'+currentFlowName()+'”?')) return;
    closeFileView();
    state = { nodes:[], edges:[] };
    nodeCounter = 0;
    selectedNodeId = null; selectedEdgeId = null;
    flowMeta.name = 'Untitled Flow';
    flowMeta.desc = '';
    setCurrentFlow(null);
    const trigger = addNode('trigger', 120, 240);
    trigger.name = 'Start';
    renderAll();
    fitToView();
    markSaved();
    setStatus('New flow — press Save to create its .yaml file in flows/.');
  }

  /* ---------------- Upload: files are filed by type ---------------- */
  function ingestFiles(fileList){
    const files = Array.from(fileList || []);
    if(!files.length) return;
    const byExt = { md:'prompt', py:'script', sql:'data' };
    let pending = files.length, added = [];
    const finish = ()=>{
      if(--pending>0) return;
      renderSidebar();
      setStatus(added.length ? 'Added '+added.join(', ')+'.' : 'Nothing added — upload .md, .py or .sql files.');
    };
    files.forEach(file=>{
      const kind = byExt[(file.name.split('.').pop() || '').toLowerCase()];
      if(!kind){ Logger.warn('Skipped '+file.name+': only .md, .py and .sql files can be added.'); finish(); return; }
      const reader = new FileReader();
      reader.onload = ()=>{
        const path = uniquePath(kind, file.name);
        Workspace.write(path, String(reader.result));
        added.push(path);
        Logger.info('Added '+path, { size: file.size });
        finish();
      };
      reader.onerror = ()=>{ Logger.error('Failed to read uploaded file: '+file.name, { error: String(reader.error) }); finish(); };
      reader.readAsText(file);
    });
  }
  const scriptsUpload = document.getElementById('scriptsUpload');
  const scriptsFileInput = document.getElementById('scriptsFileInput');
  scriptsUpload.addEventListener('click', ()=>scriptsFileInput.click());
  scriptsUpload.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); scriptsFileInput.click(); } });
  scriptsFileInput.addEventListener('change', ()=>{ ingestFiles(scriptsFileInput.files); scriptsFileInput.value = ''; });
  scriptsUpload.addEventListener('dragover', e=>{ e.preventDefault(); scriptsUpload.classList.add('dragover'); });
  scriptsUpload.addEventListener('dragleave', ()=>scriptsUpload.classList.remove('dragover'));
  scriptsUpload.addEventListener('drop', e=>{ e.preventDefault(); scriptsUpload.classList.remove('dragover'); ingestFiles(e.dataTransfer.files); });

  /* ---------------- YAML generation ---------------- */
  // Steps reference files by path (prompts/*.md, scripts/*.py, data/*.sql); their content lives in those files.
  function buildStepConfig(n){
    const c = n.config || {};
    const cfg = {};
    switch(n.type){
      case 'runPrompt':
        cfg.promptFile = c.promptFile || '';
        if(c.task) cfg.task = c.task;
        if(c.reasoning) cfg.reasoning = true;
        break;
      case 'loop': {
        // Items come from the output of the step wired into the loop's input.
        const edge = (buildStepConfig.edges || []).find(e=>e.to===n.id);
        if(edge) cfg.inputFrom = edge.from;
        cfg.itemVariable = c.itemVariable || 'item';
        break;
      }
      case 'data':
        cfg.database = c.database || '';
        cfg.action = c.action || 'read';
        cfg.table = c.table || '';
        break;
      case 'script':
        cfg.scriptFile = c.scriptFile || '';
        cfg.language = 'python';
        break;
    }
    return cfg;
  }

  function buildYamlObject(st, name, desc){
    st = st || state;
    buildStepConfig.edges = st.edges;
    const trigger = st.nodes.find(n=>n.type==='trigger');
    const steps = st.nodes.filter(n=>n.type!=='trigger').map(n=>{
      const def = NODE_TYPES[n.type];
      const cfg = buildStepConfig(n);
      const step = { id:n.id, type:n.type, name:n.name };
      if(Object.keys(cfg).length) step.config = cfg;
      if(def.outputs.length===1){
        const e = st.edges.find(ed=>ed.from===n.id && ed.fromPort==='out');
        if(e) step.next = e.to;
      } else if(def.outputs.length>1){
        const branches = {};
        def.outputs.forEach(portName=>{
          const e = st.edges.find(ed=>ed.from===n.id && ed.fromPort===portName);
          if(e) branches[portName] = e.to;
        });
        if(Object.keys(branches).length) step.branches = branches;
      }
      return step;
    });

    const result = { name: name || 'Untitled Flow', description: desc || '' };
    if(trigger){
      const tc = trigger.config || {};
      const t = { type: tc.triggerType || 'manual', name: trigger.name };
      if(tc.triggerType==='cron' && tc.cronExpression) t.cron = tc.cronExpression;
      // The signing secret is never written to the file, only the name of the server env var that holds it.
      if(tc.triggerType==='webhook') t.webhook = { method: tc.webhookMethod || 'POST', path: tc.webhookPath || '', secretEnv: webhookSecretEnv(tc) };
      const e = st.edges.find(ed=>ed.from===trigger.id && ed.fromPort==='out');
      if(e) t.next = e.to;
      result.trigger = t;
    }
    result.steps = steps;
    return result;
  }

  function yamlScalar(v){
    if(v===null || v===undefined) return 'null';
    if(typeof v==='boolean' || typeof v==='number') return String(v);
    const s = String(v);
    if(s==='') return '""';
    if(s.includes('\n')){
      const lines = s.split('\n').map(l=>'  '+l);
      return '|\n'+lines.join('\n');
    }
    const needsQuote = /^[\s]|[\s]$|[:#\[\]{},&*!|>'"%@`]|^(true|false|null|~|-?\d+(\.\d+)?)$/i.test(s) || s==='';
    if(needsQuote) return JSON.stringify(s);
    return s;
  }

  function toYaml(value, indent){
    indent = indent || 0;
    const pad = '  '.repeat(indent);
    if(Array.isArray(value)){
      if(value.length===0) return pad+'[]\n';
      let out = '';
      value.forEach(item=>{
        if(item && typeof item==='object' && !Array.isArray(item)){
          const keys = Object.keys(item);
          out += pad+'- ';
          keys.forEach((k,i)=>{
            const v = item[k];
            const prefix = i===0 ? '' : pad+'  ';
            if(v && typeof v==='object'){
              out += (i===0?'':prefix)+k+':\n'+toYaml(v, indent+2);
            } else {
              out += (i===0?'':prefix)+k+': '+yamlScalar(v)+'\n';
            }
          });
        } else {
          out += pad+'- '+yamlScalar(item)+'\n';
        }
      });
      return out;
    }
    if(value && typeof value==='object'){
      const keys = Object.keys(value);
      if(keys.length===0) return pad+'{}\n';
      let out = '';
      keys.forEach(k=>{
        const v = value[k];
        if(Array.isArray(v)){
          out += pad+k+':\n'+toYaml(v, indent+1);
        } else if(v && typeof v==='object'){
          out += pad+k+':\n'+toYaml(v, indent+1);
        } else {
          out += pad+k+': '+yamlScalar(v)+'\n';
        }
      });
      return out;
    }
    return pad+yamlScalar(value)+'\n';
  }

  function generateYaml(st, name, desc){
    if(!st){ st = state; name = currentFlowName(); desc = flowMeta.desc; }
    const obj = buildYamlObject(st, name, desc);
    let out = '# Flow Machine flow. Prompts, scripts and database schemas are referenced by path.\n';
    out += 'name: '+yamlScalar(obj.name)+'\n';
    out += 'description: '+yamlScalar(obj.description)+'\n';
    if(obj.trigger) out += 'trigger:\n'+toYaml(obj.trigger,1);
    out += obj.steps && obj.steps.length ? 'steps:\n'+toYaml(obj.steps,1) : 'steps: []\n';
    return out;
  }

  function filterCommands(query){
    const q = query.trim().toLowerCase();
    cmdFiltered = COMMANDS.filter(c=>!q || c.label.toLowerCase().includes(q) || (c.hint||'').toLowerCase().includes(q));
    cmdActiveIndex = 0;

  function renderCommandList(){
    const list = document.getElementById('cmdList');
    list.innerHTML = '';
    if(cmdFiltered.length===0){
      list.innerHTML = '<div class="cmd-empty">No matching commands.</div>';
      return;
    }
    cmdFiltered.forEach((c,i)=>{
      const item = document.createElement('div');
      item.className = 'cmd-item' + (i===cmdActiveIndex ? ' active' : '');
      item.innerHTML = '<span class="cmd-item-main"><span class="cmd-icon">'+(ICONS[c.icon]||'')+'</span><span>'+escapeHtml(c.label)+'</span></span><span class="cmd-hint">'+escapeHtml(c.hint||'')+'</span>';
      item.addEventListener('mousedown', e=>{ e.preventDefault(); runCommand(c); });
      item.addEventListener('mouseenter', ()=>{ cmdActiveIndex=i; renderCommandList(); });
      list.appendChild(item);
    });
  }

    else if(e.key==='ArrowUp'){ e.preventDefault(); cmdActiveIndex=Math.max(0, cmdActiveIndex-1); renderCommandList(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(cmdFiltered[cmdActiveIndex]) runCommand(cmdFiltered[cmdActiveIndex]); }
    else if(e.key==='Escape'){ e.preventDefault(); closeCommandPalette(); }

  function aiExecute(text){
    const m = /^\/([\w-]+)\s*([\s\S]*)$/.exec(text.trim());
    const cmd = m && AI_COMMANDS.find(c=>c.name===m[1].toLowerCase());
    if(!cmd){ aiStatus('warn', 'Unknown command. Type / to see every command.'); return; }
    if(fileView && ['add','connect','select','delete','run','sample','clear','new','fit','zoom'].includes(cmd.name)) closeFileView();
    const result = cmd.run(m[2].trim());
    if(typeof result==='string') aiStatus('ok', result);
    else if(result && result.warn) aiStatus('warn', result.warn);
    else if(result && result.running) aiStatus('run', result.running);
  }

  // Mock of the AI turning plain language into one of the commands above.
  function aiInterpret(text){
    let m;
    if((m = /\b(?:add|create|insert|new)\b\s+(?:an?\s+)?(.+?)(?:\s+node)?$/i.exec(text)) && aiNodeType(m[1])) return '/add '+aiNodeType(m[1]);
    if((m = /\b(?:connect|link|wire)\s+(.+?)\s+(?:to|with|->|→)\s+(.+)$/i.exec(text))) return '/connect '+m[1]+' to '+m[2];
    if((m = /\b(?:rename|call)\s+(?:the\s+)?flow\s+(?:to\s+)?(.+)$/i.exec(text))) return '/name '+m[1];
    if((m = /\brename\b.*?\bto\s+(.+)$/i.exec(text))) return '/rename '+m[1];
    if((m = /\b(?:delete|remove)\s+(?:the\s+)?(.+?)(?:\s+node)?$/i.exec(text))) return /^(it|this|that|selected)$/i.test(m[1]) ? '/delete' : '/delete '+m[1];
    if((m = /\bzoom\b.*?(\d+)/i.exec(text))) return '/zoom '+m[1];
    if(/\bzoom in\b/i.test(text)) return '/zoom '+Math.round(view.zoom*100+20);
    if(/\bzoom out\b/i.test(text)) return '/zoom '+Math.round(view.zoom*100-20);
    if(/\bfit\b|\bwhole flow\b/i.test(text)) return '/fit';
    if(/\b(export|download|yaml)\b/i.test(text)) return '/export';
    if(/\blibrary\b/i.test(text)) return '/library';
    if(/\bsave\b/i.test(text)) return '/save';
    if(/\b(sample|example|demo)\b/i.test(text)) return '/sample';
    if(/\b(clear|wipe|reset)\b/i.test(text)) return '/clear';
    if(/\b(dark|light|theme)\b/i.test(text)) return '/theme';
    if((m = /\bdebug\b(?:\s+(?:the\s+)?(.+?))?(?:\s+(?:node|step|file|prompt|script))?$/i.exec(text))) return m[1] && aiFindNode(m[1]) ? '/debug '+m[1] : '/debug';
    if(fileView && fileView.type==='file' && isDebuggable(fileKindOf(fileView.path)) && /\b(run|execute|test|try)\b/i.test(text)) return '/debug';
    if(/\b(run|execute|start|test)\b/i.test(text)) return '/run';
    if((m = /\b(?:open|edit)\s+(?:the\s+)?(.+?)(?:\s+(?:node|file|prompt|script))?$/i.exec(text)) && aiFindNode(m[1]) && canOpenNode(aiFindNode(m[1]))) return '/open '+m[1];
    if((m = /\b(?:select|go to|show|focus|open|find)\s+(?:the\s+)?(.+?)(?:\s+node)?$/i.exec(text)) && aiFindNode(m[1])) return '/select '+m[1];
    const hit = state.nodes.find(n=>text.toLowerCase().includes(n.name.toLowerCase()));
    return hit ? '/select '+hit.id : null;
  }
  function aiRunIntent(text){
    aiStatus('run', 'Working on “'+(text.length>48 ? text.slice(0,48)+'…' : text)+'”');
    setTimeout(()=>{
      const action = aiInterpret(text);
      if(action) aiExecute(action);
      else aiStatus('warn', 'I couldn’t turn that into an action. Try “add a loop node” or type /.');
    }, 600);
  }

  /* Slash menu */
  function aiParseSlash(value){
    const m = /^\/([\w-]*)(\s+([\s\S]*))?$/.exec(value);
    return m ? { name: m[1].toLowerCase(), spaced: !!m[2], arg: (m[3]||'').trim().toLowerCase() } : null;
  }
  function aiUpdateMenu(){
    const p = aiParseSlash(aiPrompt.value);
    if(!p){ aiCloseMenu(); return; }
    let items;
    if(!p.spaced){
      items = AI_COMMANDS.filter(c=>c.name.includes(p.name))
        .sort((a,b)=>(b.name.startsWith(p.name)?1:0)-(a.name.startsWith(p.name)?1:0))
        .map(c=>({ kind:'cmd', cmd:c }));
    } else {
      const cmd = AI_COMMANDS.find(c=>c.name===p.name);
      if(!cmd || !cmd.suggest){ aiCloseMenu(); return; }
      items = cmd.suggest==='types'
        ? Object.keys(NODE_TYPES).filter(t=>(t+' '+NODE_TYPES[t].label).toLowerCase().includes(p.arg)).map(t=>({ kind:'arg', cmd, value:t, label:NODE_TYPES[t].label, icon:t, color:NODE_TYPES[t].color, desc:NODE_TYPES[t].single ? 'One per flow' : NODE_TYPES[t].outputs.join(' · ')+' output' }))
        : state.nodes.filter(n=>(n.name+' '+n.type).toLowerCase().includes(p.arg)).slice(0,8).map(n=>({ kind:'arg', cmd, value:n.id, label:n.name, icon:n.type, color:NODE_TYPES[n.type].color, desc:NODE_TYPES[n.type].label }));
    }
    aiMenu.items = items;
    aiRenderMenu(p);
  }
  function aiRenderMenu(p){
    aiMenuEl.hidden = false;
    aiPrompt.setAttribute('aria-expanded','true');
    if(!aiMenu.items.length){
      aiMenuEl.innerHTML = '<div class="ai-slash-empty">No matches. Try <span class="cmd-kbd">/help</span>.</div>';
      aiPrompt.removeAttribute('aria-activedescendant');
      return;
    }
    let group = null, html = '';
    aiMenu.items.forEach((item, i)=>{
      const g = item.kind==='cmd' ? item.cmd.group : (item.cmd.suggest==='types' ? 'Node types' : 'Nodes on canvas');
      if(g!==group){ group = g; html += '<div class="ai-slash-group" role="presentation">'+g+'</div>'; }
      let label, desc, icon;
      if(item.kind==='cmd'){
        const name = item.cmd.name, at = p.name ? name.indexOf(p.name) : -1;
        label = '/'+(at>=0 ? escapeHtml(name.slice(0,at))+'<mark>'+escapeHtml(name.slice(at, at+p.name.length))+'</mark>'+escapeHtml(name.slice(at+p.name.length)) : escapeHtml(name))+
          (item.cmd.args ? ' <em>'+escapeHtml(item.cmd.args)+'</em>' : '');
        desc = escapeHtml(item.cmd.desc);
        icon = aiIc(item.cmd.icon);
      } else {
        label = '<em>/'+escapeHtml(item.cmd.name)+'</em> '+escapeHtml(item.label);
        desc = escapeHtml(item.desc);
        icon = aiIc(item.icon, item.color);
      }
      html += '<div class="ai-slash-item" role="option" id="ai-opt-'+i+'" data-index="'+i+'" aria-selected="false">'+
        '<span class="ai-slash-icon">'+icon+'</span><span class="ai-slash-text"><span class="ai-slash-cmd">'+label+'</span><span class="ai-slash-desc">'+desc+'</span></span></div>';
    });
    html += '<div class="ai-slash-foot" aria-hidden="true"><span>↑ ↓ choose</span><span>Enter run · Esc close</span></div>';
    aiMenuEl.innerHTML = html;
    aiSetActive(0);
  }
  function aiSetActive(i){
    if(!aiMenu.items.length) return;
    aiMenu.active = (i + aiMenu.items.length) % aiMenu.items.length;
    aiMenuEl.querySelectorAll('.ai-slash-item').forEach(el=>{
      const on = Number(el.dataset.index)===aiMenu.active;
      el.classList.toggle('is-active', on); el.setAttribute('aria-selected', String(on));
      if(on){ aiPrompt.setAttribute('aria-activedescendant', el.id); el.scrollIntoView({ block:'nearest' }); }
    });
  }
  function aiCloseMenu(){
    aiMenuEl.hidden = true; aiMenu.items = [];
    aiPrompt.setAttribute('aria-expanded','false');
    aiPrompt.removeAttribute('aria-activedescendant');
  }
  function aiPick(i){
    const item = aiMenu.items[i];
    if(!item) return;
    if(item.kind==='cmd' && item.cmd.args){ aiSetPrompt('/'+item.cmd.name+' '); return; }
    const text = item.kind==='cmd' ? '/'+item.cmd.name : '/'+item.cmd.name+' '+item.value;
    aiSetPrompt(''); aiCloseMenu(); aiExecute(text);
  }
  function aiSetPrompt(value){
    aiPrompt.value = value;
    aiAutosize(); aiUpdateSend(); aiUpdateMenu();
    aiPrompt.focus();
    aiPrompt.setSelectionRange(value.length, value.length);
  }
  function aiAutosize(){ aiPrompt.style.height = 'auto'; aiPrompt.style.height = Math.min(aiPrompt.scrollHeight, 140)+'px'; }
  function aiUpdateSend(){ document.getElementById('aiSend').disabled = !aiPrompt.value.trim(); }
  function aiSubmit(){
    const text = aiPrompt.value.trim();
    if(!text) return;
    aiSetPrompt(''); aiCloseMenu();
    if(text.charAt(0)==='/') aiExecute(text); else aiRunIntent(text);
  }

  aiPrompt.addEventListener('input', ()=>{ aiAutosize(); aiUpdateSend(); aiUpdateMenu(); });
  aiPrompt.addEventListener('keydown', e=>{
    const open = !aiMenuEl.hidden && aiMenu.items.length;
    if(open && e.key==='ArrowDown'){ e.preventDefault(); aiSetActive(aiMenu.active+1); }
    else if(open && e.key==='ArrowUp'){ e.preventDefault(); aiSetActive(aiMenu.active-1); }
    else if(open && (e.key==='Tab' || (e.key==='Enter' && !e.shiftKey))){ e.preventDefault(); aiPick(aiMenu.active); }
    else if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); aiSubmit(); }
    else if(e.key==='Escape' && !aiMenuEl.hidden){ e.preventDefault(); e.stopPropagation(); aiCloseMenu(); }
  });
  aiMenuEl.addEventListener('mousedown', e=>e.preventDefault());
  aiMenuEl.addEventListener('click', e=>{ const item = e.target.closest('.ai-slash-item'); if(item) aiPick(Number(item.dataset.index)); });
  aiMenuEl.addEventListener('mousemove', e=>{ const item = e.target.closest('.ai-slash-item'); if(item && Number(item.dataset.index)!==aiMenu.active) aiSetActive(Number(item.dataset.index)); });
  document.getElementById('aiComposer').addEventListener('submit', e=>{ e.preventDefault(); aiSubmit(); });
  const aiDock = document.getElementById('aiDock');
  aiDock.addEventListener('wheel', e=>e.stopPropagation(), { passive:true });
  // Reserve room under the file view for the composer plus the one-line status pill, so neither covers the file.
  function measureDockSpace(){
    const composer = document.getElementById('aiComposer');
    const bottom = canvasWrapper.getBoundingClientRect().bottom;
    const space = bottom - composer.getBoundingClientRect().top + 52;
    canvasWrapper.style.setProperty('--dock-space', Math.max(120, Math.round(space))+'px');
    // Top of the whole dock (status pill included when shown): the zoom controls sit 10px above it on mobile.
    canvasWrapper.style.setProperty('--dock-above', Math.round(bottom - document.getElementById('aiDock').getBoundingClientRect().top + 10)+'px');
  }
  if('ResizeObserver' in window){ const ro = new ResizeObserver(measureDockSpace); ro.observe(document.getElementById('aiComposer')); ro.observe(aiDock); }
  window.addEventListener('resize', measureDockSpace);
  measureDockSpace();
  aiDock.addEventListener('click', e=>{
    const fill = e.target.closest('[data-ai-fill]');
    if(fill){ aiSetPrompt(fill.dataset.aiFill); return; }
    if(e.target.closest('[data-ai-drop-ctx]')){
      const prev = selectedNodeId; selectedNodeId = null;
      applySelectionClasses(prev, null); aiPrompt.focus();
    }
  });
  document.addEventListener('pointerdown', e=>{ if(!e.target.closest('#aiComposer')) aiCloseMenu(); });
  document.addEventListener('keydown', e=>{
    const t = document.activeElement;
    const typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
    if(e.key==='/' && !typing && !e.ctrlKey && !e.metaKey && document.getElementById('cmdPaletteOverlay').style.display!=='flex'){
      e.preventDefault(); aiSetPrompt('/');
    }
  });

  /* ---------------- Init ---------------- */
  function tryRestore(){
    try{
      const raw = localStorage.getItem('flow_machine_state');
      if(!raw) return false;
      const data = JSON.parse(raw);
      if(!data || !data.state || !Array.isArray(data.state.nodes)) return false;
      state = migrateState(data.state);
      recountIds();
      flowMeta.name = data.name || 'Untitled Flow';
      flowMeta.desc = data.desc || '';
      setCurrentFlow(data.path && Workspace.exists(data.path) ? data.path : null);
      renderAll();
      // Keep unsaved edits marked as unsaved after a reload.
      savedSnapshot = typeof data.saved==='string' ? data.saved : '';
      updateDirtyIndicator();
      setStatus('Restored your last session'+(currentFlowPath ? ' ('+currentFlowPath+')' : '')+'.');
      return true;
    }catch(err){
      Logger.error('Failed to restore previous session from browser storage.', { error: String(err) });
      setStatus('Could not restore previous session (corrupt storage). Starting fresh.');
    }
    return false;
  }

  Logger.attachPanel(document.getElementById('logsBox'));
  document.getElementById('btnClearLogs').addEventListener('click', e=>{
    e.preventDefault();
    e.stopPropagation();
    Logger.clear();
  });
  ServerLink.connect();

  Workspace.load();
  migrateLegacyLibraries();
  if(Workspace.isEmpty()) seedSampleFiles();
  if(!tryRestore()){
    loadSample();
  }
  fitToView();
  renderSidebar();
  updateDirtyIndicator();

  /* ---------------- Theme ----------------
     Follows the system appearance until the user picks one with the "Toggle Light / Dark Theme" command or /theme. */
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
  }
  function savedTheme(){ try{ const t = localStorage.getItem('flow_machine_theme'); return t==='light' || t==='dark' ? t : null; }catch(e){ return null; } }
  function toggleTheme(){
    const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('flow_machine_theme', next); }catch(e){}
    return next;
  }
  applyTheme(savedTheme() || (darkQuery.matches ? 'dark' : 'light'));
  darkQuery.addEventListener('change', e=>{ if(!savedTheme()) applyTheme(e.matches ? 'dark' : 'light'); });

  /* ---------------- Side panel: docked on wide screens, a slide-in drawer at 900px and below ---------------- */
  const narrowQuery = window.matchMedia('(max-width: 900px)');
  const leftPanel = document.getElementById('leftpanel');
  const panelScrim = document.getElementById('panelScrim');
  const btnPanel = document.getElementById('btnPanel');
  function setPanel(open){
    const drawer = narrowQuery.matches;
    open = drawer && open;
    const wasOpen = document.body.classList.contains('panel-open');
    document.body.classList.toggle('panel-open', open);
    panelScrim.hidden = !open;
    btnPanel.setAttribute('aria-expanded', String(open));
    leftPanel.inert = drawer && !open;
    if(open){ leftPanel.setAttribute('role', 'dialog'); leftPanel.setAttribute('aria-modal', 'true'); }
    else { leftPanel.removeAttribute('role'); leftPanel.removeAttribute('aria-modal'); }
    if(open && !wasOpen) setTimeout(()=>document.getElementById('btnPanelClose').focus(), 0);
    if(!open && wasOpen && (leftPanel.contains(document.activeElement) || document.activeElement===document.body)) btnPanel.focus({ preventScroll:true });
  }
  function closePanelIfDrawer(){ if(narrowQuery.matches) setPanel(false); }
  btnPanel.addEventListener('click', ()=>setPanel(!document.body.classList.contains('panel-open')));
  document.getElementById('btnPanelClose').addEventListener('click', ()=>setPanel(false));
  panelScrim.addEventListener('click', ()=>setPanel(false));
  narrowQuery.addEventListener('change', ()=>setPanel(false));
  // Opening a file, a flow or a table from the drawer returns to the canvas.
  leftPanel.addEventListener('click', e=>{
    if(e.target.closest('.lib-file-main, .lib-file-sub, .lib-add:not(#btnClearLogs)')) setTimeout(closePanelIfDrawer, 0);
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && document.body.classList.contains('panel-open')){ e.preventDefault(); e.stopImmediatePropagation(); setPanel(false); }
  }, true);
  setPanel(false);

  /* ---------------- Sidebar disclosure motion (same pattern as design.html accordions) ----------------
     Keeps native <details> semantics; animates height and fades the content. Programmatic .open stays instant. */
  (function initLibSectionMotion(){
    const easing = 'cubic-bezier(0.32, 0.72, 0, 1)';
    const reduced = ()=> window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('details.lib-section').forEach(details=>{
      const summary = details.querySelector('summary');
      if(!summary) return;
      let anim = null;
      const content = ()=> Array.from(details.children).filter(el=>el!==summary && el.tagName!=='INPUT');
      const finish = open=>{
        details.open = open;
        details.classList.remove('is-closing');
        details.style.height = ''; details.style.overflow = '';
        anim = null;
      };
      summary.addEventListener('click', e=>{
        // Header action buttons (+, clear logs) cancel the toggle themselves.
        if(e.defaultPrevented || e.target.closest('.lib-add')) return;
        if(reduced() || typeof details.animate !== 'function') return;
        e.preventDefault();
        const start = details.offsetHeight;
        const closing = details.open && !details.classList.contains('is-closing');
        if(anim) anim.cancel();
        details.style.overflow = 'hidden';
        if(closing){
          details.classList.add('is-closing');
          const end = summary.offsetHeight + parseFloat(getComputedStyle(details).paddingTop) + parseFloat(getComputedStyle(details).borderTopWidth);
          anim = details.animate({ height:[start+'px', end+'px'] }, { duration:280, easing });
          content().forEach(el=>{ const a = el.animate({ opacity:[1,0] }, { duration:160, easing:'ease-out', fill:'forwards' }); a.onfinish = ()=>a.cancel(); });
          anim.onfinish = ()=>finish(false);
        } else {
          details.classList.remove('is-closing');
          details.open = true;
          const end = details.offsetHeight;
          anim = details.animate({ height:[start+'px', end+'px'] }, { duration:320, easing });
          content().forEach(el=>el.animate({ opacity:[0,1], transform:['translateY(-4px)','none'] }, { duration:280, delay:40, easing, fill:'backwards' }));
          anim.onfinish = ()=>finish(true);
        }
        anim.oncancel = ()=>{ details.style.height = ''; };
      });
    });
  })();
})();
</script>
</body>
