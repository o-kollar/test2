<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Flow Machine — Visual Flow Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<script>
// Apply the saved theme before first paint to avoid a theme flash.
(function(){ try{ var t=localStorage.getItem('flow_machine_theme'); if(t!=='light'&&t!=='dark') t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; document.documentElement.setAttribute('data-theme',t); document.documentElement.style.colorScheme=t; }catch(e){} }());
</script>
<style>
  /* ==========================================================================
     DESIGN TOKENS — mirrors design.html (Amber system, HIG-aligned)
     Light: Apple cool system greys + near-black accent. Dark: warm near-blacks + near-white accent.
     All text tokens meet WCAG AA 4.5:1 on bg / surface / surface-alt / surface-hover.
     ========================================================================== */
  :root{
    --bg: #F5F5F7; --surface: #FFFFFF; --surface-alt: #F2F2F7; --surface-hover: #E5E5EA; --surface-active: #D1D1D6;
    --surface-glass: rgba(255, 255, 255, 0.86);
    --border: #E5E5EA; --border-strong: #C7C7CC; --border-focus: #1D1D1F;
    --text: #1D1D1F; --text-muted: #56565B; --text-faint: #66666B; --text-inverse: #FFFFFF;
    --text-placeholder: #616166; --control-border: #8C8C91; --control-selected: #FFFFFF;
    --accent: #1D1D1F; --accent-hover: #424245; --accent-tint: rgba(29, 29, 31, 0.06);
    --accent-tint-hover: rgba(29, 29, 31, 0.10); --accent-glow: rgba(0, 0, 0, 0.18); --accent-contrast: #FFFFFF;
    --focus-ring: var(--accent);
    --field-fill: rgba(118, 118, 128, 0.12); --field-fill-hover: rgba(118, 118, 128, 0.18);
    --separator: rgba(60, 60, 67, 0.22);
    --success: #1A7D37; --success-dim: #EAF5ED; --success-border: #A6D7B2;
    --warning: #956300; --warning-dim: #FDF5E5; --warning-border: #F7D488;
    --danger: #CD2D23; --danger-dim: #FCEAE8; --danger-border: #F5A9A4;
    --info: #2563EB; --info-dim: #EFF6FF; --info-border: #93C5FD;
    /* Node-type identity colors (Apple system colors, ≥3:1 on every light/dark surface). */
    --node-trigger: #5856D6; --node-prompt: #007AFF; --node-loop: #278FA2; --node-data: #AF52DE; --node-script: #279643;
    --syntax-var: #A43AD9;
    --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 9999px;
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.07), 0 16px 28px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.10), 0 28px 64px rgba(0, 0, 0, 0.06);
    --font-serif: "Playfair Display", Georgia, serif;
    --font-sans: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --dur-fast: 140ms; --dur-med: 260ms; --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    /* Apple-style deceleration curve used for disclosures, switches and overlays. */
    --ease-ios: cubic-bezier(0.32, 0.72, 0, 1);
  }
  [data-theme="dark"]{
    --bg: #121211; --surface: #1B1A19; --surface-alt: #242220; --surface-hover: #2C2926; --surface-active: #35322E;
    --surface-glass: rgba(27, 26, 25, 0.88);
    --border: rgba(255, 255, 255, 0.10); --border-strong: rgba(255, 255, 255, 0.18); --border-focus: #F5F3EF;
    --text: #F5F3EF; --text-muted: #A59D92; --text-faint: #90887E; --text-inverse: #191817;
    --text-placeholder: #A49D94; --control-border: #6E6C68; --control-selected: #45413C;
    --accent: #F5F3EF; --accent-hover: #FFFFFF; --accent-tint: rgba(245, 243, 239, 0.10);
    --accent-tint-hover: rgba(245, 243, 239, 0.16); --accent-glow: rgba(0, 0, 0, 0.45); --accent-contrast: #121211;
    --field-fill: rgba(165, 157, 146, 0.14); --field-fill-hover: rgba(165, 157, 146, 0.20);
    --separator: rgba(255, 255, 255, 0.10);
    --success: #53C378; --success-dim: rgba(83, 195, 120, 0.14); --success-border: rgba(83, 195, 120, 0.3);
    --warning: #F2B957; --warning-dim: rgba(242, 185, 87, 0.14); --warning-border: rgba(242, 185, 87, 0.3);
    --danger: #F37A70; --danger-dim: rgba(243, 122, 112, 0.14); --danger-border: rgba(243, 122, 112, 0.3);
    --info: #6BA5FA; --info-dim: rgba(107, 165, 250, 0.14); --info-border: rgba(107, 165, 250, 0.3);
    --node-trigger: #7D7AFF; --node-prompt: #3D9BFF; --node-loop: #40C8E0; --node-data: #BF5AF2; --node-script: #30D158;
    --syntax-var: #BF5AF2;
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 16px 44px rgba(0, 0, 0, 0.7);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);transition:background-color var(--dur-med) var(--ease-out),color var(--dur-med) var(--ease-out);}
  :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;}
  /* iOS/iPadOS Safari: adopt the Dynamic Type body size so rem-based text follows the user's text-size setting. */
  @supports (-webkit-touch-callout: none){ html{font:-apple-system-body;} }
  #app{display:flex;flex-direction:column;height:100vh;}

  /* Slim, low-contrast scrollbars: invisible until hovered (WebKit), thin & muted (Firefox) */
  *{scrollbar-width:thin;scrollbar-color:transparent transparent;}
  *:hover{scrollbar-color:var(--border-strong) transparent;}
  *::-webkit-scrollbar{width:7px;height:7px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:transparent;border-radius:10px;}
  *:hover::-webkit-scrollbar-thumb{background:var(--border-strong);}
  *::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

  /* Top bar */
  #topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);box-shadow:var(--shadow-xs);flex-shrink:0;position:relative;z-index:6;}
  #topbar h1{font-family:var(--font-serif);font-size:1.0625rem;margin:0 14px 0 0;font-weight:700;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px;}
  #topbar input[type=text]{background:transparent;border:1px solid transparent;color:var(--text);border-radius:var(--r-sm);padding:7px 10px;font-size:0.8125rem;font-family:inherit;transition:all var(--dur-fast);}
  #topbar input[type=text]:hover{background:var(--field-fill);}
  #topbar input[type=text]:focus{background:var(--field-fill);outline:2px solid var(--focus-ring);outline-offset:0;}
  .btn-icon-only{width:34px;height:34px;padding:0;border-radius:50%;flex-shrink:0;}
  .cmd-trigger{gap:8px;flex-shrink:0;}
  .cmd-kbd{font-size:0.6875rem;font-weight:700;color:var(--text-faint);background:var(--surface-alt);border:1px solid var(--border);border-radius:5px;padding:2px 5px;line-height:1;}
  .topbar-group{display:flex;align-items:center;gap:2px;padding:3px;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--r-pill);flex-shrink:0;}
  .topbar-group .btn{box-shadow:none;border-color:transparent;background:transparent;}
  .topbar-group .btn:hover{background:var(--surface-hover);border-color:var(--border);}
  .topbar-group .btn-primary{background:var(--accent);border-color:var(--accent);}
  .topbar-group .btn-primary:hover{background:var(--accent-hover);}
  .topbar-group .btn-run{background:var(--success-dim);color:var(--success);}
  .topbar-group .btn-run:hover{background:var(--success);color:var(--accent-contrast);}
  .topbar-group .btn-danger{background:transparent;box-shadow:none;}
  .topbar-group .btn-danger:hover{background:var(--danger-dim);border-color:var(--danger-border);}
  .topbar-divider{width:1px;align-self:stretch;margin:4px 1px;background:var(--border);flex-shrink:0;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-sans);font-size:0.8125rem;font-weight:600;line-height:1;border-radius:var(--r-pill);padding:8px 16px;border:1px solid var(--border);background:var(--surface);color:var(--text);box-shadow:var(--shadow-xs);cursor:pointer;white-space:nowrap;transition:all var(--dur-fast) var(--ease-out);}
  .btn:hover{background:var(--surface-alt);border-color:var(--border-strong);}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);box-shadow:0 1px 3px var(--accent-glow);}
  .btn-primary:hover{background:var(--accent-hover);box-shadow:0 4px 12px var(--accent-glow);}
  .btn-danger{background:var(--danger-dim);border-color:var(--danger-border);color:var(--danger);box-shadow:none;}
  .btn-danger:hover{background:var(--danger);color:var(--accent-contrast);border-color:var(--danger);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted);box-shadow:none;}
  .btn-ghost:hover{background:var(--surface-alt);color:var(--text);}
  .btn-sm{padding:6px 12px;font-size:0.75rem;gap:5px;}
  .btn-run{background:var(--success-dim);border-color:var(--success-border);color:var(--success);}
  .btn-run:hover{background:var(--success);color:var(--accent-contrast);border-color:var(--success);}
  .btn-run:disabled{opacity:.55;cursor:default;transform:none;}
  #topbar .spacer{flex:1;}

  /* Body layout */
  #body{flex:1;display:flex;min-height:0;}

  /* Left column: all configuration (nodes, library, properties/YAML) */
  #leftpanel{width:300px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}

  /* Palette */
  #palette{flex:1;min-height:0;background:var(--surface);padding:16px 14px 22px;overflow-y:auto;}
  .panel-heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 0 10px;}
  .panel-heading h3{font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin:0;}
  .panel-heading-hint{font-size:0.6875rem;color:var(--text-faint);font-weight:500;white-space:nowrap;}
  #paletteList{display:flex;flex-direction:column;gap:6px;}
  .pal-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-alt);border:1px solid var(--border);cursor:grab;font-size:0.7812rem;font-weight:600;color:var(--text);user-select:none;transition:all var(--dur-fast);box-shadow:var(--shadow-xs);}
  .pal-item:hover{border-color:var(--accent);background:var(--surface-hover);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
  .pal-item:active{cursor:grabbing;transform:scale(0.98);}
  .pal-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .pal-icon{width:17px;height:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .pal-icon svg{width:17px;height:17px;stroke:currentColor;}
  .lib-upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 10px;border:1px dashed var(--border-strong);border-radius:var(--r-sm);color:var(--text-faint);font-size:0.7188rem;text-align:center;cursor:pointer;margin-top:4px;transition:all var(--dur-fast);}
  .lib-upload:hover,.lib-upload.dragover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);}
  .lib-upload .btn-ic{width:18px;height:18px;}
  .lib-upload-hint{font-weight:600;}
  .lib-upload-sub{font-size:0.6875rem;color:var(--text-faint);}
  .btn-ic{display:inline-flex;width:14px;height:14px;flex-shrink:0;}
  .btn-ic svg{width:100%;height:100%;}
  .btn .btn-ic{margin-right:1px;}

  /* Prompt / Flow sections (left sidebar, collapsible file-explorer style) */
  .lib-section{margin-top:14px;border-top:1px solid var(--border);padding-top:10px;}
  .lib-section summary{display:flex;align-items:center;gap:7px;cursor:pointer;list-style:none;font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;padding:2px 0;user-select:none;}
  .lib-section summary::-webkit-details-marker{display:none;}
  .lib-section summary .chevron-ic{width:12px;height:12px;color:var(--text-faint);transition:transform 320ms var(--ease-ios);flex-shrink:0;}
  .lib-section summary .chevron-ic svg{width:100%;height:100%;}
  .lib-section[open]:not(.is-closing) summary .chevron-ic{transform:rotate(90deg);}
  .lib-section summary > .btn-ic:nth-of-type(2){color:var(--text-faint);width:13px;height:13px;}
  .lib-section-title{flex:1;}
  .lib-add{width:18px;height:18px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;color:var(--text-faint);}
  .lib-add:hover{background:var(--accent-tint);color:var(--accent);}
  .lib-add .btn-ic{width:11px;height:11px;}
  .lib-file-list{display:flex;flex-direction:column;gap:1px;margin-top:6px;}
  .lib-file{display:flex;align-items:center;gap:6px;padding:6px 6px;border-radius:var(--r-xs);cursor:pointer;font-size:0.75rem;color:var(--text-muted);}
  .lib-file:hover{background:var(--surface-alt);color:var(--text);}
  .lib-file-icon{width:13px;height:13px;flex-shrink:0;color:var(--text-faint);}
  .lib-file-icon svg{width:100%;height:100%;}
  .lib-file-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lib-file-actions{display:none;align-items:center;gap:3px;flex-shrink:0;}
  .lib-file:hover .lib-file-actions{display:flex;}
  .lib-file-action{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-faint);}
  .lib-file-action:hover{background:var(--surface-hover);color:var(--accent);}
  .lib-file-action.del-action:hover{color:var(--danger);}
  .lib-file-action .btn-ic{width:11px;height:11px;}
  .lib-empty-hint{font-size:0.6875rem;color:var(--text-faint);padding:6px 2px;line-height:1.5;}

  /* Canvas */
  #canvas-wrapper{flex:1;overflow:hidden;position:relative;background-color:var(--bg);cursor:grab;}
  #canvas-wrapper.panning{cursor:grabbing;}
  #canvas{position:absolute;top:0;left:0;width:2600px;height:1800px;transform-origin:0 0;}
  svg#edges{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  svg#edges path.edge{fill:none;stroke:var(--border-strong);stroke-width:2;pointer-events:stroke;cursor:pointer;}
  svg#edges path.edge:hover{stroke:var(--text-faint);}
  svg#edges path.edge.selected{stroke:var(--accent);stroke-width:3;}
  svg#edges path.temp{stroke:var(--accent);stroke-dasharray:5,4;}
  svg#edges text.edge-label{fill:var(--text-muted);font-size:0.6875rem;font-family:var(--font-mono);}

  .node{position:absolute;width:250px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);user-select:none;cursor:default;transition:box-shadow var(--dur-med),border-color var(--dur-med);}
  .node.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-md);}
  .node.node-active{border-color:var(--success);box-shadow:0 0 0 4px var(--success-dim),0 0 24px var(--success-border);}
  .node.node-active .node-header{border-color:var(--success-border);}
  @keyframes nodeStatusPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
  .node.node-error{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-dim);}
  .node.node-error .node-header{border-color:var(--danger-border);}

  /* Logs panel (left sidebar, same collapsible pattern as Prompts/Flows) */
  #logsBox{display:flex;flex-direction:column;gap:3px;max-height:200px;overflow-y:auto;font-family:var(--font-mono);}
  .log-row{display:flex;gap:6px;font-size:0.6875rem;padding:3px 5px;border-radius:var(--r-xs);line-height:1.4;}
  .log-time{color:var(--text-faint);flex-shrink:0;}
  .log-msg{color:var(--text-muted);word-break:break-word;}
  .log-row.log-error{background:var(--danger-dim);}
  .log-row.log-error .log-msg{color:var(--danger);}
  .log-row.log-warn .log-msg{color:var(--warning);}
  .log-row.log-success .log-msg{color:var(--success);}
  .log-empty{font-size:0.6875rem;color:var(--text-faint);font-family:var(--font-sans);padding:2px 0;}

  svg#edges path.edge.edge-active{stroke:var(--success);stroke-width:3;}
  .flow-token{fill:var(--success);filter:drop-shadow(0 0 5px var(--success));}
  .node-header{display:flex;align-items:center;gap:6px;padding:9px 11px;border-bottom:1px solid var(--border);cursor:grab;border-radius:var(--r-lg) var(--r-lg) 0 0;}
  .node-header .pal-dot{width:9px;height:9px;}
  /* The header icon doubles as the node's run-state indicator (idle/running/done/error),
     pushed live via NodeStateBus — a bare glyph with no background/border box, only its color changes. */
  .node-header .pal-icon{width:15px;height:15px;background:none;border:none;color:var(--text-faint);transition:color var(--dur-fast);}
  .node-header .pal-icon svg{width:15px;height:15px;stroke:currentColor;}
  .node-header .pal-icon[data-state="running"]{color:var(--info);animation:nodeStatusPulse 1.1s ease-in-out infinite;}
  .node-header .pal-icon[data-state="done"]{color:var(--success);}
  .node-header .pal-icon[data-state="error"]{color:var(--danger);}
  .node-header .title{flex:1;font-size:0.7812rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .node-header .title-input{flex:1;min-width:0;font:inherit;font-size:0.7812rem;font-weight:600;color:var(--text);background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 4px;margin:-2px -4px;cursor:text;}
  .node-header .title-input:hover{background:var(--field-fill);}
  .node-header .title-input:focus{background:var(--field-fill);outline:2px solid var(--focus-ring);outline-offset:0;}
  .node-header .del{cursor:pointer;color:var(--text-faint);font-size:0.875rem;line-height:1;padding:2px 4px;}
  .node-header .del:hover{color:var(--danger);}
  .node-body{padding:8px 11px 11px;font-size:0.7188rem;color:var(--text-muted);min-height:16px;}
  /* File and endpoint pills carry an icon; they are the card's only file reference. */
  .phrase-pill .pill-ic{display:inline-flex;width:12px;height:12px;flex-shrink:0;}
  .phrase-pill .pill-ic svg{width:100%;height:100%;stroke-width:2.25;}
  /* A missing file keeps the warning colour on its icon too, so the state isn't lost. */
  .phrase-pill.is-missing .pill-ic{color:var(--warning)!important;}
  .phrase-pill.file-pill,.phrase-pill.link-pill{font-family:var(--font-mono);}
  .phrase-pill.link-pill::after{content:"›";font-size:0.75rem;opacity:.7;}
  /* Non-editable reference to another node inside a sentence (e.g. the step a Loop iterates over). */
  .phrase-ref{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:1px 7px;border-radius:var(--r-xs);background:var(--surface-alt);color:var(--text);font-weight:600;font-size:0.6875rem;}
  .phrase-ref .btn-ic{width:11px;height:11px;}
  .phrase-ref.is-missing{color:var(--warning);background:var(--warning-dim);}
  .node-type{font-size:0.6875rem;color:var(--text-faint);font-weight:700;padding:8px 11px 0;text-transform:uppercase;letter-spacing:.05em;}

  /* Sentence-first node summary (phrase pills), pattern adapted from design.html's Sentence Builder */
  .sentence-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:0.7188rem;line-height:1.6;color:var(--text-muted);}
  .phrase-pill{display:inline-flex;align-items:center;gap:3px;background:var(--accent-tint);color:var(--accent);border:1px dashed var(--accent);border-radius:var(--r-xs);padding:1px 7px;font-weight:700;font-size:0.6875rem;cursor:pointer;position:relative;user-select:none;max-width:100%;min-width:0;overflow-wrap:anywhere;}
  .phrase-pill:hover,.phrase-pill.active{background:var(--accent-tint-hover);border-style:solid;}
  .phrase-pill::after{content:"▾";font-size:0.6875rem;margin-left:1px;opacity:.7;}
  .phrase-pill.toggle-pill::after{content:none;}
  .phrase-popover{position:absolute;top:calc(100% + 5px);left:0;min-width:130px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow-lg);padding:5px 0;z-index:30;display:flex;flex-direction:column;font-weight:400;}
  .phrase-popover.text-popover{padding:6px;min-width:170px;}
  .phrase-popover-item{padding:6px 12px;font-size:0.7188rem;font-weight:500;color:var(--text);cursor:pointer;white-space:nowrap;}
  .phrase-popover-item:hover{background:var(--surface-alt);}
  .phrase-popover-item.selected{font-weight:700;color:var(--accent);background:var(--accent-tint);}
  .phrase-popover input[type=text]{width:100%;font:inherit;font-size:0.7188rem;font-family:var(--font-mono);color:var(--text);background:var(--field-fill);border:1px solid transparent;border-radius:var(--r-xs);padding:5px 7px;}
  .phrase-popover input[type=text]:focus{outline:2px solid var(--focus-ring);outline-offset:0;}

  /* Data node details (schema / request), shown in the full view */
  .detail-form{width:100%;max-width:720px;margin:0 auto;padding:24px 20px 40px;cursor:default;}
  .detail-form .n-field{margin-bottom:14px;}
  .detail-form .n-field:last-child{margin-bottom:0;}
  .detail-form label{display:block;font-size:0.75rem;color:var(--text-muted);font-weight:600;margin-bottom:6px;}
  .detail-form input[type=text],.detail-form textarea,.detail-form select{width:100%;font:inherit;font-size:0.8125rem;font-family:var(--font-mono);color:var(--text);background:var(--field-fill);border:1px solid transparent;border-radius:var(--r-sm);padding:8px 10px;cursor:text;transition:background-color var(--dur-fast);}
  .detail-form textarea{min-height:120px;resize:vertical;line-height:1.6;}
  .detail-form input:hover,.detail-form textarea:hover,.detail-form select:hover{background:var(--field-fill-hover);}
  .detail-form input:focus,.detail-form textarea:focus,.detail-form select:focus{outline:2px solid var(--focus-ring);outline-offset:0;}


  .port{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--surface-alt);border:2px solid var(--border-strong);cursor:crosshair;top:50%;transform:translateY(-50%);z-index:2;transition:background .1s,border-color .1s,transform .1s;}
  .port:hover{border-color:var(--accent);background:var(--accent-tint);}
  .port.port-target{background:var(--success);border-color:var(--success);transform:translateY(-50%) scale(1.35);}
  .port.in{left:-7px;}
  .port.out{right:-7px;}
  .port-label{position:absolute;font-size:0.6875rem;color:var(--text-faint);right:14px;white-space:nowrap;}

  body.dragging-node, body.dragging-node .node, body.dragging-node .node-header{cursor:grabbing !important;}
  body.dragging-node, body.connecting-edge{user-select:none;}

  /* Zoom / pan controls */
  #canvasControls{position:absolute;bottom:16px;right:16px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:4px;box-shadow:var(--shadow-md);z-index:20;}
  #canvasControls button{width:28px;height:28px;background:transparent;border:none;color:var(--text);font-size:1rem;cursor:pointer;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;line-height:1;transition:background var(--dur-fast);}
  #canvasControls button:hover{background:var(--surface-alt);}
  #zoomLabel{width:48px;text-align:center;font-size:0.7188rem;color:var(--text-muted);cursor:pointer;user-select:none;}
  #zoomLabel:hover{color:var(--text);}
  #canvasControls .sep{width:1px;align-self:stretch;background:var(--border);margin:0 3px;}
  #minimapHint{position:absolute;top:16px;left:16px;font-size:0.6875rem;color:var(--text-muted);background:var(--surface-glass);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;z-index:20;pointer-events:none;box-shadow:var(--shadow-xs);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.6875rem;color:var(--text-faint);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .field input[type=text], .field textarea, .field select{width:100%;background:var(--field-fill);border:1px solid transparent;color:var(--text);border-radius:var(--r-sm);padding:8px 10px;font-size:0.8125rem;font-family:inherit;resize:vertical;transition:all var(--dur-fast);}
  .field input[type=text]:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--focus-ring);outline-offset:0;}
  .field textarea{min-height:70px;}
  .empty-hint{color:var(--text-muted);font-size:0.8125rem;line-height:1.55;padding:20px 4px;}


  /* Prompt / Flow libraries */
  .lib-toolbar{display:flex;justify-content:flex-end;margin-bottom:12px;}
  .lib-list{display:flex;flex-direction:column;gap:10px;}
  .lib-card{border:1px solid var(--border);border-radius:var(--r-md);padding:12px;background:var(--surface-alt);}
  .lib-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .lib-card-title{font-size:0.8125rem;font-weight:700;color:var(--text);}
  .lib-card-meta{font-size:0.6875rem;color:var(--text-faint);white-space:nowrap;}
  .lib-card-desc{font-size:0.7188rem;color:var(--text-muted);margin:4px 0 8px;line-height:1.4;}
  .lib-card-preview{font-family:var(--font-mono);font-size:0.6875rem;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xs);padding:6px 8px;margin-bottom:8px;white-space:pre-wrap;max-height:54px;overflow:hidden;}
  .lib-card-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .lib-empty{color:var(--text-muted);font-size:0.8125rem;line-height:1.5;padding:20px 4px;}

  #statusbar{padding:6px 16px;font-size:0.7188rem;color:var(--text-muted);background:var(--surface);border-top:1px solid var(--border);}

  /* Command palette */
  .cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;}
  .cmd-palette{width:560px;max-width:92vw;max-height:60vh;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;}
  #cmdInput{border:none;border-bottom:1px solid var(--separator);background:var(--surface);color:var(--text);font-family:inherit;font-size:0.9375rem;padding:14px 16px;outline:none;}
  #cmdInput::placeholder{color:var(--text-placeholder);opacity:1;}
  .cmd-list{overflow-y:auto;padding:6px;}
  .cmd-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:0.8125rem;color:var(--text);}
  .cmd-item-main{display:flex;align-items:center;gap:9px;min-width:0;}
  .cmd-icon{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);}
  .cmd-icon svg{width:100%;height:100%;stroke:currentColor;}
  .cmd-item.active .cmd-icon{color:var(--accent);}
  .cmd-item .cmd-hint{font-size:0.6875rem;color:var(--text-faint);white-space:nowrap;}
  .cmd-item.active{background:var(--accent-tint);color:var(--accent);}
  .cmd-item.active .cmd-hint{color:var(--accent);}
  .cmd-empty{padding:16px;color:var(--text-muted);font-size:0.8125rem;text-align:center;}

  /* AI action input: floating composer with / commands (same pattern as fs.html). Results show in one status pill. */
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}
  /* Above the file view (z-index 30) so the chat stays usable while a file is open. */
  .ai-dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(640px, calc(100% - 480px));z-index:40;}
  @media (max-width:1180px){ .ai-dock{left:16px;right:16px;width:auto;transform:none;bottom:64px;} }
  @keyframes aiIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @keyframes aiSpin{to{transform:rotate(360deg);}}
  .ai-status{display:flex;align-items:center;gap:8px;width:fit-content;max-width:100%;margin:0 auto 8px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow-sm);font-size:0.7812rem;color:var(--text-muted);animation:aiIn var(--dur-med) var(--ease-out);}
  .ai-status[hidden]{display:none;}
  .ai-status .btn-ic{width:15px;height:15px;}
  .ai-status-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ai-status.is-ok .btn-ic{color:var(--success);}
  .ai-status.is-warn .btn-ic{color:var(--warning);}
  .ai-status.is-run{color:var(--text);}
  .ai-spinner{width:13px;height:13px;flex:0 0 13px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:aiSpin .75s linear infinite;}
  .ai-composer{position:relative;margin:0;padding:8px 8px 8px 14px;border:1px solid transparent;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow-lg);}
  .ai-composer:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px;}
  .ai-ctx-row{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px;}
  .ai-ctx-row:empty{display:none;}
  .ai-ctx-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:2px 2px 2px 8px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface-alt);color:var(--text-muted);font-size:0.7188rem;font-weight:600;}
  .ai-ctx-chip .btn-ic{width:13px;height:13px;}
  .ai-ctx-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ai-ctx-chip button{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:transparent;color:var(--text-faint);font-size:0.9375rem;line-height:1;cursor:pointer;}
  .ai-ctx-chip button:hover{background:var(--surface-hover);color:var(--text);}
  .ai-prompt{display:block;width:100%;max-height:140px;padding:6px 0;border:0;outline:none;resize:none;background:transparent;color:var(--text);font:0.875rem/1.5 var(--font-sans);}
  .ai-prompt:focus-visible{box-shadow:none;}
  .ai-prompt::placeholder{color:var(--text-placeholder);opacity:1;}
  .ai-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .ai-tools{display:flex;align-items:center;gap:4px;}
  .ai-tool-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-pill);background:transparent;color:var(--text-muted);font:600 0.75rem var(--font-sans);cursor:pointer;white-space:nowrap;}
  .ai-tool-btn:hover{background:var(--surface-alt);color:var(--text);}
  .ai-tool-btn .btn-ic{width:13px;height:13px;}
  .ai-slash{font-family:var(--font-mono);font-weight:700;color:var(--accent);}
  .ai-send-wrap{display:flex;align-items:center;gap:10px;}
  .ai-hint{font-size:0.6875rem;color:var(--text-faint);white-space:nowrap;}
  .ai-send{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--accent);color:var(--accent-contrast);cursor:pointer;transition:background var(--dur-fast),transform var(--dur-fast);}
  .ai-send:hover{background:var(--accent-hover);}
  .ai-send:active{transform:scale(.94);}
  .ai-send .btn-ic{width:17px;height:17px;}
  .ai-send:disabled{background:var(--surface-active);color:var(--text-faint);cursor:default;transform:none;}
  .ai-slash-menu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:40;max-height:min(46vh,340px);overflow-y:auto;padding:6px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-lg);animation:aiIn var(--dur-fast) var(--ease-out);}
  .ai-slash-menu[hidden]{display:none;}
  .ai-slash-group{padding:8px 10px 4px;font-size:0.6875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
  .ai-slash-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px;border-radius:var(--r-sm);cursor:pointer;}
  .ai-slash-item.is-active{background:var(--accent-tint);}
  .ai-slash-icon{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--surface-alt);color:var(--accent);}
  .ai-slash-item.is-active .ai-slash-icon{background:var(--surface);}
  .ai-slash-icon .btn-ic{width:15px;height:15px;}
  .ai-slash-text{min-width:0;flex:1;display:flex;flex-direction:column;}
  .ai-slash-cmd{font-family:var(--font-mono);font-size:0.7812rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ai-slash-cmd em{font-style:normal;font-weight:500;color:var(--text-faint);}
  .ai-slash-cmd mark{background:transparent;color:var(--accent);}
  .ai-slash-desc{font-size:0.7188rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ai-slash-empty{padding:14px 10px;color:var(--text-muted);font-size:0.7812rem;text-align:center;}
  .ai-slash-foot{display:flex;justify-content:space-between;gap:8px;margin-top:4px;padding:8px 10px 4px;border-top:1px solid var(--border);font-size:0.6875rem;color:var(--text-faint);}

  /* ==========================================================================
     FILE VIEW — full view over the canvas for a node's prompt/script file or Data details
     (pattern from fs.html: file header + line-numbered, highlighted code)
     ========================================================================== */
  /* --dock-space keeps the card clear of the chat composer (measured in JS). */
  .file-view{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding:14px 14px var(--dock-space, 150px);background:var(--bg);animation:fmFadeIn 200ms var(--ease-ios) both;}
  .file-view[hidden]{display:none;}
  .fv-card{flex:1;min-height:0;width:100%;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);overflow:hidden;animation:fmSheetIn 280ms var(--ease-ios) both;}
  .fv-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--separator);}
  .fv-back .btn-ic{width:15px;height:15px;}
  .fv-divider{width:1px;align-self:stretch;margin:4px 2px;background:var(--separator);}
  .fv-title{flex:1;min-width:0;display:flex;align-items:center;gap:10px;}
  .fv-icon{display:inline-flex;width:20px;height:20px;flex-shrink:0;}
  .fv-icon svg{width:100%;height:100%;}
  .fv-title-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .fv-path{width:100%;max-width:520px;font:600 0.875rem var(--font-mono);color:var(--text);background:transparent;border:1px solid transparent;border-radius:var(--r-xs);padding:3px 6px;margin:-3px -6px;text-overflow:ellipsis;transition:background-color var(--dur-fast);}
  .fv-path:hover{background:var(--field-fill);}
  .fv-path:focus{background:var(--field-fill);outline:2px solid var(--focus-ring);outline-offset:0;}
  .fv-meta{font-size:0.75rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fv-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--surface);}
  .fv-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 14px;border-top:1px solid var(--separator);background:var(--surface);font-size:0.6875rem;color:var(--text-muted);}
  .fv-foot .cmd-kbd{margin-right:3px;}
  .fv-foot-right{display:flex;gap:14px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

  /* Editable code: a transparent textarea over a highlighted <pre>, both sized by the same text. */
  .code-editor{display:grid;grid-template-columns:auto minmax(0,1fr);min-width:100%;min-height:100%;width:max-content;font-family:var(--font-mono);font-size:0.8125rem;line-height:1.7;}
  .ce-gutter{position:sticky;left:0;z-index:1;margin:0;padding:14px 12px 14px 18px;text-align:right;color:var(--text-faint);background:var(--surface);border-right:1px solid var(--separator);user-select:none;font:inherit;}
  .ce-gutter .is-current{color:var(--text);font-weight:600;}
  .ce-stack{position:relative;min-width:0;}
  .ce-hl,.ce-input{margin:0;padding:14px 32px 14px 16px;font:inherit;line-height:inherit;white-space:pre;tab-size:4;letter-spacing:normal;word-spacing:normal;}
  .ce-hl{min-height:100%;color:var(--text);pointer-events:none;}
  .ce-input{position:absolute;inset:0;width:100%;height:100%;border:0;outline:none;resize:none;overflow:hidden;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--text);}
  .ce-input::selection{background:var(--accent-tint-hover);}
  .ce-input:focus-visible{outline:none;}
  /* Syntax tokens; every color meets 4.5:1 on the surface in both themes. */
  .tk-k{color:var(--accent);font-weight:700;}
  .tk-s{color:var(--success);}
  .tk-n{color:var(--info);}
  .tk-c{color:var(--text-faint);font-style:italic;}
  .tk-t{color:var(--syntax-var);font-weight:600;}
  .tk-h{color:var(--accent);font-weight:700;}

  /* ==========================================================================
     WORKSPACE FILE TREE (side panel)
     ========================================================================== */
  .lib-count{min-width:18px;padding:0 6px;border-radius:var(--r-pill);background:var(--surface-alt);color:var(--text-muted);font:600 0.6875rem/18px var(--font-mono);letter-spacing:0;text-align:center;}
  .lib-count:empty{display:none;}
  .lib-add:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px;}
  ul.lib-file-list,.lib-sub-list{list-style:none;margin:0;padding:0;}
  ul.lib-file-list{margin-top:6px;}
  .lib-file{position:relative;cursor:default;}
  .lib-file-main{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;}
  .lib-file-main:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:2px;}
  .lib-file.is-active{background:var(--surface-alt);color:var(--text);font-weight:600;box-shadow:inset 2px 0 0 var(--accent);}
  .lib-file-badge{flex-shrink:0;min-width:16px;padding:0 5px;border-radius:var(--r-pill);background:var(--accent-tint-hover);color:var(--text);font:600 0.6875rem/16px var(--font-mono);text-align:center;}
  .lib-file-dot{width:6px;height:6px;flex-shrink:0;border-radius:50%;background:var(--warning);}
  button.lib-file-action{border:0;background:none;padding:0;cursor:pointer;}
  .lib-file:focus-within .lib-file-actions{display:flex;}
  .lib-sub-list{margin:1px 0 4px 19px;padding-left:6px;border-left:1px solid var(--separator);}
  .lib-file-sub{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px;border:0;border-radius:var(--r-xs);background:none;color:var(--text-muted);font:0.6875rem var(--font-mono);text-align:left;cursor:pointer;}
  .lib-file-sub:hover{background:var(--surface-alt);color:var(--text);}
  .lib-sub-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lib-sub-meta{flex-shrink:0;color:var(--text-muted);font-family:var(--font-sans);}
  .lib-upload{margin-top:8px;}
  .lib-upload:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;}
  #btnSave.is-dirty::after{content:"";width:7px;height:7px;margin-left:2px;border-radius:50%;background:var(--warning);box-shadow:0 0 0 1.5px var(--accent-contrast);}

  /* Pills that point at a missing file or table */
  .phrase-pill.is-missing{background:var(--warning-dim);color:var(--warning);border-color:var(--warning);}
  .phrase-popover.file-popover{min-width:210px;max-height:280px;overflow:auto;}
  .phrase-popover-empty{padding:6px 12px;color:var(--text-muted);font-size:0.6875rem;}
  .phrase-popover-new{margin-top:4px;padding:6px 6px 2px;border-top:1px solid var(--separator);}
  .phrase-popover input::placeholder{color:var(--text-placeholder);opacity:1;}
  .log-row.log-error .log-time{color:var(--text-muted);}
  .phrase-popover-item.phrase-popover-action{margin-top:4px;border-top:1px solid var(--separator);font-weight:600;}
  .phrase-popover-open{display:flex;align-items:center;gap:8px;width:calc(100% - 8px);margin:0 4px 4px;padding:7px 8px;border:0;border-radius:var(--r-xs);background:var(--surface-alt);color:var(--text);font:600 0.7188rem var(--font-sans);text-align:left;cursor:pointer;}
  .phrase-popover-open:hover{background:var(--surface-hover);}
  .phrase-popover-open:focus-visible{outline:2px solid var(--focus-ring);outline-offset:0;}
  .phrase-popover-open .pill-ic{display:inline-flex;width:13px;height:13px;}
  .phrase-popover-open .pill-ic svg{width:100%;height:100%;}
  .phrase-popover-head{padding:6px 12px 2px;color:var(--text-muted);font-size:0.6875rem;font-weight:600;}

  /* Full view: Tables / SQL switch, notes, embedded editors */
  .fv-scroll{position:relative;}
  .fv-title-static{font-size:0.875rem;font-weight:600;color:var(--text);}
  .fv-seg{display:inline-flex;gap:2px;padding:3px;flex-shrink:0;border-radius:var(--r-pill);background:var(--surface-alt);}
  .fv-seg-btn{min-height:28px;padding:4px 14px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--text-muted);font:600 0.75rem var(--font-sans);cursor:pointer;transition:background-color var(--dur-fast),color var(--dur-fast);}
  .fv-seg-btn:hover{color:var(--text);}
  .fv-seg-btn.is-active{background:var(--control-selected);color:var(--text);box-shadow:var(--shadow-xs);}
  .fv-note{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px;padding:10px 12px;border-radius:var(--r-md);color:var(--text);font-size:0.8125rem;line-height:1.5;}
  .fv-note .btn-ic{width:16px;height:16px;flex-shrink:0;margin-top:2px;}
  .fv-note.is-info{background:var(--info-dim);}
  .fv-note.is-info .btn-ic{color:var(--info);}
  .fv-note.is-warn{background:var(--warning-dim);}
  .fv-note.is-warn .btn-ic{color:var(--warning);}
  .fv-embed{position:relative;min-height:180px;max-height:360px;overflow:auto;overscroll-behavior:contain;border:1px solid var(--separator);border-radius:var(--r-md);background:var(--surface);}
  .fv-embed .code-editor{min-height:180px;}
  .detail-form input[type=password]{width:100%;font:0.8125rem var(--font-mono);color:var(--text);background:var(--field-fill);border:1px solid transparent;border-radius:var(--r-sm);padding:8px 10px;}
  .detail-form input[readonly]{cursor:text;}

  /* Table configurator */
  .schema-editor .st-table{margin-bottom:12px;padding:12px;border-radius:var(--r-md);background:var(--surface-alt);scroll-margin:16px;}
  .schema-editor .st-table.is-focus{animation:stFocus 1.4s var(--ease-ios) 1;}
  @keyframes stFocus{0%{box-shadow:0 0 0 2px var(--accent);}100%{box-shadow:0 0 0 2px transparent;}}
  .st-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .schema-editor .st-head .st-table-name{flex:1;font-weight:700;background:var(--surface);}
  .st-count{flex-shrink:0;color:var(--text-muted);font-size:0.6875rem;white-space:nowrap;}
  .st-grid{display:grid;grid-template-columns:minmax(0,1fr) 128px 76px 64px 30px;gap:6px 8px;align-items:center;}
  .st-grid-head{padding:0 2px 4px;color:var(--text-muted);font-size:0.6875rem;font-weight:600;}
  .st-grid-head span:nth-child(3),.st-grid-head span:nth-child(4){text-align:center;}
  .st-row{margin-bottom:6px;}
  .schema-editor .st-row input[type=text],.schema-editor .st-row select{padding:6px 8px;background:var(--surface);}
  .st-check{display:flex;justify-content:center;}
  .st-check input{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;}
  .st-del{width:28px;height:28px;display:grid;place-items:center;flex-shrink:0;border:0;border-radius:var(--r-xs);background:none;color:var(--text-muted);font-size:1rem;line-height:1;cursor:pointer;}
  .st-del:hover{background:var(--danger-dim);color:var(--danger);}
  .st-del:disabled{opacity:.4;cursor:not-allowed;background:none;color:var(--text-muted);}
  .st-actions{display:flex;gap:8px;margin-top:8px;}
  .st-actions .btn .btn-ic{width:13px;height:13px;}

  /* Webhook endpoint view */
  .wh-section{padding:16px 0;border-top:1px solid var(--separator);}
  .fv-note + .wh-section{border-top:0;padding-top:0;}
  .wh-label{margin:0 0 8px;color:var(--text);font-size:0.8125rem;font-weight:600;}
  .wh-row{display:flex;align-items:center;gap:8px;}
  .wh-row input{flex:1;min-width:0;}
  .detail-form .wh-row .wh-method{width:auto;flex-shrink:0;font-weight:600;}
  .wh-row .btn{flex-shrink:0;}
  .wh-row .btn .btn-ic{width:13px;height:13px;}
  .wh-help{margin:8px 0 6px;color:var(--text-muted);font-size:0.75rem;line-height:1.55;}
  .wh-help code{padding:1px 5px;border-radius:4px;background:var(--surface-alt);color:var(--text);font:0.6875rem var(--font-mono);}
  .wh-status{margin:8px 0 0;font-size:0.75rem;font-weight:600;}
  .wh-status.is-ok{color:var(--success);}
  .wh-status.is-error{color:var(--danger);}

  /* Debug run of a prompt/script: Input and Console tabs under the editor (console = run card from fs.html) */
  .fv-run{flex-shrink:0;}
  .fv-run .btn-ic{width:12px;height:12px;}
  .dbg{flex:0 0 auto;height:min(340px, 48%);min-height:210px;display:flex;flex-direction:column;border-top:1px solid var(--separator);background:var(--surface-alt);}
  .dbg[hidden]{display:none;}
  .dbg-bar{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 10px;border-bottom:1px solid var(--separator);background:var(--surface);}
  .dbg-tabs .fv-seg-btn{display:inline-flex;align-items:center;gap:6px;}
  .dbg-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);}
  .dbg-dot.is-running{background:var(--info);animation:runBlink 1s steps(2) infinite;}
  .dbg-dot.is-done{background:var(--success);}
  .dbg-dot.is-warn,.dbg-dot.is-stopped{background:var(--warning);}
  .dbg-dot.is-failed{background:var(--danger);}
  .dbg-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted);font:0.6875rem var(--font-mono);}
  .dbg-actions{display:flex;align-items:center;gap:4px;margin-left:auto;flex-shrink:0;}
  .dbg-actions .btn .btn-ic{width:12px;height:12px;}
  .dbg-close{width:30px;height:30px;padding:0;}
  .dbg-close .btn-ic{width:15px;height:15px;margin:0;}
  .dbg-pane{flex:1;min-height:0;display:flex;flex-direction:column;}
  .dbg-pane[hidden]{display:none;}
  .dbg-input{gap:10px;padding:12px;overflow:auto;overscroll-behavior:contain;}
  .dbg-label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0;color:var(--text);font-size:0.75rem;font-weight:600;}
  .dbg-label code{color:var(--text-muted);font:500 0.6875rem var(--font-mono);}
  .dbg-input .fv-embed{flex:1;min-height:96px;max-height:none;}
  .dbg-input .fv-embed .code-editor{min-height:100%;}
  .dbg-field{display:flex;flex-direction:column;gap:4px;max-width:720px;}
  .dbg-field label{color:var(--text-muted);font:600 0.6875rem var(--font-mono);}
  .dbg-field input[type=text]{width:100%;min-width:0;padding:6px 9px;border:1px solid var(--separator);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font:0.75rem var(--font-mono);}
  .dbg-field input[type=text]::placeholder{color:var(--text-placeholder);opacity:1;}
  .dbg-field input[type=text]:focus{outline:2px solid var(--focus-ring);outline-offset:0;}
  .dbg-field.is-missing input[type=text]{border-color:var(--warning-border);background:var(--warning-dim);}
  .dbg-check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:0.75rem;cursor:pointer;}
  .dbg-check input{width:15px;height:15px;margin:0;accent-color:var(--accent);}
  .dbg-hint{margin:0;color:var(--text-muted);font-size:0.6875rem;line-height:1.5;}
  .dbg-hint.is-error{color:var(--danger);font-weight:600;}
  .dbg-hint code{padding:0 4px;border-radius:4px;background:var(--surface);font:0.6875rem var(--font-mono);}
  .run-card{min-width:0;background:#141312;color:#ECE7DE;}
  .run-card :focus-visible{outline:2px solid #F08E5A;outline-offset:1px;}
  .run-body{position:relative;flex:1;min-height:0;}
  .run-output{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;margin:0;padding:10px 14px;font:0.75rem/1.7 var(--font-mono);white-space:pre-wrap;word-break:break-word;}
  .run-output > span,.run-output > button{display:block;}
  .run-output > button{width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;white-space:pre-wrap;cursor:pointer;}
  .run-output > button:hover{text-decoration:underline;}
  .run-empty{color:#736C63;}
  .run-jump{position:absolute;right:12px;bottom:10px;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid rgba(255,255,255,.16);border-radius:var(--r-pill);background:#2B2824;color:#F5F3EF;font:600 0.7188rem var(--font-sans);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);}
  .run-jump:hover{background:#35322E;}
  .run-jump[hidden]{display:none;}
  .run-jump .btn-ic{width:12px;height:12px;}
  .run-output .o-dim{color:#8C857B;} .run-output .o-info{color:#F2B957;} .run-output .o-ok{color:#53C378;} .run-output .o-err{color:#F16E63;} .run-output .o-head{color:#F08E5A;font-weight:700;}
  .o-caret{color:#F08E5A;animation:runBlink 1s steps(2) infinite;}
  @keyframes runBlink{50%{opacity:0;}}


  /* ==========================================================================
     RESPONSIVE — desktop, tablet and phone
     ========================================================================== */
  #app{height:100vh;height:100dvh;}
  #btnPanel,.panel-head,.hint-touch,.st-mini{display:none;}
  #canvas-wrapper{touch-action:none;}
  #statusbar{padding-bottom:max(6px, env(safe-area-inset-bottom));padding-left:max(16px, env(safe-area-inset-left));}

  /* Popovers inside the zoomed canvas render at their real size. */

  @media (pointer: coarse){

    .port::before{content:"";position:absolute;inset:-12px;border-radius:50%;}

  }

  @media (max-width:900px){
    #btnPanel{display:inline-flex;}
    #leftpanel{position:fixed;top:0;bottom:0;left:0;z-index:70;width:min(320px, 88vw);padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);
      transform:translateX(-102%);visibility:hidden;transition:transform 320ms var(--ease-ios), visibility 0s linear 320ms;}
    body.panel-open #leftpanel{transform:none;visibility:visible;box-shadow:var(--shadow-lg);transition:transform 320ms var(--ease-ios);}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 8px 2px 16px;}
    #palette{padding-top:8px;}

  }
  @media (max-width:640px){
    #topbar{gap:6px;padding-top:max(8px, env(safe-area-inset-top));padding-bottom:8px;padding-left:max(8px, env(safe-area-inset-left));padding-right:max(8px, env(safe-area-inset-right));}
    #topbar h1{font-size:1rem;gap:6px;}
    #btnCmdPalette,#topbar .topbar-divider{display:none;}
    #topbar .topbar-group .btn{width:44px;min-height:40px;padding:0;}
    #topbar .btn-label{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;}
    #minimapHint{display:none;}
    #canvasControls{right:max(8px, env(safe-area-inset-right));}
    #canvasControls #btnResetView{display:none;}
    .ai-dock{left:max(8px, env(safe-area-inset-left));right:max(8px, env(safe-area-inset-right));bottom:max(8px, env(safe-area-inset-bottom));}
    .ai-hint{display:none;}
    #statusbar{font-size:0.6875rem;padding-top:5px;}

    /* File view */
    .file-view{padding:8px 8px var(--dock-space, 150px);}
    .fv-head{flex-wrap:wrap;row-gap:8px;padding:8px 10px;}
    .fv-divider{display:none;}
    .fv-title{flex:1 1 180px;}
    .fv-seg{order:3;width:100%;}
    .fv-seg-btn{flex:1;}
    .fv-foot{justify-content:flex-end;padding:6px 10px;}
    .fv-foot > span:first-child{display:none;}
    .fv-foot-right{gap:10px;flex-wrap:wrap;justify-content:flex-end;}
    .ce-gutter{padding-left:10px;padding-right:8px;}
    .ce-hl,.ce-input{padding-left:10px;padding-right:16px;}
    .dbg{height:min(400px, 58%);}
    .dbg-meta{display:none;}

    .detail-form{padding:14px 12px 24px;}

    /* Table configurator: each column becomes a two-line card */
    .st-grid-head{display:none;}
    .st-row{grid-template-columns:minmax(0,1fr) auto auto 30px;grid-template-areas:"name name name del" "type pk nn .";padding:8px;border-radius:var(--r-sm);background:var(--surface);}
    .st-row .st-col-name{grid-area:name;}
    .st-row .st-col-type{grid-area:type;}
    .st-row .st-check:nth-of-type(1){grid-area:pk;}
    .st-row .st-check:nth-of-type(2){grid-area:nn;}
    .st-row .st-del{grid-area:del;}
    .st-check{gap:6px;justify-content:flex-start;align-items:center;}
    .st-mini{display:inline;font-size:0.75rem;color:var(--text-muted);white-space:nowrap;}
    .schema-editor .st-row input[type=text],.schema-editor .st-row select{background:var(--field-fill);}

    /* Webhook view */
    .wh-row{flex-wrap:wrap;}
    .wh-row .wh-url,.wh-row .wh-secret{flex:1 1 100%;order:-1;}
    .detail-form .wh-row .wh-method{order:0;}
  }
  /* ==========================================================================
     MOTION — same Apple-style easing as design.html
     ========================================================================== */
  @keyframes fmPopIn{from{opacity:0;transform:translateY(-4px) scale(.98);}to{opacity:1;transform:none;}}
  @keyframes fmSheetIn{from{opacity:0;transform:translateY(-8px) scale(.97);}to{opacity:1;transform:none;}}
  @keyframes fmFadeIn{from{opacity:0;}to{opacity:1;}}
  .phrase-popover{animation:fmPopIn 180ms var(--ease-ios) both;transform-origin:top left;}
  .cmd-overlay{animation:fmFadeIn 200ms var(--ease-ios) both;}
  .cmd-overlay .cmd-palette{animation:fmSheetIn 280ms var(--ease-ios) both;}
  .lib-section summary{border-radius:var(--r-xs);transition:background-color var(--dur-fast);}
  @media (hover:hover){ .lib-section summary:hover{background:var(--accent-tint);} }

  /* ==========================================================================
     HIG ACCESSIBILITY ADAPTATIONS

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
  }
  @media (prefers-contrast: more){
    :root{

      --border:#AEAEB2; --border-strong:#636366; --border-focus:#000000;
      --accent:#000000; --accent-hover:#2A2A2C; --accent-tint:rgba(0,0,0,.08); --accent-tint-hover:rgba(0,0,0,.14);
      --field-fill:rgba(118,118,128,.20); --field-fill-hover:rgba(118,118,128,.26); --separator:rgba(60,60,67,.50); --syntax-var:#7D21AC;

      --accent:#FFFFFF; --accent-hover:#E6E4E0; --accent-tint:rgba(255,255,255,.14); --accent-tint-hover:rgba(255,255,255,.22);
      --field-fill:rgba(165,157,146,.22); --field-fill-hover:rgba(165,157,146,.28); --separator:rgba(255,255,255,.30);
      --surface-glass:var(--surface);
    }
    /* With Increase Contrast on, filled fields gain a visible edge. */
    #topbar input[type=text]:hover,#topbar input[type=text]:focus,.detail-form input[type=text],.detail-form textarea,.detail-form select,.fv-path,
    .phrase-popover input[type=text],.field input[type=text],.field textarea,.field select,.schema-col-row input[type=text],.schema-col-row select,.ai-composer{border-color:var(--border-strong);}

<body>
<div id="app">
  <div id="topbar">
    <button class="btn btn-ghost btn-icon-only" id="btnPanel" type="button" aria-label="Show nodes and files" aria-controls="leftpanel" aria-expanded="false"><span class="btn-ic" data-icon="menu"></span></button>
    <h1><span class="brand-dot" style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;"></span>Flow Machine</h1>
    <div class="spacer"></div>
    <button class="btn btn-ghost cmd-trigger" id="btnCmdPalette" title="Command palette (Ctrl+K)" aria-label="Commands"><span class="btn-ic" data-icon="command"></span><span>Commands</span><span class="cmd-kbd">Ctrl K</span></button>
    <div class="topbar-divider"></div>
    <div class="topbar-group">
      <button class="btn btn-run" id="btnRun"><span class="btn-ic" data-icon="play"></span><span class="btn-label">Run</span></button>
      <button class="btn btn-primary" id="btnSave"><span class="btn-ic" data-icon="save"></span><span class="btn-label">Save</span></button>
      <button class="btn btn-danger" id="btnClear"><span class="btn-ic" data-icon="trash"></span><span class="btn-label">Clear</span></button>
    </div>
  </div>
  <div id="body">
    <div id="leftpanel" aria-label="Nodes and files">
      <div class="panel-head">
        <span class="panel-head-title">Nodes &amp; files</span>
        <button class="btn btn-ghost btn-icon-only" id="btnPanelClose" type="button" aria-label="Close panel"><span class="btn-ic" data-icon="x"></span></button>
      </div>
      <div id="palette">
        <div class="panel-heading">
          <h3>Nodes</h3>
          <span class="panel-heading-hint">Drag or tap to add</span>
        </div>
        <div id="paletteList"></div>

        <details class="lib-section" id="promptsSection">
          <summary>
            <span class="chevron-ic"><span class="btn-ic" data-icon="chevron"></span></span>
            <span class="btn-ic" data-icon="folder"></span>
            <span class="lib-section-title">Prompts</span>
            <span class="lib-count" data-count="prompt" aria-label="files"></span>
            <span class="lib-add" id="btnAddPrompt" role="button" tabindex="0" title="New prompt (.md)" aria-label="New prompt file"><span class="btn-ic" data-icon="plus"></span></span>
          </summary>
          <div id="promptsBox"></div>
        </details>
        <details class="lib-section" id="scriptsSection">
          <summary>
            <span class="chevron-ic"><span class="btn-ic" data-icon="chevron"></span></span>
            <span class="btn-ic" data-icon="folder"></span>
            <span class="lib-section-title">Scripts</span>
            <span class="lib-count" data-count="script" aria-label="files"></span>
            <span class="lib-add" id="btnAddScript" role="button" tabindex="0" title="New script (.py)" aria-label="New script file"><span class="btn-ic" data-icon="plus"></span></span>
          </summary>
          <div id="scriptsBox"></div>
          <div id="scriptsUpload" class="lib-upload" role="button" tabindex="0" title="Click or drop files to upload">
            <span class="btn-ic" data-icon="upload"></span>
            <span class="lib-upload-hint">Drop files or click to upload</span>

<script>
(function(){
  "use strict";

  /* ---------------- Node type definitions ---------------- */
  // Nodes point at workspace files: prompts/*.md, scripts/*.py and data/*.sql (SQLite schema).
  // HTTP calls and file access belong in a Script; the Data node only talks to SQLite.
  const NODE_TYPES = {
    trigger: { label:'Trigger', color:'var(--node-trigger)', outputs:['out'], hasInput:false, single:true,
      fields:[ {key:'triggerType', default:'manual'}, {key:'cronExpression', default:'0 * * * *'}, {key:'webhookMethod', default:'POST'} ] },
    runPrompt: { label:'Run Prompt', color:'var(--node-prompt)', outputs:['out'], hasInput:true,
      fields:[ {key:'promptFile', default:''}, {key:'task', default:'Summarize input'}, {key:'reasoning', default:false} ] },
    // Iterates over the output of the step connected to its input port.
    loop: { label:'Loop (For Each)', color:'var(--node-loop)', outputs:['body','done'], hasInput:true,
      fields:[ {key:'itemVariable', default:'item'} ] },
    data: { label:'Data', color:'var(--node-data)', outputs:['out'], hasInput:true,
      fields:[ {key:'action', default:'read'}, {key:'database', default:''}, {key:'table', default:''} ] },
    script: { label:'Script (Python)', color:'var(--node-script)', outputs:['out'], hasInput:true,
      fields:[ {key:'scriptFile', default:''} ] }
  };

  const TRIGGER_OPTIONS = [
    {value:'manual', label:'manually'}, {value:'cron', label:'on a schedule'}, {value:'webhook', label:'on a webhook'}
  ];
  const DATA_ACTIONS = [
    {value:'read', label:'Read rows from'}, {value:'insert', label:'Insert into'},
    {value:'update', label:'Update rows in'}, {value:'delete', label:'Delete rows from'}
  ];

  /* Sentence-first summaries per node type: literal text plus clickable phrase pills
     (select / text / toggle / file / table), the "Sentence-First Configuration" pattern from design.html. */
  const SENTENCE_TEMPLATES = {
    trigger: node => {
      const parts = ['Trigger fires', {key:'triggerType', kind:'select', options:TRIGGER_OPTIONS}];
      if(node.config.triggerType==='cron') parts.push('at', {key:'cronExpression', kind:'text'});
      if(node.config.triggerType==='webhook') parts.push('via', {key:'webhookMethod', kind:'select', options:['POST','PUT','GET']}, 'at', {kind:'endpoint'});
      return parts;
    },
    runPrompt: node => ([
      'Run prompt', {key:'promptFile', kind:'file', fileKind:'prompt'},
      'for task', {key:'task', kind:'text'},
      'with reasoning', {key:'reasoning', kind:'toggle'}
    ]),
    loop: node => {
      const src = loopSourceNode(node);
      return ['For each', {key:'itemVariable', kind:'text'}, 'in the output of',
        src ? {kind:'ref', text:src.name, icon:src.type, color:NODE_TYPES[src.type].color}
            : {kind:'ref', text:'(connect a step)', missing:true}];
    },
    script: node => (['Run Python script', {key:'scriptFile', kind:'file', fileKind:'script'}]),
    data: node => ([
      {key:'action', kind:'select', options:DATA_ACTIONS},
      {key:'table', kind:'table'},
      'in', {key:'database', kind:'file', fileKind:'data'}
    ])
  };
  // Structural keys change which pills a card shows, so the card is fully re-rendered.
  const SENTENCE_STRUCTURAL_KEYS = new Set(['triggerType']);

  function sentenceFieldKeys(node){
    const tmpl = SENTENCE_TEMPLATES[node.type];
    const keys = new Set();
    if(tmpl) tmpl(node).forEach(part=>{ if(typeof part!=='string' && part.key) keys.add(part.key); });
    return keys;
  }

  // The step whose output a Loop iterates over: the source of the first edge into the Loop's input port.
  function loopSourceNode(loop){
    const edge = state.edges.find(e=>e.to===loop.id);
    return edge ? state.nodes.find(n=>n.id===edge.from) || null : null;
  }

  /* ---------------- Icons (minimal inline SVGs, styled via currentColor) ---------------- */
  function iconSvg(paths){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+paths+'</svg>';
  }
  const ICONS = {
    trigger: iconSvg('<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>'),
    runPrompt: iconSvg('<path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.8a8.4 8.4 0 0 1-.9-3.8A8.4 8.4 0 0 1 12.6 3a8.4 8.4 0 0 1 8.4 8.4z"/>'),
    loop: iconSvg('<path d="M17 2.1 21 6l-4 3.9"/><path d="M3 12.2V10a4 4 0 0 1 4-4h14"/><path d="M7 21.9 3 18l4-3.9"/><path d="M21 11.8V14a4 4 0 0 1-4 4H3"/>'),
    data: iconSvg('<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>'),
    script: iconSvg('<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>'),
    play: iconSvg('<polygon points="6 3 20 12 6 21 6 3"/>'),
    sample: iconSvg('<path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/>'),
    trash: iconSvg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'),
    save: iconSvg('<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>'),
    download: iconSvg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><path d="M12 15V3"/>'),
    sun: iconSvg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
    moon: iconSvg('<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>'),
    minus: iconSvg('<line x1="5" y1="12" x2="19" y2="12"/>'),
    maximize: iconSvg('<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>'),
    target: iconSvg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
    command: iconSvg('<path d="M9 3a3 3 0 1 0 0 6h6a3 3 0 1 0 0-6M9 21a3 3 0 1 0 0-6h6a3 3 0 1 0 0 6"/><rect x="9" y="9" width="6" height="6" rx="1"/>'),
    folder: iconSvg('<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>'),
    info: iconSvg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'),
    file: iconSvg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'),
    chevron: iconSvg('<polyline points="9 18 15 12 9 6"/>'),
    chevronLeft: iconSvg('<polyline points="15 18 9 12 15 6"/>'),
    menu: iconSvg('<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>'),
    x: iconSvg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'),
    plus: iconSvg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
    edit: iconSvg('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>'),
    check: iconSvg('<polyline points="20 6 9 17 4 12"/>'),
    copy: iconSvg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
    upload: iconSvg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><path d="M12 3v12"/>'),
    arrowUp: iconSvg('<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>'),
    alertCircle: iconSvg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'),
    square: iconSvg('<rect x="5" y="5" width="14" height="14" rx="2"/>'),
    arrowDown: iconSvg('<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>'),
    link: iconSvg('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>')
  };
  function paintIcons(root){
    (root||document).querySelectorAll('[data-icon]').forEach(el=>{
      const name = el.getAttribute('data-icon');
      if(ICONS[name] && !el.dataset.iconPainted){ el.innerHTML = ICONS[name]; el.dataset.iconPainted = '1'; }
    });
  }
  paintIcons();

  /* ---------------- Logging ---------------- */
  // Central log sink: mirrors to the browser console and to the collapsible "Logs" panel.
  const Logger = (function(){
    const entries = [];
    const MAX_ENTRIES = 300;
    let panelEl = null;
    function render(){
      if(!panelEl) return;
      if(entries.length===0){ panelEl.innerHTML = '<div class="log-empty">No log entries yet.</div>'; return; }
      panelEl.innerHTML = '';
      entries.slice().reverse().forEach(entry=>{
        const row = document.createElement('div');
        row.className = 'log-row log-'+entry.level;
        const time = document.createElement('span');
        time.className = 'log-time';
        time.textContent = entry.time.toLocaleTimeString();
        const msg = document.createElement('span');
        msg.className = 'log-msg';
        msg.textContent = entry.message + (entry.meta ? ' ' + JSON.stringify(entry.meta) : '');
        row.appendChild(time); row.appendChild(msg);
        panelEl.appendChild(row);
      });
    }
    function push(level, message, meta){
      const entry = { level, message, meta: meta || null, time: new Date() };
      entries.push(entry);
      if(entries.length > MAX_ENTRIES) entries.shift();
      const consoleFn = level==='error' ? console.error : level==='warn' ? console.warn : console.log;
      consoleFn('[FlowMachine]', message, meta || '');
      render();
      return entry;
    }
    return {
      info: (m, meta) => push('info', m, meta),
      warn: (m, meta) => push('warn', m, meta),
      error: (m, meta) => push('error', m, meta),
      success: (m, meta) => push('success', m, meta),
      clear(){ entries.length = 0; render(); },
      attachPanel(el){ panelEl = el; render(); }
    };
  })();

  /* ---------------- Node run-state bus ---------------- */
  // Per-node pub/sub so each node card can reflect its live run state (idle/running/done/error)
  // as reported by the execution backend, without the whole canvas needing to re-render.
  const NodeStateBus = (function(){
    const listeners = new Map(); // nodeId -> Set<fn>
    function on(nodeId, fn){
      if(!listeners.has(nodeId)) listeners.set(nodeId, new Set());
      listeners.get(nodeId).add(fn);
      return () => { const set = listeners.get(nodeId); if(set) set.delete(fn); };
    }
    function emit(nodeId, runState, detail){
      const set = listeners.get(nodeId);
      if(!set) return;
      set.forEach(fn=>{
        try{ fn(runState, detail); }
        catch(err){ Logger.error('Node state listener threw', { nodeId, error: String(err) }); }
      });
    }
    return { on, emit };
  })();

  // Simulated execution backend. Swap this out for a real WebSocket/SSE client that forwards
  // {nodeId, state, message} run events from the server — everything else (NodeStateBus,
  // node dots, logging) already works off that same publishNodeState() call.
  const ServerLink = {
    connected: false,
    // Public base URL the execution server serves webhook endpoints from.
    baseUrl: 'http://localhost:8787',
    connect(){
      this.connected = true;
      Logger.info('Connected to execution server (simulated).');
    },
    publishNodeState(nodeId, runState, detail){
      NodeStateBus.emit(nodeId, runState, detail);
    }
  };

  /* ---------------- Workspace: the app works over files ----------------
     prompts/*.md (prompts) · scripts/*.py (scripts) · data/*.sql (SQLite schemas) · flows/*.yaml (flows).
     Persisted to localStorage here; swap the storage calls for a real file-system backend. */
  const FOLDERS = {
    prompt: { dir:'prompts/', ext:'.md',   label:'Prompts', noun:'prompt',   lang:'markdown', icon:'file', color:'var(--node-prompt)',  kindLabel:'Markdown prompt' },
    script: { dir:'scripts/', ext:'.py',   label:'Scripts', noun:'script',   lang:'python',   icon:'file', color:'var(--node-script)',  kindLabel:'Python script' },
    data:   { dir:'data/',    ext:'.sql',  label:'Data',    noun:'database', lang:'sql',      icon:'data', color:'var(--node-data)',    kindLabel:'SQLite schema' },
    flow:   { dir:'flows/',   ext:'.yaml', label:'Flows',   noun:'flow',     lang:'yaml',     icon:'file', color:'var(--node-trigger)', kindLabel:'Flow' }
  };

  const Workspace = (function(){
    const KEY = 'flow_machine_workspace';
    let files = {};
    let timer = null;
    function writeNow(){
      clearTimeout(timer); timer = null;
      try{ localStorage.setItem(KEY, JSON.stringify(files)); }
      catch(e){ Logger.error('Failed to save workspace files.', { error: String(e) }); setStatus('Could not save files: browser storage is full or unavailable.'); }
    }
    function persist(){ clearTimeout(timer); timer = setTimeout(writeNow, 250); }
    return {
      load(){
        try{ files = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }
        catch(e){ Logger.error('Workspace storage is corrupt; starting with an empty workspace.', { error: String(e) }); files = {}; }
      },
      flush(){ if(timer) writeNow(); },
      exists: p => !!p && Object.prototype.hasOwnProperty.call(files, p),
      read: p => (p && files[p]) ? files[p].content : null,
      entry: p => (p && files[p]) || null,
      write(p, content, extra){ files[p] = Object.assign({}, files[p] || {}, extra || {}, { content: String(content), updatedAt: Date.now() }); persist(); },
      remove(p){ delete files[p]; persist(); },
      rename(from, to){
        if(!files[from] || files[to]) return false;
        files[to] = files[from]; delete files[from]; files[to].updatedAt = Date.now(); persist(); return true;
      },
      list(kind){ const f = FOLDERS[kind]; return Object.keys(files).filter(p=>p.startsWith(f.dir) && p.endsWith(f.ext)).sort(); },
      isEmpty: () => Object.keys(files).length===0
    };
  })();
  window.addEventListener('beforeunload', ()=>Workspace.flush());

  function fileKindOf(path){
    return Object.keys(FOLDERS).find(k=>String(path||'').startsWith(FOLDERS[k].dir) && String(path).endsWith(FOLDERS[k].ext)) || null;
  }
  function slugify(s){
    return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);
  }
  // Turns user input ("summarize", "prompts/summarize.md", "My notes") into a valid path in the kind's folder, or null.
  function normalizePath(kind, input){
    const f = FOLDERS[kind];
    let p = String(input||'').trim().replace(/\\/g,'/').replace(/^\.?\/+/,'');
    if(p.startsWith(f.dir)) p = p.slice(f.dir.length);
    if(p.toLowerCase().endsWith(f.ext)) p = p.slice(0, -f.ext.length);
    p = p.replace(/\s+/g,'-');
    if(!p || !/^[A-Za-z0-9_][\w.\-]*(\/[A-Za-z0-9_][\w.\-]*)*$/.test(p)) return null;
    return f.dir + p + f.ext;
  }
  function uniquePath(kind, base){
    const f = FOLDERS[kind];
    const first = normalizePath(kind, base) || normalizePath(kind, f.noun);
    if(!Workspace.exists(first)) return first;
    const stem = first.slice(0, -f.ext.length);
    for(let i=2;;i++){ const p = stem+'-'+i+f.ext; if(!Workspace.exists(p)) return p; }
  }

  function newFileContent(kind, path){
    const title = (baseName(path).replace(/\.[^.]+$/,'') || FOLDERS[kind].noun).replace(/[-_]+/g,' ');
    if(kind==='prompt') return '# '+title.charAt(0).toUpperCase()+title.slice(1)+'\n\nDescribe the task here. Use {{variable}} to insert values from earlier steps.\n';
    if(kind==='script') return 'def run(input):\n    """Receives the previous step\'s output and returns this step\'s result."""\n    return {"result": None}\n';
    if(kind==='data') return 'CREATE TABLE items (\n  id INTEGER PRIMARY KEY NOT NULL,\n  name TEXT\n);\n';
    return '';
  }

  const SAMPLE_FILES = {
    'prompts/summarize.md': '# Summarize a web page\n\nYou are a concise technical writer.\n\nRead the page at {{url}} and write a **3-sentence** summary:\n\n- Lead with the main point.\n- Keep names, numbers and dates exact.\n- Return plain text, no headings.\n',
    'scripts/load_urls.py': 'import json\nfrom urllib.request import urlopen\n\nFEED = "https://example.com/pages.json"\n\n\ndef run(input):\n    """Fetch the list of page URLs to summarize."""\n    with urlopen(FEED, timeout=10) as response:\n        pages = json.load(response)\n    return [page["url"] for page in pages]\n',
    'data/summaries.sql': '-- Summaries written by the Content Summarization Pipeline.\n\nCREATE TABLE summaries (\n  id INTEGER PRIMARY KEY NOT NULL,\n  url TEXT NOT NULL,\n  summary TEXT\n);\n'
  };
  function seedSampleFiles(){
    Object.keys(SAMPLE_FILES).forEach(p=>{ if(!Workspace.exists(p)) Workspace.write(p, SAMPLE_FILES[p]); });
  }

  /* ---- SQLite schema files (data/*.sql): parse and write CREATE TABLE statements ---- */
  const SQL_TYPES = ['TEXT','INTEGER','REAL','BLOB','BOOLEAN','DATETIME'];

  function splitTopLevel(s){
    const out = []; let depth = 0, cur = '';
    for(const ch of s){
      if(ch==='(') depth++;
      if(ch===')') depth--;
      if(ch===',' && depth===0){ out.push(cur); cur = ''; } else cur += ch;
    }
    if(cur.trim()) out.push(cur);
    return out;
  }
  // `supported` is false when the file holds SQL the table editor can't round-trip (constraints,
  // other statements, comments inside statements); the SQL view still edits it as text.
  function parseSchema(sql){
    const lines = String(sql||'').split('\n');
    let i = 0; const header = [];
    while(i<lines.length && /^\s*(--.*)?$/.test(lines[i])){ header.push(lines[i]); i++; }
    const body = lines.slice(i).join('\n');
    const tables = []; let supported = !/--|\/\*/.test(body);
    body.split(';').map(s=>s.trim()).filter(Boolean).forEach(st=>{
      const m = /^CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?["`\[]?([A-Za-z_]\w*)["`\]]?\s*\(([\s\S]*)\)$/i.exec(st);
      if(!m){ supported = false; return; }
      const columns = [];
      splitTopLevel(m[2]).forEach(def=>{
        const c = /^\s*["`\[]?([A-Za-z_]\w*)["`\]]?\s+([A-Za-z]+)((?:\s+(?:PRIMARY\s+KEY|NOT\s+NULL))*)\s*$/i.exec(def);
        if(!c){ supported = false; return; }
        const flags = c[3].toUpperCase();
        columns.push({ name:c[1], type:c[2].toUpperCase(), primaryKey:/PRIMARY\s+KEY/.test(flags), notNull:/NOT\s+NULL/.test(flags) });
      });
      tables.push({ name:m[1], columns });
    });
    return { tables, supported, header: header.join('\n').replace(/\s+$/,'') };
  }
  function serializeSchema(schema){
    const body = schema.tables.map(t=>'CREATE TABLE '+t.name+' (\n'+
      t.columns.map(c=>'  '+c.name+' '+c.type+(c.primaryKey?' PRIMARY KEY':'')+(c.notNull?' NOT NULL':'')).join(',\n')+'\n);').join('\n\n');
    return (schema.header ? schema.header+'\n\n' : '') + body + '\n';
  }
  function tablesOf(path){ return Workspace.exists(path) ? parseSchema(Workspace.read(path)).tables : []; }
  function sqlIdent(s, fallback){ let v = String(s||'').replace(/\W/g,'_'); if(!v) v = fallback; return /^\d/.test(v) ? '_'+v : v; }

  /* ---- Webhook endpoints ---- */
  function randomBytes(n){ const a = new Uint8Array(n); window.crypto.getRandomValues(a); return a; }
  function randomId(len){ const alphabet = 'abcdefghijkmnpqrstuvwxyz23456789'; return Array.from(randomBytes(len), b=>alphabet[b % alphabet.length]).join(''); }
  function newWebhookSecret(){ return 'whsec_' + Array.from(randomBytes(24), b=>b.toString(16).padStart(2,'0')).join(''); }
  function webhookUrl(cfg){ return ServerLink.baseUrl + (cfg.webhookPath || ''); }
  function webhookSecretEnv(cfg){ return 'WEBHOOK_SECRET_' + String(cfg.webhookId || '').toUpperCase(); }

  // Generates the endpoint once, the first time a trigger switches to webhook; it stays stable after that
  // (renaming the flow does not change it). `regenerate` issues a new URL, e.g. after a leak.
  function ensureWebhook(node, regenerate){
    const cfg = node.config;
    if(cfg.webhookId && !regenerate) return false;
    const slug = slugify(flowMeta.name) || 'flow';
    cfg.webhookId = randomId(10);
    cfg.webhookPath = '/hooks/'+slug+'/'+cfg.webhookId;
    if(!cfg.webhookSecret) cfg.webhookSecret = newWebhookSecret();
    if(!cfg.webhookMethod) cfg.webhookMethod = 'POST';
    if(cfg.webhookPayload===undefined) cfg.webhookPayload = '{\n  "urls": [\n    "https://example.com/a",\n    "https://example.com/b"\n  ]\n}\n';
    Logger.info((regenerate ? 'Regenerated' : 'Generated')+' webhook endpoint '+cfg.webhookPath, { nodeId: node.id });
    setStatus((regenerate ? 'New endpoint: ' : 'Webhook endpoint created: ')+webhookUrl(cfg));
    return true;
  }

  function describePayload(cfg){
    const raw = cfg.webhookPayload || '';
    if(!raw.trim()) return { ok:true, text:'empty body', items:0 };
    try{
      const v = JSON.parse(raw);
      if(Array.isArray(v)) return { ok:true, text:'a list of '+v.length+' item'+(v.length===1?'':'s'), items:v.length };
