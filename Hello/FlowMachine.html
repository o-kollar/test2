      if(v && typeof v==='object'){
        const lists = Object.keys(v).filter(k=>Array.isArray(v[k]));
        if(lists.length===1) return { ok:true, text:'an object with a “'+lists[0]+'” list of '+v[lists[0]].length+' item'+(v[lists[0]].length===1?'':'s'), items:v[lists[0]].length };
        const n = Object.keys(v).length;
        return { ok:true, text:'an object with '+n+' key'+(n===1?'':'s'), items:0 };
      }
      return { ok:true, text:'a single '+typeof v, items:0 };
    }catch(e){ return { ok:false, text:'invalid JSON', error:e.message }; }
  }

  /* ---- Migration from the pre-workspace format ----
     Inline prompt/script text becomes files; the old multi-source Data node becomes SQLite
     (schema → data/*.sql) or a Script (filesystem/fetch → scripts/*.py). */
  function legacyDataScript(c){
    if(c.dataSource==='fetch'){
      const method = c.fetchMethod || 'GET';
      return 'import json\nfrom urllib.request import Request, urlopen\n\nURL = '+JSON.stringify(c.fetchUrl||'')+'\n\n\ndef run(input):\n'+
        '    """Converted from a Data step that fetched '+method+' '+(c.fetchUrl||'')+'."""\n'+
        '    request = Request(URL, method='+JSON.stringify(method)+')\n    with urlopen(request, timeout=30) as response:\n'+
        (c.fetchResponseType==='text' ? '        return response.read().decode()\n' : '        return json.load(response)\n');
    }
    const op = c.fsOperation || 'read', fmt = c.fsFormat || 'text';
    return 'import json\nfrom pathlib import Path\n\nPATH = Path('+JSON.stringify(c.fsPath||'')+')\n\n\ndef run(input):\n'+
      '    """Converted from a Data step ('+op+' file, '+fmt+')."""\n'+
      (op==='read' ? (fmt==='json' ? '    return json.loads(PATH.read_text())\n' : '    return PATH.read_text()\n')
                   : '    # TODO: implement the "'+op+'" operation.\n    return input\n');
  }

  function migrateState(st){
    if(!st || !Array.isArray(st.nodes)) return st;
    st.edges = st.edges || [];
    st.nodes.forEach(n=>{
      const c = n.config = n.config || {};
      delete n.expanded;
      if(n.type==='runPrompt' || n.type==='script'){
        const kind = n.type==='runPrompt' ? 'prompt' : 'script';
        const pathKey = kind==='prompt' ? 'promptFile' : 'scriptFile';
        const codeKey = kind==='prompt' ? 'promptTemplate' : 'scriptCode';
        if(c[codeKey]!==undefined){
          const path = normalizePath(kind, c[pathKey]) || uniquePath(kind, slugify(n.name));
          if(!Workspace.exists(path)) Workspace.write(path, c[codeKey] || '');
          c[pathKey] = path;
        }
        [codeKey,'description','input','output'].forEach(k=>delete c[k]);
      } else if(n.type==='loop'){
        delete c.inputList;
      } else if(n.type==='data' && c.database===undefined){
        if((c.dataSource||'sqlite')==='sqlite'){
          const path = normalizePath('data', String(c.dbName||'app').replace(/\.(db|sqlite3?)$/i,'')) || uniquePath('data', 'app');
          const tables = (c.tables||[]).map(t=>({ name: sqlIdent(t.name,'table'),
            columns: (t.columns||[]).map(col=>({ name: sqlIdent(col.name,'col'), type: String(col.type||'TEXT').toUpperCase(), primaryKey: !!col.primaryKey, notNull: !!col.notNull })) }));
          if(!Workspace.exists(path)) Workspace.write(path, serializeSchema({ header:'', tables }));
          n.config = { action: /store|save|insert|write/i.test(n.name||'') ? 'insert' : 'read', database: path, table: tables[0] ? tables[0].name : '' };
        } else {
          const path = uniquePath('script', slugify(n.name) || 'data-step');
          Workspace.write(path, legacyDataScript(c));
          n.type = 'script';
          n.config = { scriptFile: path };
        }
      }
    });
    return st;
  }

  // One-time import of the old per-type libraries (saved prompts, uploaded scripts, saved flows) as files.
  function migrateLegacyLibraries(){
    try{ if(localStorage.getItem('flow_machine_ws_migrated')) return; }catch(e){ return; }
    const read = k=>{ try{ return JSON.parse(localStorage.getItem(k) || '[]') || []; }catch(e){ return []; } };
    let count = 0;
    read('flow_machine_prompts').forEach(p=>{
      Workspace.write(uniquePath('prompt', slugify(p.name) || 'prompt'), (p.description ? '<!-- '+p.description+' -->\n\n' : '') + (p.template || ''));
      count++;
    });
    read('flow_machine_scripts').forEach(s=>{
      Workspace.write(uniquePath('script', String(s.name||'script').replace(/\.py$/i,'')), s.content || '');
      count++;
    });
    read('flow_machine_library').forEach(f=>{
      if(!f || !f.state) return;
      const st = migrateState(JSON.parse(JSON.stringify(f.state)));
      Workspace.write(uniquePath('flow', slugify(f.name) || 'flow'), generateYaml(st, f.name, f.description || ''), { state: st, name: f.name, desc: f.description || '' });
      count++;
    });
    try{ localStorage.setItem('flow_machine_ws_migrated', '1'); }catch(e){}
    if(count) Logger.info('Imported '+count+' item'+(count===1?'':'s')+' from the old libraries into the workspace files.');
  }

  /* ---------------- State ---------------- */
  let state = { nodes: [], edges: [] };
  // Flow name and description (rename with /name, describe with /describe).
  const flowMeta = { name: 'Untitled Flow', desc: '' };
  let nodeCounter = 0;
  let selectedNodeId = null;
  let selectedEdgeId = null;
  const nodeStateUnsub = new Map(); // nodeId -> unsubscribe fn for its NodeStateBus listener

  const canvas = document.getElementById('canvas');
  const canvasWrapper = document.getElementById('canvas-wrapper');
  const svg = document.getElementById('edges');

  /* ---------------- Zoom / pan (view) state ---------------- */
  const ZOOM_MIN = 0.2, ZOOM_MAX = 2.5, ZOOM_STEP = 0.1;
  let view = { zoom: 1, panX: 0, panY: 0 };

  function applyView(){
    canvas.style.transform = 'translate('+view.panX+'px, '+view.panY+'px) scale('+view.zoom+')';
    canvas.style.setProperty('--canvas-zoom', view.zoom);
    document.getElementById('zoomLabel').textContent = Math.round(view.zoom*100)+'%';
  }

  // Zoom while keeping the world point under (screenX, screenY) stationary on screen.
  function setZoom(newZoom, screenX, screenY){
    newZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, newZoom));
    const wrapperRect = canvasWrapper.getBoundingClientRect();
    const cx = screenX!==undefined ? screenX - wrapperRect.left : wrapperRect.width/2;
    const cy = screenY!==undefined ? screenY - wrapperRect.top : wrapperRect.height/2;
    const worldX = (cx - view.panX) / view.zoom;
    const worldY = (cy - view.panY) / view.zoom;
    view.zoom = newZoom;
    view.panX = cx - worldX*view.zoom;
    view.panY = cy - worldY*view.zoom;
    applyView();
  }

  function fitToView(){
    if(state.nodes.length===0){
      view = { zoom:1, panX:0, panY:0 };
      applyView();
      return;
    }
    const nodeW = 220, nodeH = 110, pad = 70;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    state.nodes.forEach(n=>{
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x+nodeW); maxY = Math.max(maxY, n.y+nodeH);
    });
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    const wrapperRect = canvasWrapper.getBoundingClientRect();
    let zoom = Math.min(wrapperRect.width/(maxX-minX), wrapperRect.height/(maxY-minY));
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom));
    const minReadable = wrapperRect.width < 700 ? 0.8 : 0.45;
    if(zoom < minReadable){
      view.zoom = minReadable;
      view.panX = -minX*minReadable;
      view.panY = wrapperRect.height/2 - ((minY+maxY)/2)*minReadable;
      applyView();
      return;
    }
    view.zoom = zoom;
    view.panX = wrapperRect.width/2 - ((minX+maxX)/2)*zoom;
    view.panY = wrapperRect.height/2 - ((minY+maxY)/2)*zoom;
    applyView();
  }

  function uid(prefix){ nodeCounter++; return prefix + '_' + nodeCounter; }

  function defaultConfig(type){
    const cfg = {};
    NODE_TYPES[type].fields.forEach(f => cfg[f.key] = f.default!==undefined ? f.default : '');
    // A new Data step points at the first database in the workspace, if there is one.
    if(type==='data'){
      cfg.database = Workspace.list('data')[0] || '';
      const first = tablesOf(cfg.database)[0];
      cfg.table = first ? first.name : '';
    }
    return cfg;
  }

  function addNode(type, x, y){
    if(NODE_TYPES[type].single && state.nodes.some(n=>n.type===type)){
      setStatus('Only one "' + NODE_TYPES[type].label + '" node is allowed.');
      return null;
    }
    const node = {
      id: type==='trigger' ? 'trigger' : uid('step'),
      type,
      name: NODE_TYPES[type].label,
      x: x||60, y: y||60,
      config: defaultConfig(type)
    };
    state.nodes.push(node);
    renderAll();
    selectNode(node.id);
    return node;
  }

  function removeNode(id){
    state.nodes = state.nodes.filter(n=>n.id!==id);
    state.edges = state.edges.filter(e=>e.from!==id && e.to!==id);
    if(selectedNodeId===id) selectedNodeId=null;
    const unsub = nodeStateUnsub.get(id);
    if(unsub){ unsub(); nodeStateUnsub.delete(id); }
    renderAll();
  }

  function removeEdge(id){
    state.edges = state.edges.filter(e=>e.id!==id);
    if(selectedEdgeId===id) selectedEdgeId=null;
    renderAll();
  }

  function connect(fromId, fromPort, toId){
    if(fromId===toId) return;
    // remove existing edge from same output port (single connection per output)
    state.edges = state.edges.filter(e=>!(e.from===fromId && e.fromPort===fromPort));
    state.edges.push({ id: uid('edge'), from: fromId, fromPort, to: toId });
    renderAll();
  }

  function setStatus(msg){
    document.getElementById('statusbar').textContent = msg;
  }

  /* ---------------- Palette ---------------- */
  const paletteList = document.getElementById('paletteList');
  Object.keys(NODE_TYPES).forEach(type=>{
    const def = NODE_TYPES[type];
    const item = document.createElement('div');
    item.className = 'pal-item';
    item.draggable = true;
    item.tabIndex = 0;
    item.setAttribute('role', 'button');
    item.setAttribute('aria-label', 'Add '+def.label+' node');
    const add = ()=>{ const n = addNodeAtCenter(type); if(n){ setStatus('Added '+def.label+'.'); closePanelIfDrawer(); } };
    item.addEventListener('click', add);
    item.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); add(); } });
    item.innerHTML = '<span class="pal-icon" style="color:'+def.color+'">'+(ICONS[type]||'')+'</span><span>'+def.label+'</span>';
    item.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', type);
    });
    paletteList.appendChild(item);
  });

  canvasWrapper.addEventListener('dragover', e=>e.preventDefault());
  canvasWrapper.addEventListener('drop', e=>{
    e.preventDefault();
    const type = e.dataTransfer.getData('text/plain');
    if(!NODE_TYPES[type] || fileView) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left)/view.zoom - 10;
    const y = (e.clientY - rect.top)/view.zoom - 10;
    addNode(type, Math.max(0,x), Math.max(0,y));
  });

  /* ---------------- Rendering ---------------- */
  function renderAll(){
    if(fileView && fileView.type==='webhook' && !state.nodes.some(n=>n.id===fileView.nodeId && n.config.triggerType==='webhook')) closeFileView();
    renderAiCtx();
    renderNodes();
    renderEdges();
    renderSidebar();
  }

  /* ---- Sentence-first node summary: phrase pills + popovers (design.html Sentence Builder pattern) ---- */
  function closeAllPhrasePopovers(){
    document.querySelectorAll('.phrase-popover').forEach(p=>{
      try{ p.remove(); }catch(err){ /* already detached by a concurrent blur/re-render — safe to ignore */ }
    });
    document.querySelectorAll('.phrase-pill.active').forEach(p=>p.classList.remove('active'));
  }
  document.addEventListener('pointerdown', e=>{
    if(!e.target.closest('.phrase-popover') && !e.target.closest('.phrase-pill')) closeAllPhrasePopovers();
  });

  function optionList(part){ return part.options.map(o=>typeof o==='string' ? {value:o, label:o} : o); }

  // Keeps a Data step's table valid after its database changes.
  function syncDataTable(node){
    const tables = tablesOf(node.config.database);
    if(!tables.some(t=>t.name===node.config.table)) node.config.table = tables[0] ? tables[0].name : '';
  }

  function afterPillChange(node, key){
    if(key==='triggerType' && node.config.triggerType==='webhook') ensureWebhook(node);
    if(key==='database') syncDataTable(node);
    if(SENTENCE_STRUCTURAL_KEYS.has(key)){ renderNodes(); renderEdges(); refreshNodeDetails(node); return; }
    updateNodeVisual(node);
    refreshNodeDetails(node);
  }

  function newPopover(pill, extraClass){
    closeAllPhrasePopovers();
    pill.classList.add('active');
    const pop = document.createElement('div');
    pop.className = 'phrase-popover open' + (extraClass ? ' '+extraClass : '');
    pop.addEventListener('pointerdown', e=>e.stopPropagation());
    pill.appendChild(pop);
    return pop;
  }
  function popoverItem(pop, text, selected, onPick, title){
    const item = document.createElement('div');
    item.className = 'phrase-popover-item' + (selected ? ' selected' : '');
    item.textContent = text;
    if(title) item.title = title;
    item.addEventListener('click', e=>{ e.stopPropagation(); onPick(); });
    pop.appendChild(item);
    return item;
  }

  function openSelectPopover(node, pill, part){
    const pop = newPopover(pill);
    optionList(part).forEach(opt=>{
      popoverItem(pop, opt.label, node.config[part.key]===opt.value, ()=>{
        node.config[part.key] = opt.value;
        closeAllPhrasePopovers();
        afterPillChange(node, part.key);
      });
    });
  }

  // File pill: pick an existing file of the right kind, or type a name to create a new one.
  function openFilePopover(node, pill, part){
    const folder = FOLDERS[part.fileKind];
    const pop = newPopover(pill, 'file-popover');
    const choose = path=>{
      node.config[part.key] = path;
      closeAllPhrasePopovers();
      afterPillChange(node, part.key);
      renderSidebar();
    };
    const current = node.config[part.key] || '';
    const open = document.createElement('button');
    open.type = 'button';
    open.className = 'phrase-popover-open';
    const verb = part.fileKind==='data' ? 'Edit tables in ' : 'Open ';
    open.innerHTML = '<span class="pill-ic" style="color:'+folder.color+'">'+ICONS[folder.icon]+'</span><span></span>';
    open.lastChild.textContent = !current ? 'Create a new '+folder.noun : Workspace.exists(current) ? verb+baseName(current) : 'Create '+baseName(current);
    open.addEventListener('click', e=>{ e.stopPropagation(); closeAllPhrasePopovers(); selectNode(node.id); openNode(node); });
    pop.appendChild(open);
    const files = Workspace.list(part.fileKind).filter(p=>p!==current);
    if(files.length){
      const head = document.createElement('div');
      head.className = 'phrase-popover-head';
      head.textContent = 'Use another '+folder.noun;
      pop.appendChild(head);
      files.forEach(path=>popoverItem(pop, baseName(path), false, ()=>choose(path), path));
    }
    const form = document.createElement('div');
    form.className = 'phrase-popover-new';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'New '+folder.noun+' name';
    input.setAttribute('aria-label', 'New '+folder.noun+' file name, saved in '+folder.dir);
    input.addEventListener('keydown', e=>{
      e.stopPropagation();
      if(e.key==='Enter'){
        e.preventDefault();
        const path = normalizePath(part.fileKind, input.value);
        if(!path){ input.setAttribute('aria-invalid','true'); setStatus('Use letters, numbers, dashes, underscores or dots for file names.'); return; }
        const created = !Workspace.exists(path);
        if(created) Workspace.write(path, newFileContent(part.fileKind, path));
        choose(path);
        setStatus((created ? 'Created ' : 'Using ')+path+'.');
      } else if(e.key==='Escape'){ e.preventDefault(); closeAllPhrasePopovers(); }
    });
    form.appendChild(input);
    pop.appendChild(form);
    setTimeout(()=>(current ? open : input).focus(), 0);
  }

  // Table pill: the tables defined in the step's database file, plus a shortcut to edit them.
  function openTablePopover(node, pill, part){
    const pop = newPopover(pill);
    const tables = tablesOf(node.config.database);
    tables.forEach(t=>popoverItem(pop, t.name, node.config.table===t.name, ()=>{
      node.config.table = t.name;
      closeAllPhrasePopovers();
      afterPillChange(node, 'table');
    }, t.columns.map(c=>c.name).join(', ')));
    if(!tables.length){ const empty = document.createElement('div'); empty.className = 'phrase-popover-empty'; empty.textContent = node.config.database ? 'No tables in this database.' : 'Choose a database first.'; pop.appendChild(empty); }
    if(node.config.database){
      const edit = popoverItem(pop, 'Edit tables…', false, ()=>{ closeAllPhrasePopovers(); openNode(node); });
      edit.classList.add('phrase-popover-action');
    }
  }

  function openTextPopover(node, pill, part){
    closeAllPhrasePopovers();
    pill.classList.add('active');
    const pop = document.createElement('div');
    pop.className = 'phrase-popover open text-popover';
    const input = document.createElement('input');
    input.type = 'text';
    input.value = node.config[part.key] || '';
    input.addEventListener('pointerdown', e=>e.stopPropagation());
    function commit(){
      node.config[part.key] = input.value;
      closeAllPhrasePopovers();
      afterPillChange(node, part.key);
    }
    input.addEventListener('keydown', e=>{
      e.stopPropagation();
      if(e.key==='Enter'){ e.preventDefault(); commit(); }
      else if(e.key==='Escape'){ e.preventDefault(); closeAllPhrasePopovers(); }
    });
    input.addEventListener('blur', commit);
    pop.appendChild(input);
    pill.appendChild(pop);
    setTimeout(()=>input.focus(), 0);
  }

  function buildPhrasePill(node, part){
    const pill = document.createElement('span');
    pill.className = 'phrase-pill';
    pill.tabIndex = 0;
    pill.setAttribute('role', 'button');
    pill.dataset.key = part.key;
    pill.addEventListener('pointerdown', e=>e.stopPropagation());
    pill.addEventListener('keydown', e=>{
      if(e.target!==pill) return;
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); pill.click(); }
    });
    if(part.kind==='toggle'){
      pill.classList.add('toggle-pill');
      pill.textContent = node.config[part.key] ? 'on' : 'off';
      pill.setAttribute('aria-pressed', String(!!node.config[part.key]));
      pill.addEventListener('click', e=>{
        e.stopPropagation();
        node.config[part.key] = !node.config[part.key];
        pill.textContent = node.config[part.key] ? 'on' : 'off';
        pill.setAttribute('aria-pressed', String(!!node.config[part.key]));
        afterPillChange(node, part.key);
      });
      return pill;
    }
    if(part.kind==='endpoint'){
      const path = node.config.webhookPath || '';
      pill.classList.add('link-pill');
      pill.innerHTML = '<span class="pill-ic" style="color:var(--node-trigger)">'+ICONS.link+'</span>';
      pill.appendChild(document.createTextNode(path ? '…/'+path.split('/').pop() : 'endpoint'));
      pill.title = path ? 'Open webhook endpoint '+webhookUrl(node.config) : 'Open webhook endpoint';
      pill.setAttribute('aria-label', pill.title);
      pill.addEventListener('click', e=>{ e.stopPropagation(); selectNode(node.id); openWebhookView(node.id); });
      return pill;
    }
    let text, title = '', missing = false;
    const value = node.config[part.key] || '';
    if(part.kind==='file'){
      const noun = FOLDERS[part.fileKind].noun;
      missing = !value || !Workspace.exists(value);
      text = value ? baseName(value) : 'choose '+noun;
      title = !value ? 'Choose a '+noun+' file' : missing ? value+' — file not found' : value;
    } else if(part.kind==='table'){
      missing = !value || !tablesOf(node.config.database).some(t=>t.name===value);
      text = value || 'choose table';
      title = !value ? 'Choose a table' : missing ? 'Table “'+value+'” is not defined in '+(baseName(node.config.database) || 'the database') : '';
    } else if(part.kind==='select'){
      const opt = optionList(part).find(o=>o.value===value);
      text = opt ? opt.label : (value || '(empty)');
    } else {
      text = value || '(empty)';
      if(value.length > 28) title = value;
    }
    pill.textContent = text.length > 28 ? text.slice(0, 26) + '…' : text;
    if(part.kind==='file'){
      pill.classList.add('file-pill');
      pill.insertAdjacentHTML('afterbegin', '<span class="pill-ic" style="color:'+FOLDERS[part.fileKind].color+'">'+ICONS[FOLDERS[part.fileKind].icon]+'</span>');
    }
    if(title) pill.title = title;
    if(missing) pill.classList.add('is-missing');
    pill.addEventListener('click', e=>{
      e.stopPropagation();
      if(part.kind==='select') openSelectPopover(node, pill, part);
      else if(part.kind==='file') openFilePopover(node, pill, part);
      else if(part.kind==='table') openTablePopover(node, pill, part);
      else openTextPopover(node, pill, part);
    });
    return pill;
  }

  // Renders the sentence-first summary line (literal text + phrase pills) into the node body.
  function renderSentence(node, container){
    container.innerHTML = '';
    const tmpl = SENTENCE_TEMPLATES[node.type];
    if(!tmpl) return;
    const line = document.createElement('div');
    line.className = 'sentence-line';
    tmpl(node).forEach(part=>{
      if(typeof part==='string'){ line.appendChild(document.createTextNode(part)); return; }
      if(part.kind==='ref'){
        const ref = document.createElement('span');
        ref.className = 'phrase-ref' + (part.missing ? ' is-missing' : '');
        ref.innerHTML = (part.icon ? '<span class="btn-ic" style="color:'+part.color+'">'+(ICONS[part.icon]||'')+'</span>' : '');
        ref.appendChild(document.createTextNode(part.text));
        if(part.missing) ref.title = 'Connect the step whose output this loop should iterate over';
        line.appendChild(ref);
        return;
      }
      line.appendChild(buildPhrasePill(node, part));
    });
    container.appendChild(line);
  }

  // Keeps the full view in sync after a node changes (pill edits, renames).
  function refreshNodeDetails(node){
    if(!fileView) return;
    if(fileView.type==='webhook'){ if(fileView.nodeId===node.id) renderFileView({ keepScroll:true }); }
    else renderFileViewMeta();
  }
  // Re-renders every card in the open flow that points at `path` (after the file's content changes).
  function refreshFileUsers(path){
    state.nodes.forEach(n=>{ if(nodeFilePath(n)===path) updateNodeVisual(n); });
  }
  function usersOf(path){ return state.nodes.filter(n=>nodeFilePath(n)===path); }

  /* ---------------- Table configurator: a visual editor for a data/*.sql schema file ---------------- */
  function renderSchemaEditor(path, container, focusTable){
    const schema = parseSchema(Workspace.read(path) || '');
    container.innerHTML = '';
    if(!schema.supported){
      container.innerHTML = '<div class="fv-note is-warn" role="note"><span class="btn-ic">'+ICONS.alertCircle+'</span><span>'+
        '<strong>This file has SQL the table editor can’t show</strong> — for example constraints, other statements or comments inside a table. '+
        'Edit it in the SQL view; the tables it defines still work in Data steps.</span></div>';
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn btn-sm'; btn.textContent = 'Open SQL view';
      btn.addEventListener('click', ()=>{ fileView.mode = 'sql'; renderFileView(); focusFileView(); });
      container.appendChild(btn);
      return;
    }
    const save = structural=>{
      Workspace.write(path, serializeSchema(schema));
      refreshFileUsers(path);
      renderFileViewMeta();
      updateSchemaFoot(schema);
      renderSidebar();
      if(structural) renderFileView({ keepScroll:true });
    };
    const types = SQL_TYPES.slice();
    schema.tables.forEach(t=>t.columns.forEach(c=>{ if(!types.includes(c.type)) types.push(c.type); }));

    schema.tables.forEach((table, ti)=>{
      const sec = document.createElement('section');
      sec.className = 'st-table';
      sec.dataset.table = table.name;
      sec.setAttribute('aria-label', 'Table '+table.name);
      sec.innerHTML =
        '<div class="st-head"><input type="text" class="st-table-name" spellcheck="false" aria-label="Table name">'+
          '<span class="st-count"></span>'+
          '<button type="button" class="st-del" aria-label="Delete table '+escapeHtml(table.name)+'" title="Delete table">&times;</button></div>'+
        '<div class="st-grid st-grid-head" aria-hidden="true"><span>Column</span><span>Type</span><span>Primary key</span><span>Not null</span><span></span></div>'+
        '<div class="st-rows"></div>'+
        '<div class="st-actions"><button type="button" class="btn btn-sm st-add-col"><span class="btn-ic">'+ICONS.plus+'</span>Add column</button></div>';
      const nameInput = sec.querySelector('.st-table-name');
      const count = sec.querySelector('.st-count');
      const setCount = ()=>{ count.textContent = table.columns.length+' column'+(table.columns.length===1?'':'s'); };
      setCount();
      nameInput.value = table.name;
      let before = table.name;
      nameInput.addEventListener('focus', ()=>{ before = table.name; });
      nameInput.addEventListener('input', ()=>{ table.name = sqlIdent(nameInput.value, 'table'); save(false); });
      // Steps that used the old name follow the rename, in this flow and in saved flow files.
      nameInput.addEventListener('change', ()=>{
        nameInput.value = table.name;
        if(before===table.name) return;
        const from = before, to = table.name;
        const wasClean = !isDirty();
        state.nodes.forEach(n=>{ if(n.type==='data' && n.config.database===path && n.config.table===from){ n.config.table = to; updateNodeVisual(n); } });
        const flows = updateSavedFlows(n=>{ if(n.type==='data' && n.config.database===path && n.config.table===from){ n.config.table = to; return true; } return false; });
        if(wasClean) markSaved();
        before = to;
        if(flows) setStatus('Renamed table to '+to+' · updated '+flows+' saved flow'+(flows===1?'':'s')+'.');
      });
      sec.querySelector('.st-del').addEventListener('click', ()=>{
        const users = state.nodes.filter(n=>n.type==='data' && n.config.database===path && n.config.table===table.name);
        if(!confirm('Delete table “'+table.name+'”?'+(users.length ? '\n\nUsed by '+users.map(n=>'“'+n.name+'”').join(', ')+'.' : ''))) return;
        schema.tables.splice(ti, 1);
        save(true);
      });
      const rows = sec.querySelector('.st-rows');
      table.columns.forEach((col, ci)=>{
        const row = document.createElement('div');
        row.className = 'st-grid st-row';
        row.innerHTML =
          '<input type="text" class="st-col-name" spellcheck="false">'+
          '<select class="st-col-type">'+types.map(t=>'<option>'+t+'</option>').join('')+'</select>'+
          '<label class="st-check"><input type="checkbox" class="st-pk"><span class="st-mini" aria-hidden="true">Primary key</span></label>'+
          '<label class="st-check"><input type="checkbox" class="st-nn"><span class="st-mini" aria-hidden="true">Not null</span></label>'+
          '<button type="button" class="st-del" title="Delete column">&times;</button>';
        const label = 'column '+(col.name || ci+1)+' of '+table.name;
        const n = row.querySelector('.st-col-name'), ty = row.querySelector('.st-col-type'), pk = row.querySelector('.st-pk'), nn = row.querySelector('.st-nn'), del = row.querySelector('.st-del');
        n.setAttribute('aria-label', 'Name of '+label); ty.setAttribute('aria-label', 'Type of '+label);
        pk.setAttribute('aria-label', 'Primary key: '+label); nn.setAttribute('aria-label', 'Not null: '+label);
        del.setAttribute('aria-label', 'Delete '+label);
        n.value = col.name; ty.value = col.type; pk.checked = col.primaryKey; nn.checked = col.notNull;
        del.disabled = table.columns.length===1;
        if(del.disabled) del.title = 'A table needs at least one column';
        n.addEventListener('input', ()=>{ col.name = sqlIdent(n.value, 'col'); save(false); });
        n.addEventListener('change', ()=>{ n.value = col.name; });
        ty.addEventListener('change', ()=>{ col.type = ty.value; save(false); });
        pk.addEventListener('change', ()=>{ col.primaryKey = pk.checked; if(pk.checked){ col.notNull = true; nn.checked = true; } save(false); });
        nn.addEventListener('change', ()=>{ col.notNull = nn.checked; save(false); });
        del.addEventListener('click', ()=>{ table.columns.splice(ci, 1); save(true); });
        rows.appendChild(row);
      });
      sec.querySelector('.st-add-col').addEventListener('click', ()=>{
        let i = table.columns.length + 1, name = 'column'+i;
        while(table.columns.some(c=>c.name===name)) name = 'column'+(++i);
        table.columns.push({ name, type:'TEXT', primaryKey:false, notNull:false });
        save(true);
        const inputs = fileViewEl.querySelectorAll('.st-table[data-table="'+table.name+'"] .st-col-name');
        if(inputs.length){ const last = inputs[inputs.length-1]; last.focus({ preventScroll:true }); last.select(); revealInFileView(last); }
      });
      container.appendChild(sec);
    });

    const add = document.createElement('div');
    add.className = 'st-actions';
    add.innerHTML = '<button type="button" class="btn btn-sm"><span class="btn-ic">'+ICONS.plus+'</span>Add table</button>';
    add.querySelector('button').addEventListener('click', ()=>{
      let i = schema.tables.length + 1, name = 'table'+i;
      while(schema.tables.some(t=>t.name===name)) name = 'table'+(++i);
      schema.tables.push({ name, columns:[ { name:'id', type:'INTEGER', primaryKey:true, notNull:true } ] });
      save(true);
      const inp = fileViewEl.querySelector('.st-table[data-table="'+name+'"] .st-table-name');
      if(inp){ inp.focus({ preventScroll:true }); inp.select(); revealInFileView(inp); }
    });
    container.appendChild(add);
    if(!schema.tables.length){
      const empty = document.createElement('p');
      empty.className = 'wh-help';
      empty.textContent = 'This database has no tables yet.';
      container.insertBefore(empty, add);
    }
    updateSchemaFoot(schema);

    if(focusTable){
      const sec = container.querySelector('.st-table[data-table="'+focusTable+'"]');
      const scroller = container.closest('.fv-scroll');
      if(sec){ if(scroller) scroller.scrollTop = Math.max(0, sec.offsetTop - 16); sec.classList.add('is-focus'); }
    }
  }
  // Scrolls only the file view's own scroller (never the canvas wrapper behind it).
  function revealInFileView(el){
    const scroller = el.closest('.fv-scroll');
    if(!scroller) return;
    const top = el.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop;
    if(top < scroller.scrollTop + 16) scroller.scrollTop = Math.max(0, top - 16);
    else if(top + el.offsetHeight > scroller.scrollTop + scroller.clientHeight - 16) scroller.scrollTop = top + el.offsetHeight - scroller.clientHeight + 48;
  }
  function updateSchemaFoot(schema){
    const foot = fileViewEl.querySelector('.fv-foot-right');
    if(!foot) return;
    const cols = schema.tables.reduce((n,t)=>n+t.columns.length, 0);
    foot.textContent = schema.tables.length+' table'+(schema.tables.length===1?'':'s')+' · '+cols+' column'+(cols===1?'':'s')+' · SQLite';
  }

  /* ---------------- Full view over the canvas (pattern from fs.html) ----------------
     Files: prompts (.md), scripts (.py) and databases (.sql, with a Tables / SQL switch).
     Webhook triggers: the generated endpoint, signing secret and test payload. */
  const fileViewEl = document.getElementById('fileView');
  let fileView = null; // { type:'file', path, mode, focusTable } | { type:'webhook', nodeId }
  let fileViewReturnFocus = null;

  const LANGS = {
    markdown: { label:'Markdown', indent:'  ' },
    python:   { label:'Python', indent:'    ' },
    sql:      { label:'SQL', indent:'  ' },
    json:     { label:'JSON', indent:'  ' }
  };
  const HL_RULES = {
    // 1 comment · 2 string · 3 def/class name · 4 keyword · 5 number
    python: /(#[^\n]*)|("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(?<=\b(?:def|class)\s+)([A-Za-z_]\w*)|\b(def|class|return|if|elif|else|for|while|in|import|from|as|with|try|except|finally|raise|pass|break|continue|and|or|not|is|None|True|False|lambda|yield|async|await|global|nonlocal|del|assert)\b|\b(\d+(?:\.\d+)?)\b/g,
    // 1 heading · 2 {{variable}} · 3 `code` · 4 **bold** · 5 list marker
    markdown: /(^#{1,6}[ \t].*$)|(\{\{\s*[\w.]+\s*\}\})|(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(^[ \t]*(?:[-*+]|\d+\.)(?=[ \t]))/gm,
    // 1 comment · 2 string · 3 type · 4 keyword · 5 number
    sql: /(--[^\n]*)|('(?:[^'\n]|'')*'?)|\b(INTEGER|TEXT|REAL|BLOB|BOOLEAN|DATETIME|NUMERIC)\b|\b(CREATE|TABLE|IF|NOT|EXISTS|PRIMARY|KEY|NULL|DEFAULT|UNIQUE|REFERENCES|FOREIGN|INDEX|INSERT|INTO|VALUES|SELECT|FROM|WHERE|UPDATE|SET|DELETE|AND|OR|AS|ON)\b|\b(\d+(?:\.\d+)?)\b/gi,
    // 1 key · 2 string · 3 literal · 4 number
    json: /("(?:\\.|[^"\\\n])*"(?=\s*:))|("(?:\\.|[^"\\\n])*"?)|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)/g
  };
  const HL_CLASSES = {
    python:['tk-c','tk-s','tk-t','tk-k','tk-n'], markdown:['tk-h','tk-t','tk-s','tk-k','tk-n'],
    sql:['tk-c','tk-s','tk-t','tk-k','tk-n'], json:['tk-t','tk-s','tk-k','tk-n']
  };

  function highlightCode(text, lang){
    const re = HL_RULES[lang], cls = HL_CLASSES[lang];
    if(!re) return escapeHtml(text) + (text==='' || text.endsWith('\n') ? ' ' : '');
    let out = '', last = 0, m;
    re.lastIndex = 0;
    while((m = re.exec(text))){
      if(!m[0]){ re.lastIndex++; continue; }
      const group = m.slice(1).findIndex(x=>x!==undefined);
      out += escapeHtml(text.slice(last, m.index)) + '<span class="'+cls[group]+'">'+escapeHtml(m[0])+'</span>';
      last = m.index + m[0].length;
    }
    out += escapeHtml(text.slice(last));
    // A trailing newline (or empty file) still needs a visible last line so the overlay stays aligned.
    return out + (text==='' || text.endsWith('\n') ? ' ' : '');
  }

  function templateVariables(text){
    const vars = new Set();
    (text||'').replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, v)=>{ vars.add(v); return _; });
    return Array.from(vars);
  }

  function nodeFileKey(node){ return node.type==='runPrompt' ? 'promptFile' : node.type==='script' ? 'scriptFile' : node.type==='data' ? 'database' : null; }
  function nodeFilePath(node){ const k = nodeFileKey(node); return k ? node.config[k] || '' : ''; }
  function nodeFileKind(node){ return node.type==='runPrompt' ? 'prompt' : node.type==='script' ? 'script' : node.type==='data' ? 'data' : null; }

  // Opens what a node points at: its prompt/script file, its database tables, or its webhook endpoint.
  // A missing file is created on the spot, named after the step.
  function openNode(node){
    if(!node || !canOpenNode(node)) return false;
    if(node.type==='trigger') return openWebhookView(node.id);
    const kind = nodeFileKind(node), key = nodeFileKey(node);
    let path = node.config[key], created = false;
    if(!path){ path = uniquePath(kind, slugify(node.name) || FOLDERS[kind].noun); node.config[key] = path; }
    if(!Workspace.exists(path)){ Workspace.write(path, newFileContent(kind, path)); created = true; }
    if(kind==='data') syncDataTable(node);
    updateNodeVisual(node);
    openFile(path, { table: kind==='data' ? node.config.table : null });
    if(created) setStatus('Created '+path+' — press Esc to return to the canvas.');
    return true;
  }

  function openFile(path, opts){
    opts = opts || {};
    const kind = fileKindOf(path);
    if(!kind || kind==='flow' || !Workspace.exists(path)) return false;
    closeAllPhrasePopovers();
    if(!fileView) fileViewReturnFocus = document.activeElement;
    if(debugRun && debugRun.path!==path) discardDebugRun();
    fileView = { type:'file', path, mode: kind==='data' ? (opts.mode || 'tables') : 'code', focusTable: opts.table || null, debug: !!(debugRun && debugRun.path===path) };
    fileViewEl.hidden = false;
    renderFileView();
    focusFileView(opts.focusName);
    if(!opts.focusName) setStatus('Editing '+path+' — press Esc to return to the canvas.');
    renderSidebar();
    return true;
  }

  function openWebhookView(nodeId){
    const node = state.nodes.find(n=>n.id===nodeId);
    if(!node || node.type!=='trigger' || node.config.triggerType!=='webhook') return false;
    ensureWebhook(node);
    updateNodeVisual(node);
    closeAllPhrasePopovers();
    if(!fileView) fileViewReturnFocus = document.activeElement;
    discardDebugRun();
    fileView = { type:'webhook', nodeId };
    fileViewEl.hidden = false;
    renderFileView();
    focusFileView();
    setStatus('Webhook endpoint for “'+node.name+'” — press Esc to return to the canvas.');
    renderSidebar();
    return true;
  }

  function closeFileView(){
    if(!fileView) return;
    const fv = fileView;
    discardDebugRun();
    fileView = null;
    fileViewEl.hidden = true;
    fileViewEl.innerHTML = '';
    // Return focus to the card that opened the view, else to wherever the user was.
    const node = fv.type==='webhook' ? state.nodes.find(n=>n.id===fv.nodeId)
      : state.nodes.find(n=>n.id===selectedNodeId && nodeFilePath(n)===fv.path);
    const pill = node && nodeEl(node.id) && nodeEl(node.id).querySelector('.phrase-pill.file-pill, .phrase-pill.link-pill');
    if(pill) pill.focus({ preventScroll:true });
    else if(fileViewReturnFocus && document.contains(fileViewReturnFocus)) fileViewReturnFocus.focus({ preventScroll:true });
    fileViewReturnFocus = null;
    renderSidebar();
    setStatus('Back on the canvas.');
  }

  function focusFileView(selectName){
    const pathInput = fileViewEl.querySelector('.fv-path');
    if(selectName && pathInput){
      pathInput.focus({ preventScroll:true });
      const base = baseName(pathInput.value), start = pathInput.value.length - base.length, dot = base.lastIndexOf('.');
      pathInput.setSelectionRange(start, start + (dot>0 ? dot : base.length));
      return;
    }
    const target = fileViewEl.querySelector('.ce-input') || fileViewEl.querySelector('.st-table.is-focus .st-table-name, .st-table-name, .wh-copy-url') || pathInput;
    if(target){ target.focus({ preventScroll:true }); if(target.classList.contains('ce-input')) target.setSelectionRange(0, 0); }
  }

  function fvShellHtml(o){
    return '<div class="fv-card">'+
      '<header class="fv-head">'+
        '<button type="button" class="btn btn-ghost btn-sm fv-back" title="Back to canvas (Esc)"><span class="btn-ic">'+ICONS.chevronLeft+'</span>Canvas</button>'+
        '<span class="fv-divider" aria-hidden="true"></span>'+
        '<div class="fv-title"><span class="fv-icon" style="color:'+o.color+'">'+(ICONS[o.icon]||'')+'</span>'+
          '<div class="fv-title-text">'+o.titleHtml+'<span class="fv-meta"></span></div></div>'+
        (o.tabs ? '<div class="fv-seg" role="tablist" aria-label="View">'+o.tabs.map(t=>
          '<button type="button" role="tab" class="fv-seg-btn'+(t.active?' is-active':'')+'" aria-selected="'+t.active+'" data-mode="'+t.mode+'">'+t.label+'</button>').join('')+'</div>' : '')+
        (o.runnable ? '<button type="button" class="btn btn-run btn-sm fv-run" title="Run for debugging (Ctrl+Enter)" aria-keyshortcuts="Control+Enter"><span class="btn-ic">'+ICONS.play+'</span>Run</button>' : '')+
      '</header>'+
      '<div class="fv-scroll"></div>'+
      (o.runnable ? '<div class="dbg" hidden></div>' : '')+
      '<footer class="fv-foot"><span><span class="cmd-kbd">Esc</span>back to canvas · '+o.footNote+'</span><span class="fv-foot-right"></span></footer>'+
    '</div>';
  }

  function renderFileViewMeta(){
    const meta = fileViewEl.querySelector('.fv-meta');
    if(!fileView || !meta) return;
    if(fileView.type==='webhook'){
      const node = state.nodes.find(n=>n.id===fileView.nodeId);
      meta.textContent = node ? 'Trigger “'+node.name+'” · '+(node.config.webhookMethod||'POST')+' · not live until deployed' : '';
      return;
    }
    const kind = fileKindOf(fileView.path);
    const users = usersOf(fileView.path);
    const parts = [FOLDERS[kind].kindLabel];
    if(kind==='data'){ const n = tablesOf(fileView.path).length; parts.push(n+' table'+(n===1?'':'s')); }
    parts.push(users.length ? 'used by '+users.map(n=>'“'+n.name+'”').join(', ') : 'not used in this flow');
    if(kind==='prompt'){ const vars = templateVariables(Workspace.read(fileView.path)); if(vars.length) parts.push('variables: '+vars.join(', ')); }
    meta.textContent = parts.join(' · ');
  }

  function renderFileView(opts){
    if(!fileView) return;
    const oldScroll = fileViewEl.querySelector('.fv-scroll');
    const prevScroll = opts && opts.keepScroll && oldScroll ? oldScroll.scrollTop : 0;
    if(fileView.type==='webhook') renderWebhookView();
    else {
      const path = fileView.path;
      if(!Workspace.exists(path)){ closeFileView(); return; }
      const kind = fileKindOf(path), folder = FOLDERS[kind];
      const runnable = isDebuggable(kind);
      fileViewEl.innerHTML = fvShellHtml({
        icon: folder.icon, color: folder.color,
        titleHtml: '<input class="fv-path" type="text" spellcheck="false" autocomplete="off" aria-label="File path — edit to rename">',
        tabs: kind==='data' ? [{mode:'tables', label:'Tables', active: fileView.mode==='tables'}, {mode:'sql', label:'SQL', active: fileView.mode==='sql'}] : null,
        runnable,
        footNote: 'changes save automatically'+(runnable ? ' · <span class="cmd-kbd">Ctrl</span><span class="cmd-kbd">Enter</span>run for debugging' : '')
      });
      fileViewEl.setAttribute('aria-label', folder.kindLabel+' '+path);
      fileViewEl.querySelector('.fv-back').addEventListener('click', closeFileView);
      fileViewEl.querySelectorAll('.fv-seg-btn').forEach(b=>b.addEventListener('click', ()=>{
        if(fileView.mode===b.dataset.mode) return;
        fileView.mode = b.dataset.mode; renderFileView(); focusFileView();
      }));
      const pathInput = fileViewEl.querySelector('.fv-path');
      pathInput.value = path;
      pathInput.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ e.preventDefault(); pathInput.blur(); }
        else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); pathInput.value = fileView.path; pathInput.blur(); }
      });
      pathInput.addEventListener('change', ()=>renameFromView(pathInput));
      const scroll = fileViewEl.querySelector('.fv-scroll');
      if(kind==='data' && fileView.mode==='tables'){
        const form = document.createElement('div');
        form.className = 'detail-form schema-editor';
        scroll.appendChild(form);
        renderSchemaEditor(path, form, fileView.focusTable);
        fileView.focusTable = null;
      } else {
        fileView.editor = renderCodeEditor({
          lang: folder.lang, label: folder.kindLabel+' '+path,
          get: ()=>Workspace.read(fileView.path) || '',
          set: v=>{ Workspace.write(fileView.path, v); refreshFileUsers(fileView.path); renderFileViewMeta(); if(kind==='data') renderSidebar(); if(kind==='prompt') refreshDebugInputs(); }
        }, scroll, fileViewEl.querySelector('.fv-foot-right'));
      }
      if(runnable){
        fileViewEl.querySelector('.fv-run').addEventListener('click', ()=>{ if(fileView.debug && debugRun && debugRun.path===fileView.path && debugRun.status==='running') stopDebugRun(); else startDebugRun(); });
        renderDebugPanel();
      }
    }
    renderFileViewMeta();
    const scroll = fileViewEl.querySelector('.fv-scroll');
    if(scroll && prevScroll) scroll.scrollTop = prevScroll;
  }

  function renameFromView(input){
    const from = fileView.path, kind = fileKindOf(from);
    const to = normalizePath(kind, input.value);
    if(!to){ input.value = from; setStatus('That isn’t a valid file name. Use letters, numbers, dashes, underscores or dots.'); return; }
    if(to===from){ input.value = from; return; }
    if(Workspace.exists(to)){ input.value = from; setStatus(to+' already exists.'); return; }
    renameFile(from, to);
    fileView.path = to;
    input.value = to;
    updateRunHead();
    fileViewEl.setAttribute('aria-label', FOLDERS[kind].kindLabel+' '+to);
    renderFileViewMeta();
  }

  // Applies `fn(node)` to every step in saved flow files and rewrites the files it changed; returns how many.
  function updateSavedFlows(fn){
    let count = 0;
    Workspace.list('flow').forEach(fp=>{
      const e = Workspace.entry(fp);
      if(!e || !e.state) return;
      let hit = false;
      e.state.nodes.forEach(n=>{ if(n.config && fn(n)) hit = true; });
      if(hit){ Workspace.write(fp, generateYaml(e.state, e.name, e.desc), { state: e.state }); count++; }
    });
    return count;
  }

  // Renames a file and updates every step that points at it, in the open flow and in saved flow files.
  function renameFile(from, to){
    const wasClean = !isDirty();
    if(!Workspace.rename(from, to)) return false;
    DebugInputs.rename(from, to);
    if(debugRun && debugRun.path===from) debugRun.path = to;
    state.nodes.forEach(n=>{ const k = nodeFileKey(n); if(k && n.config[k]===from){ n.config[k] = to; updateNodeVisual(n); } });
    const flows = updateSavedFlows(n=>{ const k = nodeFileKey(n); if(k && n.config[k]===from){ n.config[k] = to; return true; } return false; });
    if(wasClean) markSaved();
    renderSidebar();
    setStatus('Renamed to '+to+(flows ? ' · updated '+flows+' saved flow'+(flows===1?'':'s') : '')+'.');
    return true;
  }

  // Editable, line-numbered, highlighted code: a transparent <textarea> over a highlighted <pre>.
  // `scroll` is the element that scrolls (the textarea itself never does).
  function renderCodeEditor(opts, scroll, footRight){
    const lang = LANGS[opts.lang] || { label: opts.lang, indent:'  ' };
    const host = document.createElement('div');
    host.className = 'code-editor';
    host.innerHTML = '<pre class="ce-gutter" aria-hidden="true"></pre>'+
      '<div class="ce-stack"><pre class="ce-hl" aria-hidden="true"></pre>'+
      '<textarea class="ce-input" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>';
    scroll.appendChild(host);
    const ta = host.querySelector('.ce-input');
    const hl = host.querySelector('.ce-hl');
    const gutter = host.querySelector('.ce-gutter');
    ta.setAttribute('aria-label', opts.label);
    ta.value = opts.get();
    let charWidth = 0;

    function caret(){
      const before = ta.value.slice(0, ta.selectionStart);
      return { line: before.split('\n').length, col: ta.selectionStart - before.lastIndexOf('\n') };
    }
    function paint(){ hl.innerHTML = highlightCode(ta.value, opts.lang); paintCaret(); }
    function paintCaret(){
      const total = ta.value.split('\n').length;
      const pos = caret();
      let nums = '';
      for(let i=1;i<=total;i++) nums += (i===pos.line ? '<span class="is-current">'+i+'</span>' : i) + (i<total ? '\n' : '');
      gutter.innerHTML = nums;
      if(footRight) footRight.innerHTML = '<span>Ln '+pos.line+', Col '+pos.col+'</span><span>'+total+' line'+(total===1?'':'s')+'</span><span>'+lang.label+'</span><span>Spaces: '+lang.indent.length+'</span>';
    }
    function revealCaret(){
      const cs = getComputedStyle(ta);
      const lh = parseFloat(cs.lineHeight) || 22;
      if(!charWidth){ const c = document.createElement('canvas').getContext('2d'); c.font = cs.fontSize+' '+cs.fontFamily; charWidth = c.measureText('M').width || 8; }
      const pos = caret();
      const top = host.offsetTop;
      const y = top + 14 + (pos.line-1)*lh, x = gutter.offsetWidth + 16 + (pos.col-1)*charWidth;
      if(y < scroll.scrollTop) scroll.scrollTop = Math.max(0, y - lh);
      else if(y + lh > scroll.scrollTop + scroll.clientHeight) scroll.scrollTop = y + 2*lh - scroll.clientHeight;
      const left = scroll.scrollLeft + gutter.offsetWidth;
      if(x < left) scroll.scrollLeft = Math.max(0, x - gutter.offsetWidth - 4*charWidth);
      else if(x > scroll.scrollLeft + scroll.clientWidth - 2*charWidth) scroll.scrollLeft = x - scroll.clientWidth + 6*charWidth;
    }
    function insert(text){
      // execCommand keeps the native undo stack; fall back to setRangeText where unsupported.
      if(!document.execCommand('insertText', false, text)){
        ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
        ta.dispatchEvent(new Event('input', { bubbles:true }));
      }
    }
    ta.addEventListener('input', ()=>{ opts.set(ta.value); paint(); revealCaret(); });
    ['keyup','click','focus','select'].forEach(ev=>ta.addEventListener(ev, paintCaret));
    ta.addEventListener('scroll', ()=>{ ta.scrollTop = 0; ta.scrollLeft = 0; });
    ta.addEventListener('keydown', e=>{
      if(e.key==='Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey){
        e.preventDefault(); insert(lang.indent);
      } else if(e.key==='Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey){
        // Auto-indent: keep the current indentation; Python blocks (":") and JSON/SQL openers ("{", "[", "(") indent one level.
        e.preventDefault();
        const lineStart = ta.value.lastIndexOf('\n', ta.selectionStart - 1) + 1;
        const current = ta.value.slice(lineStart, ta.selectionStart);
        const ws = (/^[ \t]*/.exec(current) || [''])[0];
        const opens = (opts.lang==='python' && /:\s*$/.test(current)) || (/[\[{(]\s*$/.test(current) && opts.lang!=='markdown');
        insert('\n' + ws + (opens ? lang.indent : ''));
      }
    });
    paint();
    // Lets debug output jump to a reported line (e.g. a SyntaxError) and select it.
    ta.goToLine = n=>{
      const lines = ta.value.split('\n');
      const line = Math.max(1, Math.min(lines.length, n|0));
      const start = lines.slice(0, line-1).reduce((s, l)=>s + l.length + 1, 0);
      ta.focus({ preventScroll:true });
      ta.setSelectionRange(start, start + lines[line-1].length);
      paintCaret(); revealCaret();
    };
    return ta;
  }

  /* ---------------- Debug runs for prompts and scripts (run card pattern from fs.html) ----------------
     Simulated: nothing leaves the browser. Scripts are compiled and traced statically against the debug
     input; prompts are rendered with the debug variables and answered by a stand-in model.
     Swap simulateScript / simulatePrompt for ServerLink calls once a real execution server exists. */
  const DEBUG_RUNNERS = { script:{ cmd:'python', noun:'script' }, prompt:{ cmd:'prompt', noun:'prompt' } };
  const MAX_RUN_LINES = 2000;
  const PY_UNKNOWN = {}; // scope value whose content is only known at runtime
  let debugRun = null; // { path, kind, lines, pending, status, code, warnings, summary, started, ms, timer, follow, scrollTop }

  function isDebuggable(kind){ return Object.prototype.hasOwnProperty.call(DEBUG_RUNNERS, kind || ''); }
  const runSecs = ms => (ms/1000).toFixed(1)+' s';
  function clip(s, n){ s = String(s); n = n || 160; return s.length>n ? s.slice(0, n-1)+'…' : s; }

  // Debug inputs live next to the files (not in them), so a run can be repeated after every edit.
  const DebugInputs = (function(){
    const KEY = 'flow_machine_debug_inputs';
    let map = {};
    try{ map = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ map = {}; }
    function save(){
      try{ localStorage.setItem(KEY, JSON.stringify(map)); }
      catch(e){ Logger.warn('Could not save debug inputs.', { error: String(e) }); }
    }
    return {
      get: p => map[p] || null,
      set(p, v){ map[p] = v; save(); },
      rename(from, to){ if(map[from]){ map[to] = map[from]; delete map[from]; save(); } },
      remove(p){ if(map[p]){ delete map[p]; save(); } }
    };
  })();

  // Saved inputs, else a guess from the step that uses the file (its task, or a webhook's test payload).
  function debugInputsFor(path){
    const saved = DebugInputs.get(path) || {};
    const node = usersOf(path)[0] || null;
    if(fileKindOf(path)==='script'){
      if(typeof saved.json==='string') return { json: saved.json };
      const edge = node && state.edges.find(e=>e.to===node.id);
      const src = edge && state.nodes.find(n=>n.id===edge.from);
      const fromWebhook = src && src.type==='trigger' && src.config.triggerType==='webhook' && describePayload(src.config).ok;
      return { json: fromWebhook ? src.config.webhookPayload : '{}' };
    }
    return {
      vars: Object.assign({}, saved.vars),
      task: typeof saved.task==='string' ? saved.task : (node ? node.config.task || '' : ''),
      reasoning: typeof saved.reasoning==='boolean' ? saved.reasoning : !!(node && node.config.reasoning)
    };
  }

  function activeDebugRun(){ return debugRun && fileView && fileView.type==='file' && debugRun.path===fileView.path ? debugRun : null; }

  function startDebugRun(){
    if(!fileView || fileView.type!=='file') return false;
    const path = fileView.path, kind = fileKindOf(path);
    if(!isDebuggable(kind) || !Workspace.exists(path)) return false;
    discardDebugRun();
    const inputs = debugInputsFor(path), source = Workspace.read(path) || '';
    const result = kind==='script' ? simulateScript(path, source, inputs) : simulatePrompt(path, source, inputs);
    const current = { path, kind, lines:[], pending: result.lines.slice(), status:'running', code: result.code, warnings: result.warnings || 0,
      summary: result.summary || '', started: Date.now(), ms:0, timer:null, follow:true, scrollTop:0 };
    debugRun = current;
    const panelBefore = fileViewEl.querySelector('.dbg');
    const hadFocus = !!(panelBefore && panelBefore.contains(document.activeElement));
    fileView.debug = true;
    fileView.debugTab = 'console';
    Logger.info('Debug run started: '+path, { kind });
    setStatus('Running '+path+' for debugging…');
    renderDebugPanel();
    if(hadFocus){ const out = fileViewEl.querySelector('.dbg .run-output'); if(out) out.focus({ preventScroll:true }); }
    current.timer = setInterval(()=>{
      if(debugRun!==current){ clearInterval(current.timer); return; }
      if(current.pending.length){ addRunLine(current, current.pending.shift()); return; }
      clearInterval(current.timer); current.timer = null;
      current.status = current.code===0 ? 'done' : 'failed';
      current.ms = Date.now() - current.started;
      addRunLine(current, ['dim', (kind==='script' ? 'Process exited with code ' : 'Finished with code ')+current.code]);
      updateRunHead();
      const what = current.path+(current.summary ? ' · '+current.summary : '');
      if(current.code!==0){ Logger.error('Debug run failed: '+what, { exit: current.code }); setStatus(current.path+' failed · exit '+current.code+(current.summary ? ' · '+current.summary : '')+' — click an error line to jump to it.'); }
      else if(current.warnings){ Logger.warn('Debug run finished with warnings: '+what); setStatus(current.path+' finished with '+current.summary+' — see the output.'); }
      else { Logger.success('Debug run finished: '+current.path, { ms: current.ms }); setStatus(current.path+' finished · exit 0 · '+runSecs(current.ms)+'.'); }
    }, kind==='prompt' ? 45 : 110);
    return true;
  }

  function stopDebugRun(){
    const r = debugRun;
    if(!r || !r.timer) return;
    clearInterval(r.timer); r.timer = null;
    r.status = 'stopped'; r.code = 130; r.ms = Date.now() - r.started;
    addRunLine(r, ['dim', '^C Stopped']);
    updateRunHead();
    Logger.warn('Debug run stopped: '+r.path);
    setStatus('Stopped the debug run of '+r.path+'.');
  }
  function discardDebugRun(){
    if(debugRun && debugRun.timer) clearInterval(debugRun.timer);
    debugRun = null;
  }
  function closeDebugPanel(){
    discardDebugRun();
    if(!fileView) return;
    fileView.debug = false;
    renderDebugPanel();
    if(fileView.editor) fileView.editor.focus({ preventScroll:true });
  }

  function updateRunButton(){
    const btn = fileViewEl.querySelector('.fv-run');
    if(!btn) return;
    const r = activeDebugRun(), running = !!(r && r.status==='running');
    btn.innerHTML = '<span class="btn-ic">'+(running ? ICONS.square : ICONS.play)+'</span>'+(running ? 'Stop' : 'Run');
    btn.title = running ? 'Stop the debug run' : 'Run for debugging (Ctrl+Enter)';
  }

  // The panel has two tabs: Input (debug inputs) and Console (run output). A run switches to Console.
  function renderDebugPanel(){
    const panel = fileViewEl.querySelector('.dbg');
    if(!panel || !fileView) return;
    updateRunButton();
    panel.hidden = !fileView.debug;
    if(!fileView.debug){ panel.innerHTML = ''; return; }
    const tab = fileView.debugTab==='input' ? 'input' : 'console';
    panel.setAttribute('aria-label', 'Debug run');
    panel.innerHTML = '<div class="dbg-bar">'+
        '<div class="fv-seg dbg-tabs" role="tablist" aria-label="Debug run">'+
          '<button type="button" role="tab" class="fv-seg-btn" id="dbgTabInput" aria-controls="dbgPaneInput" data-tab="input">Input</button>'+
          '<button type="button" role="tab" class="fv-seg-btn" id="dbgTabConsole" aria-controls="dbgPaneConsole" data-tab="console"><span class="dbg-dot" aria-hidden="true"></span>Console</button>'+
        '</div>'+
        '<span class="dbg-meta"></span><div class="dbg-actions"></div>'+
      '</div>'+
      '<form class="dbg-pane dbg-input" id="dbgPaneInput" role="tabpanel" aria-labelledby="dbgTabInput" novalidate></form>'+
      '<section class="dbg-pane run-card" id="dbgPaneConsole" role="tabpanel" aria-labelledby="dbgTabConsole">'+
        '<div class="run-body"><pre class="run-output" role="log" aria-live="off" tabindex="0" aria-label="Console output"></pre>'+
        '<button class="run-jump" type="button" hidden><span class="btn-ic">'+ICONS.arrowDown+'</span>Latest output</button></div></section>';
    const tabs = panel.querySelector('.dbg-tabs');
    tabs.addEventListener('click', e=>{ const b = e.target.closest('[data-tab]'); if(b) setDebugTab(b.dataset.tab); });
    tabs.addEventListener('keydown', e=>{
      if(e.key!=='ArrowLeft' && e.key!=='ArrowRight' && e.key!=='Home' && e.key!=='End') return;
      e.preventDefault();
      const next = e.key==='Home' ? 'input' : e.key==='End' ? 'console' : (fileView.debugTab==='input' ? 'console' : 'input');
      setDebugTab(next, true);
    });
    panel.querySelector('.dbg-actions').addEventListener('click', e=>{
      if(e.target.closest('[data-run-stop]')) stopDebugRun();
      else if(e.target.closest('[data-run-again]')) startDebugRun();
      else if(e.target.closest('[data-run-close]')) closeDebugPanel();
    });
    const out = panel.querySelector('.run-output'), jump = panel.querySelector('.run-jump');
    out.addEventListener('scroll', ()=>{
      const r = activeDebugRun();
      if(!r || panel.querySelector('#dbgPaneConsole').hidden) return;
      r.follow = out.scrollHeight - out.scrollTop - out.clientHeight < 8;
      r.scrollTop = out.scrollTop;
      if(r.follow) jump.hidden = true;
    });
    jump.addEventListener('click', ()=>{ const r = activeDebugRun(); if(r) r.follow = true; out.scrollTop = out.scrollHeight; jump.hidden = true; });
    out.addEventListener('click', e=>{
      const b = e.target.closest('[data-line]');
      if(b && fileView.editor) fileView.editor.goToLine(+b.dataset.line);
    });
    renderDebugInputs();
    const r = activeDebugRun();
    if(!r) out.innerHTML = '<span class="run-empty">Press Run to try this '+DEBUG_RUNNERS[fileKindOf(fileView.path)].noun+' with the values on the Input tab.</span>';
    else {
      const frag = document.createDocumentFragment();
      r.lines.forEach(l=>frag.appendChild(runLineEl(l)));
      if(r.status==='running'){ const caret = document.createElement('span'); caret.className = 'o-caret'; caret.setAttribute('aria-hidden', 'true'); caret.textContent = '▍'; frag.appendChild(caret); }
      out.appendChild(frag);
    }
    paintDebugBar();
    setDebugTab(tab);
  }

  function setDebugTab(tab, focus){
    const panel = fileViewEl.querySelector('.dbg');
    if(!panel || panel.hidden || !fileView) return;
    fileView.debugTab = tab;
    panel.querySelectorAll('.dbg-tabs [data-tab]').forEach(b=>{
      const on = b.dataset.tab===tab;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
      if(on && focus) b.focus();
    });
    panel.querySelector('#dbgPaneInput').hidden = tab!=='input';
    panel.querySelector('#dbgPaneConsole').hidden = tab!=='console';
    // A hidden console can't scroll, so restore its position once it is shown again.
    const r = activeDebugRun(), out = panel.querySelector('.run-output');
    if(tab==='console' && r) out.scrollTop = r.follow ? out.scrollHeight : r.scrollTop;
  }

  // Status dot on the Console tab, command + exit status, and the Run / Stop / Close actions.
  function paintDebugBar(){
    const panel = fileViewEl.querySelector('.dbg');
    if(!panel || panel.hidden || !fileView) return;
    const r = activeDebugRun(), runner = DEBUG_RUNNERS[fileKindOf(fileView.path)];
    const running = !!(r && r.status==='running');
    const state = !r ? '' : r.status==='done' && r.warnings ? 'warn' : r.status;
    panel.querySelector('.dbg-dot').className = 'dbg-dot'+(state ? ' is-'+state : '');
    const meta = !r ? 'not run yet' : running ? 'running…' : r.status==='stopped' ? 'stopped · '+runSecs(r.ms)
      : 'exit '+r.code+(r.warnings ? ' · '+r.warnings+' warning'+(r.warnings===1 ? '' : 's') : '')+' · '+runSecs(r.ms);
    const metaEl = panel.querySelector('.dbg-meta');
    metaEl.textContent = runner.cmd+' '+fileView.path+' · '+meta;
    metaEl.title = metaEl.textContent;
    panel.querySelector('.dbg-actions').innerHTML =
      (running ? '<button type="button" class="btn btn-sm" data-run-stop><span class="btn-ic">'+ICONS.square+'</span>Stop</button>'
               : '<button type="button" class="btn btn-run btn-sm" data-run-again title="Run (Ctrl+Enter)"><span class="btn-ic">'+ICONS.play+'</span>'+(r ? 'Run again' : 'Run')+'</button>')+
      '<button type="button" class="btn btn-ghost btn-sm dbg-close" data-run-close aria-label="Close debug panel" title="Close debug panel"><span class="btn-ic">'+ICONS.x+'</span></button>';
  }
  function updateRunHead(){
    updateRunButton();
    const panel = fileViewEl.querySelector('.dbg');
    if(!panel || panel.hidden) return;
    paintDebugBar();
    const r = activeDebugRun();
    if(r && r.status!=='running'){ const caret = panel.querySelector('.o-caret'); if(caret) caret.remove(); }
  }

  // Output lines are [class, text, sourceLine?]; lines that point at the source jump to it when clicked.
  function runLineEl(line){
    const el = document.createElement(line[2] ? 'button' : 'span');
    if(line[2]){ el.type = 'button'; el.dataset.line = line[2]; el.title = 'Go to line '+line[2]; }
    el.className = 'o-'+(line[0] || 'txt');
    el.textContent = line[1] || ' ';
    return el;
  }
  // Appends without re-rendering, so output can grow without resetting scroll or thrashing the DOM.
  function addRunLine(current, line){
    current.lines.push(line);
    if(current.lines.length > MAX_RUN_LINES) current.lines.splice(0, current.lines.length - MAX_RUN_LINES);
    if(current!==activeDebugRun()) return;
    const out = fileViewEl.querySelector('.dbg .run-output');
    if(!out) return;
    const caret = out.querySelector('.o-caret');
    out.insertBefore(runLineEl(line), caret);
    while(out.childElementCount > MAX_RUN_LINES + (caret ? 1 : 0)) out.firstElementChild.remove();
    if(current.follow) out.scrollTop = out.scrollHeight;
    else fileViewEl.querySelector('.dbg .run-jump').hidden = false;
  }

  function renderDebugInputs(){
    const form = fileViewEl.querySelector('.dbg-input');
    if(!form || !fileView) return;
    const kind = fileKindOf(fileView.path), inputs = debugInputsFor(fileView.path);
    const save = ()=>DebugInputs.set(fileView.path, inputs);
    form.onsubmit = e=>{ e.preventDefault(); startDebugRun(); };
    if(kind==='script'){
      form.innerHTML = '<p class="dbg-label">Input <code>run(input)</code></p><div class="fv-embed"></div><p class="dbg-hint" role="status" aria-live="polite"></p>';
      const hint = form.querySelector('.dbg-hint');
      const paint = ()=>{
        let err = null;
        if(inputs.json.trim()){ try{ JSON.parse(inputs.json); }catch(e){ err = e.message; } }
        hint.className = 'dbg-hint'+(err ? ' is-error' : '');
        hint.innerHTML = err ? 'Invalid JSON: '+escapeHtml(err) : 'JSON, passed to <code>run()</code> as Python values. Empty means <code>None</code>.';
      };
      renderCodeEditor({ lang:'json', label:'Debug input for run(), JSON', get: ()=>inputs.json, set: v=>{ inputs.json = v; save(); paint(); } }, form.querySelector('.fv-embed'), null);
      paint();
      return;
    }
    const vars = templateVariables(Workspace.read(fileView.path) || '');
    form.dataset.vars = vars.join(',');
    form.innerHTML = '<p class="dbg-label">Variables <code>'+vars.length+' in prompt</code></p>'+
      (vars.length ? '' : '<p class="dbg-hint">No <code>{{variable}}</code> placeholders — the prompt is sent as written.</p>')+
      vars.map((v, i)=>'<div class="dbg-field'+(inputs.vars[v] ? '' : ' is-missing')+'"><label for="dbgVar'+i+'">{{'+escapeHtml(v)+'}}</label>'+
        '<input type="text" id="dbgVar'+i+'" data-var="'+escapeHtml(v)+'" spellcheck="false" autocomplete="off" placeholder="Value for '+escapeHtml(v)+'"></div>').join('')+
      '<div class="dbg-field"><label for="dbgTask">task</label><input type="text" id="dbgTask" data-task spellcheck="false" autocomplete="off" placeholder="What the step asks the model to do"></div>'+
      '<label class="dbg-check"><input type="checkbox" data-reasoning> With reasoning</label>';
    form.querySelectorAll('[data-var]').forEach(inp=>{ inp.value = inputs.vars[inp.dataset.var] || ''; });
    form.querySelector('[data-task]').value = inputs.task;
    form.querySelector('[data-reasoning]').checked = inputs.reasoning;
    form.oninput = form.onchange = e=>{
      const t = e.target;
      if(t.dataset.var!==undefined){ inputs.vars[t.dataset.var] = t.value; t.closest('.dbg-field').classList.toggle('is-missing', !t.value); }
      else if(t.dataset.task!==undefined) inputs.task = t.value;
      else if(t.dataset.reasoning!==undefined) inputs.reasoning = t.checked;
      save();
    };
    form.onkeydown = e=>{ if(e.key==='Enter' && !e.ctrlKey && !e.metaKey && e.target.matches('input[type=text]')){ e.preventDefault(); startDebugRun(); } };
  }
  // Re-renders the prompt's variable fields only when its set of {{variables}} changes.
  function refreshDebugInputs(){
    const form = fileViewEl.querySelector('.dbg-input');
    if(form && fileView && fileView.debug && form.dataset.vars!==templateVariables(Workspace.read(fileView.path) || '').join(',')) renderDebugInputs();
  }

  /* ---- Python values (JSON in, JSON out) ---- */
  function pyTypeName(v){
    return v===null || v===undefined ? 'NoneType' : typeof v==='boolean' ? 'bool' : typeof v==='number' ? (Number.isInteger(v) ? 'int' : 'float')
      : typeof v==='string' ? 'str' : Array.isArray(v) ? 'list' : 'dict';
  }
  function isPyDict(v){ return v!==null && typeof v==='object' && !Array.isArray(v); }
  function pyRepr(v){
    if(v===null || v===undefined) return 'None';
    if(v===true) return 'True';
    if(v===false) return 'False';
    if(typeof v==='number') return String(v);
    if(typeof v==='string') return "'"+v.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\t/g,'\\t')+"'";
    if(Array.isArray(v)) return '['+v.map(pyRepr).join(', ')+']';
    return '{'+Object.keys(v).map(k=>pyRepr(k)+': '+pyRepr(v[k])).join(', ')+'}';
  }
  function pyStr(v){ return typeof v==='string' ? v : pyRepr(v); }
  function pyKey(k){ return typeof k==='string' ? k : k===null ? 'None' : k===true ? 'True' : k===false ? 'False' : String(k); }
  function pyIndex(v, key, fail){
    if(Array.isArray(v) || typeof v==='string'){
      const what = Array.isArray(v) ? 'list' : 'string';
      if(typeof key!=='number' || !Number.isInteger(key)) fail('TypeError', Array.isArray(v) ? 'list indices must be integers or slices, not '+pyTypeName(key) : "string indices must be integers, not '"+pyTypeName(key)+"'");
      const idx = key<0 ? v.length+key : key;
      if(idx<0 || idx>=v.length) fail('IndexError', what+' index out of range');
      return v[idx];
    }
    if(isPyDict(v)){
      if(!Object.prototype.hasOwnProperty.call(v, pyKey(key))) fail('KeyError', pyRepr(key));
      return v[pyKey(key)];
    }
    return fail('TypeError', "'"+pyTypeName(v)+"' object is not subscriptable");
  }

  // Evaluates what a static run can know: literals (str, numbers, True/False/None, lists, tuples, dicts) and
  // names in `scope`, with ["key"], [0] and .get("key", default) lookups. Lookups raise like Python
  // (KeyError, IndexError, TypeError). Returns { ok, value } | { error:{type,message} } | { unknown }.
  function evalPy(src, scope){
    const s = String(src);
    let i = 0;
    const unknown = why=>{ throw { unknown: why }; };
    const fail = (type, message)=>{ throw { pyError: { type, message } }; };
    const ws = ()=>{ while(i<s.length && /\s/.test(s[i])) i++; };
    const expect = ch=>{ ws(); if(s[i]!==ch) unknown('syntax'); i++; };
    function stringLit(){
      let out = '';
      for(;;){
        const m = /^([rRbBuU]{0,2})("""|'''|"|')/.exec(s.slice(i));
        if(!m) unknown('syntax');
        const raw = /r/i.test(m[1]), q = m[2];
        i += m[0].length;
        let closed = false;
        while(i<s.length){
          if(s.startsWith(q, i)){ i += q.length; closed = true; break; }
          const c = s[i];
          if(c==='\\' && i+1<s.length){
            const n = s[i+1];
            const esc = raw ? undefined : { n:'\n', t:'\t', r:'\r', '\\':'\\', "'":"'", '"':'"', '0':'\0', '\n':'' }[n];
            if(esc!==undefined){ out += esc; i += 2; continue; }
            if(!raw && (n==='x' || n==='u')){
              const len = n==='x' ? 2 : 4, hex = s.substr(i+2, len);
              if(new RegExp('^[0-9a-fA-F]{'+len+'}$').test(hex)){ out += String.fromCharCode(parseInt(hex, 16)); i += 2+len; continue; }
            }
            out += c + n; i += 2; continue;
          }
          out += c; i++;
        }
        if(!closed) unknown('syntax');
        ws();
        if(!/^[rRbBuU]{0,2}["']/.test(s.slice(i))) return out;
      }
    }
    function items(close){
      const out = [];
      let comma = false;
      for(;;){
        ws();
        if(s[i]===close){ i++; break; }
        out.push(value()); ws();
        if(s[i]===','){ i++; comma = true; continue; }
        if(s[i]!==close) unknown('syntax');
        i++; break;
      }
      return { items: out, single: out.length===1 && !comma };
    }
    function dict(){
      const out = {};
      for(;;){
        ws();
        if(s[i]==='}'){ i++; return out; }
        const k = value(); ws();
        if(s[i]!==':') unknown('syntax');
        i++;
        const v = value();
        if(k!==null && typeof k==='object') fail('TypeError', "unhashable type: '"+pyTypeName(k)+"'");
        out[pyKey(k)] = v; ws();
        if(s[i]===','){ i++; continue; }
        if(s[i]!=='}') unknown('syntax');
      }
    }
    function value(){
      ws();
      const rest = s.slice(i);
      let v, m;
      if(s[i]==='['){ i++; v = items(']').items; }
      else if(s[i]==='('){ i++; const t = items(')'); v = t.single ? t.items[0] : t.items; }
      else if(s[i]==='{'){ i++; v = dict(); }
      else if(/^[rRbBuU]{0,2}["']/.test(rest)) v = stringLit();
      else if((m = /^-?(?:\d[\d_]*(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/.exec(rest))){ i += m[0].length; v = Number(m[0].replace(/_/g, '')); }
      else if((m = /^[A-Za-z_]\w*/.exec(rest)) && !/^[fF][rR]?["']|^[rR][fF]["']/.test(rest)){
        i += m[0].length;
        const name = m[0];
        if(name==='True') v = true;
        else if(name==='False') v = false;
        else if(name==='None') v = null;
        else if(Object.prototype.hasOwnProperty.call(scope, name) && scope[name]!==PY_UNKNOWN) v = scope[name];
        else unknown(name);
      } else unknown('syntax');
      for(;;){
        ws();
        if(s[i]==='['){ i++; const key = value(); expect(']'); v = pyIndex(v, key, fail); }
        else if(/^\.get\s*\(/.test(s.slice(i))){
          i = s.indexOf('(', i) + 1;
          const key = value(); ws();
          let dflt = null;
          if(s[i]===','){ i++; dflt = value(); }
          expect(')');
          if(!isPyDict(v)) fail('AttributeError', "'"+pyTypeName(v)+"' object has no attribute 'get'");
          v = Object.prototype.hasOwnProperty.call(v, pyKey(key)) ? v[pyKey(key)] : dflt;
        }
        else return v;
      }
    }
    try{
      const v = value(); ws();
      if(i<s.length) unknown('syntax');
      return { ok:true, value:v };
    }catch(e){
      if(e && e.pyError) return { ok:false, error:e.pyError };
      if(e && 'unknown' in e) return { ok:false, unknown:e.unknown };
      throw e;
    }
  }

  // Finds the first ':' outside brackets (skipping ':=' ) in string-masked code; -1 if none.
  function topLevelColon(code){
    let depth = 0;
    for(let i=0;i<code.length;i++){
      const c = code[i];
      if(c==='(' || c==='[' || c==='{') depth++;
      else if(c===')' || c===']' || c==='}') depth--;
      else if(c===':' && depth===0 && code[i+1]!=='=') return i;
    }
    return -1;
  }

  // A light Python front end: reports the first syntax or indentation error the way CPython words it,
  // otherwise returns logical statements { line, indent, text, code, header?, inline? } (`code` has strings masked as "s").
  function parsePython(source){
    const lines = String(source).replace(/\r\n?/g, '\n').split('\n');
    const PAIRS = { ')':'(', ']':'[', '}':'{' };
    const BLOCK_NAMES = { def:'function definition', class:'class definition' };
    const stmts = [], indents = [0], brackets = [];
    let triple = null, cont = false, stmt = null, expectIndent = null;
    const fail = (line, type, message)=>({ error: { line, type, message, text: lines[line-1] || '' } });
    for(let li=0; li<lines.length; li++){
      const raw = lines[li], ln = li+1;
      const inside = !!(triple || brackets.length || cont), inString = !!triple;
      let j = 0;
      if(!inside){
        if(/^[ \t]*(#.*)?$/.test(raw)) continue;
        const ind = /^[ \t]*/.exec(raw)[0], width = ind.replace(/\t/g, '        ').length;
        if(expectIndent){
          if(width<=indents[indents.length-1]) return fail(ln, 'IndentationError', 'expected an indented block after '+expectIndent.what+' on line '+expectIndent.line);
          indents.push(width); expectIndent = null;
        } else if(width>indents[indents.length-1]) return fail(ln, 'IndentationError', 'unexpected indent');
        else {
          while(width<indents[indents.length-1]) indents.pop();
          if(width!==indents[indents.length-1]) return fail(ln, 'IndentationError', 'unindent does not match any outer indentation level');
        }
        stmt = { line: ln, indent: width, text: '', code: '' };
        j = ind.length;
      }
      const from = j;
      let cut = raw.length;
      cont = false;
      for(; j<raw.length; j++){
        const c = raw[j];
        if(triple){
          if(c==='\\'){ j++; continue; }
          if(raw.startsWith(triple.q, j)){ j += 2; triple = null; stmt.code += 's'; }
          continue;
        }
        if(c==='#'){ cut = j; break; }
        if(c==='"' || c==="'"){
          if(raw.startsWith(c+c+c, j)){ triple = { q: c+c+c, line: ln }; j += 2; continue; }
          let k = j+1;
          while(k<raw.length && raw[k]!==c) k += raw[k]==='\\' ? 2 : 1;
          if(k>=raw.length) return fail(ln, 'SyntaxError', 'unterminated string literal (detected at line '+ln+')');
          stmt.code += 's'; j = k; continue;
        }
        if(c==='(' || c==='[' || c==='{') brackets.push({ ch:c, line:ln });
        else if(PAIRS[c]){
          const open = brackets.pop();
          if(!open) return fail(ln, 'SyntaxError', "unmatched '"+c+"'");
          if(open.ch!==PAIRS[c]) return fail(ln, 'SyntaxError', "closing parenthesis '"+c+"' does not match opening parenthesis '"+open.ch+"'"+(open.line!==ln ? ' on line '+open.line : ''));
        }
        stmt.code += c;
      }
      let piece = raw.slice(from, cut);
      if(!inString) piece = inside ? piece.trim() : piece.trimEnd();
      stmt.text += (stmt.text ? '\n' : '') + piece;
      if(triple || brackets.length) continue;
      if(/\\\s*$/.test(stmt.code)){
        cont = true;
        stmt.code = stmt.code.replace(/\\\s*$/, ' ');
        stmt.text = stmt.text.replace(/\\\s*$/, '');
        continue;
      }
      const code = stmt.code.trim();
      const kw = /^(?:async\s+)?(def|class|if|elif|else|for|while|with|try|except|finally)\b/.exec(code)
        || (/:$/.test(code) && /^(match|case)\b(?!\s*[=.,)\]])/.exec(code)); // soft keywords: only as block headers
      if(kw){
        const colon = topLevelColon(code);
        if(colon<0) return fail(stmt.line, 'SyntaxError', "expected ':'");
        stmt.header = kw[1];
        stmt.inline = !!code.slice(colon+1).trim();
        if(!stmt.inline) expectIndent = { line: stmt.line, what: BLOCK_NAMES[kw[1]] || "'"+kw[1]+"' statement" };
      }
      stmts.push(stmt);
      stmt = null;
    }
    if(triple) return fail(triple.line, 'SyntaxError', 'unterminated triple-quoted string literal (detected at line '+lines.length+')');
    if(brackets.length){ const b = brackets[brackets.length-1]; return fail(b.line, 'SyntaxError', "'"+b.ch+"' was never closed"); }
    if(expectIndent) return fail(lines.length, 'IndentationError', 'expected an indented block after '+expectIndent.what+' on line '+expectIndent.line);
    return { stmts };
  }

  const PY_EFFECTS = [
    [/\b(?:urlopen|urllib\.request\.\w+|requests\.(?:get|post|put|patch|delete|head|request)|httpx\.\w+|aiohttp\.\w+|socket\.\w+)\s*\(/, 'network call'],
    [/(?:^|[^\w.])open\s*\(|\.(?:read_text|write_text|read_bytes|write_bytes)\s*\(/, 'file access'],
    [/\b(?:subprocess\.\w+|os\.system|os\.popen)\s*\(/, 'process call'],
    [/\bsqlite3\.connect\s*\(/, 'database connection'],
    [/\btime\.sleep\s*\(/, 'sleep']
  ];

  // Simulated `python <file>`: compiles the file, runs module-level code, then calls run(input) and traces
  // the statements whose values can be known statically. Branches and loops are reported, not guessed.
  function simulateScript(path, source, inputs){
    const out = [];
    const L = (cls, text, line)=>{ out.push(line ? [cls, text, line] : [cls, text]); };
    const done = (code, summary)=>({ code, lines: out, summary: summary || '' });
    const traceback = (st, where, err)=>{
      L('err', 'Traceback (most recent call last):');
      L('err', '  File "'+path+'", line '+st.line+', in '+where, st.line);
      L('err', '    '+firstLine(st.text), st.line);
      L('err', err.type+(err.message ? ': '+err.message : ''), st.line);
      L('info', 'Click an error line to jump to it in the editor.');
      return done(1, err.type+' on line '+st.line);
    };
