  function runtimeOf(node) { return node && node.type === 'file' ? RUNTIMES[extOf(node.name)] || null : null; }
  const secs = function (ms) { return (ms / 1000).toFixed(1) + ' s'; };
  const MAX_RUN_LINES = 2000;
  let run = null;

  function mockOutput(node, rt) {
    const root = rootOf(node);
    const rel = pathOf(node).slice(1).join('/');
    if (/watch/i.test(node.name)) {
      const files = walkFiles(root).map(function (f) { return pathOf(f).slice(1).join('/'); });
      return { code: 0, lines: [['dim', 'Node.js v22.9.0 · cwd ' + root.name], ['info', 'Watching ' + files.length + ' files for changes…']],
        stream: function (i) {
          const time = new Date().toTimeString().slice(0, 8);
          return i % 17 === 16 ? ['info', '[' + time + '] warn  slow rebuild (' + (180 + i % 90) + ' ms)']
            : ['ok', '[' + time + '] rebuilt ' + files[i % files.length] + ' in ' + (8 + (i * 7) % 40) + ' ms'];
        } };
    }
    if (/seed/i.test(node.name)) return { code: 1, lines: [
      ['dim', 'Node.js v22.9.0 · cwd ' + root.name],
      ['', 'Connecting to local database…'],
      ['ok', '✓ users (12 rows)'],
      ['err', "Error: ENOENT: no such file or directory, open 'fixtures/projects.json'"],
      ['err', '    at async seed (' + rel + ':14:18)']
    ] };
    if (rt.cmd === 'python') return { code: 0, lines: [
      ['dim', 'Python 3.12.4 · cwd ' + root.name],
      ['info', 'INFO  Loading settings from pyproject.toml'],
      ['info', 'INFO  Registered routes: /files, /chat'],
      ['', 'Scanning workspace… ' + walkFiles(root).length + ' files'],
      ['ok', '✓ Done, no errors']
    ] };
    return { code: 0, lines: [
      ['dim', 'Node.js v22.9.0 · cwd ' + root.name],
      ['', 'Bundling ' + walkFiles(root).length + ' modules'],
      ['ok', '✓ components/Button.tsx'],
      ['ok', '✓ components/ChatInput.tsx'],
      ['ok', '✓ styles/tokens.css'],
      ['', 'Wrote dist/ (48.2 kB)']
    ] };
  }

  function startRun(node) {
    const rt = runtimeOf(node);
    if (!rt) return;
    stopRun(true);
    const out = mockOutput(node, rt);
    const current = { id: node.id, rt: rt, lines: [], pending: out.lines.slice(), stream: out.stream || null, tick: 0, code: out.code, status: 'running', started: Date.now(), ms: 0, timer: null, follow: true, scrollTop: 0 };
    run = current;
    showStatus('run', 'Running ' + node.name + ' with ' + rt.label + '…');
    current.timer = setInterval(function () {
      if (run !== current) { clearInterval(current.timer); return; }
      if (current.pending.length) { addRunLine(current, current.pending.shift()); return; }
      if (current.stream) { addRunLine(current, current.stream(current.tick++)); return; }
      clearInterval(current.timer); current.timer = null;
      current.status = current.code === 0 ? 'done' : 'failed';
      current.ms = Date.now() - current.started;
      addRunLine(current, ['dim', 'Process exited with code ' + current.code]);
      updateRunHead();
      if (current.code === 0) showStatus('ok', node.name + ' finished · exit 0 · ' + secs(current.ms));
      else showStatus('warn', node.name + ' failed · exit ' + current.code);
    }, out.stream ? 90 : 320);
    renderRun();
    const card = $('#runSlot .run-card');
    if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function stopRun(silent) {
    if (!run || !run.timer) return;
    clearInterval(run.timer); run.timer = null;
    run.status = 'stopped'; run.code = 130; run.ms = Date.now() - run.started;
    if (silent) { run.lines.push(['dim', '^C Stopped']); return; }
    addRunLine(run, ['dim', '^C Stopped']);
    updateRunHead();
    showStatus('warn', 'Stopped ' + (byId.get(run.id) || { name: 'script' }).name);
  }

  function lineEl(line) {
    const span = document.createElement('span');
    span.className = 'o-' + (line[0] || 'txt');
    span.textContent = line[1];
    return span;
  }

  // Appends without re-rendering, so output can grow without resetting scroll or thrashing the DOM.
  function addRunLine(current, line) {
    current.lines.push(line);
    if (current.lines.length > MAX_RUN_LINES) current.lines.splice(0, current.lines.length - MAX_RUN_LINES);
    if (current !== run) return;
    const out = $('#runSlot .run-output');
    if (!out) return;
    const caret = out.querySelector('.o-caret');
    out.insertBefore(lineEl(line), caret);
    while (out.childElementCount > MAX_RUN_LINES + (caret ? 1 : 0)) out.firstElementChild.remove();
    if (current.follow) out.scrollTop = out.scrollHeight;
    else $('#runSlot .run-jump').hidden = false;
  }

  function runHeadHTML(node) {
    const running = run.status === 'running';
    const icon = running ? '<span class="spinner" aria-hidden="true"></span>' : ic(run.status === 'done' ? 'check' : 'alert-circle', 15);
    const meta = running ? 'running' : run.status === 'stopped' ? 'stopped · ' + secs(run.ms) : 'exit ' + run.code + ' · ' + secs(run.ms);
    return '<div class="run-title">' + icon + '<code><span class="run-cmd">' + run.rt.cmd + '</span> ' + esc(pathOf(node).slice(1).join('/')) + '</code></div>' +
      '<div class="run-actions"><span class="run-badge">' + meta + '</span>' +
        (running
          ? '<button class="btn btn-secondary btn-sm" type="button" data-stop-run>' + ic('square', 12) + 'Stop</button>'
          : '<button class="btn btn-secondary btn-sm" type="button" data-run-file="' + node.id + '">' + ic('play', 12) + 'Run again</button>') +
        '<button class="icon-btn" type="button" data-close-run aria-label="Close output" title="Close output">' + ic('x', 15) + '</button>' +
      '</div>';
  }

  function updateRunHead() {
    const card = $('#runSlot .run-card');
    const node = run && byId.get(run.id);
    if (!card || !node) return;
    card.className = 'run-card is-' + run.status;
    $('.run-head', card).innerHTML = runHeadHTML(node);
    if (run.status !== 'running') { const caret = $('.o-caret', card); if (caret) caret.remove(); }
  }

  function renderRun() {
    const slot = $('#runSlot');
    if (!slot) return;
    const node = run && byId.get(run.id);
    if (!node) { if (run) { stopRun(true); run = null; } slot.innerHTML = ''; return; }
    slot.innerHTML = '<section class="run-card is-' + run.status + '" aria-label="Run output for ' + esc(node.name) + '">' +
      '<header class="run-head">' + runHeadHTML(node) + '</header>' +
      '<div class="run-body"><pre class="run-output" role="log" aria-live="off" tabindex="0" aria-label="Output"></pre>' +
      '<button class="run-jump" type="button" data-run-jump hidden>' + ic('arrow-down', 12) + 'Latest output</button></div></section>';
    const out = $('.run-output', slot);
    const frag = document.createDocumentFragment();
    run.lines.forEach(function (l) { frag.appendChild(lineEl(l)); });
    if (run.status === 'running') { const caret = document.createElement('span'); caret.className = 'o-caret'; caret.setAttribute('aria-hidden', 'true'); caret.textContent = '▍'; frag.appendChild(caret); }
    out.appendChild(frag);
    out.scrollTop = run.follow ? out.scrollHeight : run.scrollTop;
    const current = run;
    out.addEventListener('scroll', function () {
      current.follow = out.scrollHeight - out.scrollTop - out.clientHeight < 8;
      current.scrollTop = out.scrollTop;
      if (current.follow) $('.run-jump', slot).hidden = true;
    });
  }

  function renderCtx() {
    const node = byId.get(state.ctx);
    $('#ctxRow').innerHTML = node ? '<span class="ctx-chip" title="' + esc(pathOf(node).join('/')) + '">' + ic('paperclip', 12) + fileIcon(node, 13) +
      '<span class="name">' + esc(node.name) + '</span><button type="button" data-drop-ctx aria-label="Remove ' + esc(node.name) + ' from context">' + ic('x', 12) + '</button></span>' : '';
  }

  function renderAll() { renderFolders(); renderHead(); renderPreview(); renderCtx(); }

  /* ------------------------------------------------------------------------
     Actions
     ------------------------------------------------------------------------ */
  let statusTimer = null;
  function showStatus(kind, message) {
    const el = $('#actionStatus');
    el.className = 'action-status is-' + kind;
    el.innerHTML = (kind === 'run' ? '<span class="spinner" aria-hidden="true"></span>' : ic(kind === 'ok' ? 'check' : 'alert-circle', 15)) + '<span class="status-text"></span>';
    $('.status-text', el).textContent = message;
    el.hidden = false;
    clearTimeout(statusTimer);
    if (kind !== 'run') statusTimer = setTimeout(function () { el.hidden = true; }, 4500);
  }
  function toast(message, tone) { showStatus(tone === 'warn' ? 'warn' : 'ok', message); }

  function openFile(id) {
    const node = byId.get(id);
    if (!node || node.type !== 'file') return;
    for (let n = node.parent; n; n = n.parent) n.open = true;
    state.current = id; state.ctx = id;
    setDrawer(false);
    renderAll();
  }

  function addRoot(node) {
    if (roots.some(function (r) { return r.name.toLowerCase() === node.name.toLowerCase(); })) { toast('“' + node.name + '” is already in the panel', 'warn'); return false; }
    link(node, null);
    node.open = true; node.fresh = true;
    roots.push(node);
    return true;
  }
  function removeRoot(id) {
    const root = byId.get(id);
    const index = roots.indexOf(root);
    if (index < 0) return;
    roots.splice(index, 1);
    (function drop(n) { byId.delete(n.id); (n.children || []).forEach(drop); }(root));
    if (!byId.has(state.current)) state.current = null;
    if (!byId.has(state.ctx)) state.ctx = null;
    renderAll();
    toast('Removed “' + root.name + '” from the panel', 'warn');
  }

  const SAMPLES = [
    function () { return D('shared-ui', [D('src', [F('Tabs.tsx'), F('Tree.tsx', 'U')]), F('README.md')]); },
    function () { return D('docs-site', [D('pages', [F('index.md'), F('commands.md', 'M')]), F('config.json')]); },
    function () { return D('analytics', [F('usage.py'), F('pyproject.toml')]); }
  ];
  let sampleIndex = 0;
  function addSample() {
    const node = SAMPLES[sampleIndex++ % SAMPLES.length]();
    if (!addRoot(node)) return null;
    renderAll(); toast('Added “' + node.name + '”');
    return node;
  }
  function pickFolder() {
    const picker = $('#dirPicker');
    if ('webkitdirectory' in picker) { picker.value = ''; picker.click(); } else addSample();
  }

  function newFile() {
    const current = byId.get(state.current);
    const folder = current ? current.parent : roots[0];
    if (!folder) { toast('Add a folder first', 'warn'); return null; }
    let name = 'untitled.md', i = 1;
    while (folder.children.some(function (c) { return c.name === name; })) name = 'untitled-' + (++i) + '.md';
    const node = link(F(name, 'U'), folder);
    folder.children.push(node);
    openFile(node.id);
    return node;
  }

  /* Theme & panel */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
    $('#themeIcon').innerHTML = ic(theme === 'dark' ? 'sun' : 'moon');
    try { localStorage.setItem('amber_theme', theme); } catch (error) {}
    const doc = flowDoc();
    if (doc && doc.documentElement.getAttribute('data-theme') !== theme) { const btn = doc.getElementById('btnThemeToggle'); if (btn) btn.click(); }
  }
  function toggleTheme() { applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }

  const app = $('#app');
  const desktop = matchMedia('(min-width: 901px)');
  function setDrawer(open) {
    if (desktop.matches) open = false;
    app.classList.toggle('is-drawer-open', open);
    $('#scrim').hidden = !open;
    $('#menuBtn').setAttribute('aria-expanded', String(open));
  }
  function setCollapsed(collapsed) {
    if (!desktop.matches) { setDrawer(false); return; }
    app.classList.toggle('is-collapsed', collapsed);
    const btn = $('#collapseBtn');
    btn.setAttribute('aria-expanded', String(!collapsed));
    btn.setAttribute('aria-label', collapsed ? 'Expand side panel' : 'Collapse side panel');
  }

  /* ------------------------------------------------------------------------
     AI actions (mocked) + slash commands
     ------------------------------------------------------------------------ */
  function findFile(query) {
    const q = query.toLowerCase();
    const files = allFiles();
    return files.find(function (f) { return f.name.toLowerCase() === q; }) || files.find(function (f) { return f.name.toLowerCase().includes(q); });
  }
  function findScript(query) {
    const q = query.toLowerCase();
    const scripts = allFiles().filter(isRunnable);
    return scripts.find(function (f) { return f.name.toLowerCase() === q; }) ||
      scripts.find(function (f) { return f.name.toLowerCase().includes(q); }) || findFile(query);
  }
  function findRoot(query) {
    const q = (query || '').toLowerCase();
    return q ? roots.find(function (r) { return r.name.toLowerCase().includes(q); }) : null;
  }

  const COMMANDS = [
    { name: 'add-folder', group: 'Folders', icon: 'folder-plus', desc: 'Pick a folder from your computer', run: function () { pickFolder(); return 'Choose a folder to add.'; } },
    { name: 'add-sample', group: 'Folders', icon: 'layers', desc: 'Add a sample folder (design mock)', run: function () { const n = addSample(); return n ? 'Added sample folder “' + n.name + '”' : null; } },
    { name: 'remove', args: '<folder>', group: 'Folders', icon: 'x', desc: 'Remove a folder from the panel', suggest: 'folders', run: function (arg) {
      const root = findRoot(arg);
      if (!root) return { warn: arg ? 'No folder matches “' + arg + '”' : 'Say which folder, e.g. /remove amber-api' };
      removeRoot(root.id); return 'Removed “' + root.name + '” from the panel';
    } },
    { name: 'collapse', group: 'Folders', icon: 'chevrons-down-up', desc: 'Collapse every folder section', run: function () { roots.forEach(function (r) { r.open = false; }); renderFolders(); return 'Collapsed all folders'; } },
    { name: 'expand', group: 'Folders', icon: 'folder-open', desc: 'Expand every folder section', run: function () { roots.forEach(function (r) { r.open = true; }); renderFolders(); return 'Expanded all folders'; } },
    { name: 'find', args: '<text>', group: 'Folders', icon: 'search', desc: 'Filter files in every folder', run: function (arg) {
      state.filter = (arg || '').toLowerCase(); $('#filter').value = arg || ''; renderFolders();
      if (!desktop.matches && arg) setDrawer(true);
      const count = allFiles().filter(function (f) { return f.name.toLowerCase().includes(state.filter); }).length;
      return arg ? count + (count === 1 ? ' file matches “' : ' files match “') + arg + '”' : 'Filter cleared';
    } },
    { name: 'open', args: '<file>', group: 'Files', icon: 'file', desc: 'Open a file in the preview', suggest: 'files', run: function (arg) {
      const f = arg && findFile(arg);
      if (!f) return { warn: 'No file matches “' + (arg || '…') + '”' };
      openFile(f.id); return 'Opened ' + pathOf(f).join('/');
    } },
    { name: 'new-file', group: 'Files', icon: 'file-plus', desc: 'Create a file next to the open one', run: function () { const n = newFile(); return n ? 'Created ' + pathOf(n).join('/') : { warn: 'Add a folder first' }; } },
    { name: 'new-flow', group: 'Files', icon: 'workflow', desc: 'Create an empty flow', run: function () { const n = newFlow(); return n ? 'Created ' + pathOf(n).join('/') : { warn: 'Add a folder first' }; } },
    { name: 'rename', args: '<new name>', group: 'Files', icon: 'pencil', desc: 'Rename the open file', run: function (arg) {
      const n = byId.get(state.current);
      const name = (arg || '').replace(/[\\/]/g, '').trim();
      if (!n) return { warn: 'Open a file first' };
      if (!name) return { warn: 'Give a new name, e.g. /rename notes.md' };
      const oldKey = extOf(n.name) === 'flow' ? flowKey(n) : null;
      const old = n.name; n.name = name; n.git = n.git || 'M';
      if (oldKey && localStorage.getItem(oldKey)) { localStorage.setItem(flowKey(n), localStorage.getItem(oldKey)); localStorage.removeItem(oldKey); }
      renderAll();
      return 'Renamed ' + old + ' → ' + name;
    } },
    { name: 'run', args: '<file>', group: 'Files', icon: 'play', desc: 'Run a script or a flow', suggest: 'scripts', run: function (arg) {
      const n = arg ? findScript(arg) : byId.get(state.current);
      if (!n) return { warn: arg ? 'No script matches “' + arg + '”' : 'Say which script, e.g. /run main.py' };
      if (extOf(n.name) === 'flow') {
        if (state.current === n.id && flowOpen()) sendToFlow('/run'); else { pendingFlowCmd = '/run'; openFile(n.id); }
        return null;
      }
      if (!runtimeOf(n)) return { warn: 'Only Python, Node.js and .flow files can run' };
      openFile(n.id); startRun(n);
      return null;
    } },
    { name: 'close', group: 'Files', icon: 'x', desc: 'Close the preview', run: function () { state.current = null; renderAll(); return 'Closed the preview'; } },
    { name: 'theme', group: 'App', icon: 'moon', desc: 'Switch between light and dark', run: function () { toggleTheme(); return 'Switched to ' + document.documentElement.getAttribute('data-theme') + ' theme'; } },
    { name: 'help', group: 'App', icon: 'help-circle', desc: 'Show every command', run: function () { setPrompt('/'); return null; } }
  ];

  // Shown while a .flow is open; forwarded to Flow Machine ("to" = its own command name).
  const FLOW_COMMANDS = [
    { name: 'add', args: '<node type>', icon: 'plus', desc: 'Add a node to this flow', suggest: 'types' },
    { name: 'connect', args: '<from> to <to>', icon: 'link', desc: 'Connect two nodes' },
    { name: 'select', args: '<node>', icon: 'target', desc: 'Select and center a node', suggest: 'nodes' },
    { name: 'rename-node', to: 'rename', args: '<new name>', icon: 'pencil', desc: 'Rename the selected node' },
    { name: 'delete', args: '[node]', icon: 'trash-2', desc: 'Delete a node (or the selected one)', suggest: 'nodes' },
    { name: 'run-flow', to: 'run', icon: 'play', desc: 'Run this flow' },
    { name: 'sample', icon: 'layers', desc: 'Load the sample flow' },
    { name: 'clear', icon: 'trash-2', desc: 'Clear the canvas' },
    { name: 'name', args: '<flow name>', icon: 'pencil', desc: 'Rename the flow' },
    { name: 'save', icon: 'save', desc: 'Save this flow', local: function () { saveFlow(); return 'Saved ' + byId.get(flowNodeId).name; } },
    { name: 'export', icon: 'download', desc: 'Download the flow as YAML' },
    { name: 'fit', icon: 'maximize', desc: 'Fit the flow to the screen' },
    { name: 'zoom', args: '<percent>', icon: 'target', desc: 'Set the zoom level' }
  ].map(function (c) { c.group = 'Flow'; return c; });
  function menuCommands() { return flowOpen() ? COMMANDS.concat(FLOW_COMMANDS) : COMMANDS; }

  function execute(text) {
    const m = /^\/([\w-]+)\s*([\s\S]*)$/.exec(text.trim());
    const cmd = m && COMMANDS.find(function (c) { return c.name === m[1].toLowerCase(); });
    const flowCmd = m && !cmd && FLOW_COMMANDS.find(function (c) { return c.name === m[1].toLowerCase(); });
    if (flowCmd) {
      if (!flowOpen()) { showStatus('warn', 'Open a .flow file first'); return; }
      if (flowCmd.local) { showStatus('ok', flowCmd.local()); return; }
      sendToFlow(('/' + (flowCmd.to || flowCmd.name) + ' ' + m[2]).trim());
      return;
    }
    if (!cmd) { showStatus('warn', 'Unknown command. Type / to see every command.'); return; }
    const result = cmd.run(m[2].trim());
    if (typeof result === 'string') showStatus('ok', result);
    else if (result && result.warn) showStatus('warn', result.warn);
  }

  // Mock of the AI turning plain language into one of the commands above.
  const STOP = new Set(['the', 'please', 'open', 'show', 'file', 'files', 'folder', 'can', 'you', 'and', 'for', 'this', 'that', 'with']);
  function interpret(text) {
    let m;
    if ((m = /\b(?:run|execute)\b\s+(?:the\s+)?(?:script\s+)?([\w.-]+)/i.exec(text)) && !/^(it|this|that|script)$/i.test(m[1])) return '/run ' + m[1];
    if (/\b(run|execute)\b/i.test(text)) return '/run';
    if (/\b(dark|light|theme)\b/i.test(text)) return '/theme';
    if (/\bcollapse\b|\bclose all\b/i.test(text)) return '/collapse';
    if (/\bexpand\b|\bopen all\b/i.test(text)) return '/expand';
    if (/\b(add|import)\b.*\bfolder\b/i.test(text)) return '/add-folder';
    if (/\b(new|create)\b.*\bflow\b/i.test(text)) return '/new-flow';
    if (/\b(new|create)\b.*\bfile\b/i.test(text)) return '/new-file';
    if (/\bclose\b/i.test(text)) return '/close';
    if ((m = /\brename\b.*?\bto\s+(\S+)/i.exec(text))) return '/rename ' + m[1];
    if ((m = /\bremove\s+(?:the\s+)?(?:folder\s+)?([\w.-]+)/i.exec(text))) return '/remove ' + m[1];
    if ((m = /\b(?:find|search|filter)\s+(?:for\s+)?(.+)$/i.exec(text))) return '/find ' + m[1].trim();
    const words = text.toLowerCase().split(/[^\w.-]+/).filter(function (w) { return w.length > 2 && !STOP.has(w); });
    for (const word of words) { const f = findFile(word); if (f) return '/open ' + f.name; }
    return null;
  }
  // While a flow is open only workspace-level phrases stay here; the rest goes to Flow Machine.
  function interpretStudio(text) {
    let m;
    if (/\b(dark|light|theme)\b/i.test(text)) return '/theme';
    if (/\b(add|import)\b.*\bfolder\b/i.test(text)) return '/add-folder';
    if (/\b(new|create)\b.*\bflow\b/i.test(text)) return '/new-flow';
    if (/\bclose\b.*\b(flow|file|preview)\b/i.test(text)) return '/close';
    if ((m = /\bopen\s+(?:the\s+)?([\w.-]+)/i.exec(text)) && findFile(m[1])) return '/open ' + m[1];
    return null;
  }
  function runIntent(text) {
    if (flowOpen()) {
      const action = interpretStudio(text);
      if (action) execute(action); else sendToFlow(text);
      return;
    }
    showStatus('run', 'Working on “' + (text.length > 48 ? text.slice(0, 48) + '…' : text) + '”');
    setTimeout(function () {
      const action = interpret(text);
      if (action) execute(action);
      else showStatus('warn', 'I couldn’t turn that into an action. Try “open the readme” or type /.');
    }, 650);
  }

  /* Slash menu */
  const prompt = $('#prompt');
  const menu = { el: $('#slashMenu'), items: [], active: 0 };

  function parseSlash(value) {
    const m = /^\/([\w-]*)(\s+([\s\S]*))?$/.exec(value);
    return m ? { name: m[1].toLowerCase(), spaced: !!m[2], arg: (m[3] || '').trim().toLowerCase() } : null;
  }

  function updateMenu() {
    const p = parseSlash(prompt.value);
    if (!p) { closeMenu(); return; }
    let items = [];
    if (!p.spaced) {
      items = menuCommands().filter(function (c) { return c.name.includes(p.name); })
        .sort(function (a, b) { return (b.name.startsWith(p.name) ? 1 : 0) - (a.name.startsWith(p.name) ? 1 : 0); })
        .map(function (c) { return { kind: 'cmd', cmd: c }; });
    } else {
      const cmd = menuCommands().find(function (c) { return c.name === p.name; });
      if (!cmd || !cmd.suggest) { closeMenu(); return; }
      items = argItems(cmd, p.arg);
    }
    menu.items = items;
    menu.active = 0;
    renderMenu(p);
  }

  function argItems(cmd, q) {
    if (cmd.suggest === 'types') return FLOW_NODE_TYPES.filter(function (t) { return (t[0] + ' ' + t[1]).toLowerCase().includes(q); })
      .map(function (t) { return { kind: 'arg', cmd: cmd, value: t[0], label: t[1], desc: 'Node type', icon: ic('plus', 15) }; });
    if (cmd.suggest === 'nodes') return flowNodeNames().filter(function (n) { return n.toLowerCase().includes(q); }).slice(0, 8)
      .map(function (n) { return { kind: 'arg', cmd: cmd, value: n, label: n, desc: 'Node in this flow', icon: ic('workflow', 15) }; });
    const pool = cmd.suggest === 'files' ? allFiles() : cmd.suggest === 'scripts' ? allFiles().filter(isRunnable) : roots;
    return pool.filter(function (n) { return n.name.toLowerCase().includes(q); }).slice(0, 8).map(function (n) {
      const rt = runtimeOf(n);
      return { kind: 'arg', cmd: cmd, value: n.name, label: n.name,
        desc: n.type === 'file' ? (cmd.suggest === 'scripts' ? (rt ? rt.label : 'Flow') + ' · ' : '') + pathOf(n).slice(0, -1).join(' / ') : walkFiles(n).length + ' files',
        icon: n.type === 'file' ? fileIcon(n) : ic('folder', 15) };
    });
  }

  function renderMenu(p) {
    const el = menu.el;
    el.hidden = false;
    prompt.setAttribute('aria-expanded', 'true');
    if (!menu.items.length) {
      el.innerHTML = '<div class="slash-empty">No matching commands. Try <span class="kbd">/help</span>.</div>';
      prompt.removeAttribute('aria-activedescendant');
      return;
    }
    let group = null, html = '';
    menu.items.forEach(function (item, i) {
      const g = item.kind === 'cmd' ? item.cmd.group : ({ files: 'Files', scripts: 'Scripts', types: 'Node types', nodes: 'Nodes' }[item.cmd.suggest] || 'Folders');
      if (g !== group) { group = g; html += '<div class="slash-group" role="presentation">' + g + '</div>'; }
      let label, desc, icon;
      if (item.kind === 'cmd') {
        const name = item.cmd.name, at = p.name ? name.indexOf(p.name) : -1;
        label = '/' + (at >= 0 ? esc(name.slice(0, at)) + '<mark>' + esc(name.slice(at, at + p.name.length)) + '</mark>' + esc(name.slice(at + p.name.length)) : esc(name)) +
          (item.cmd.args ? ' <em>' + esc(item.cmd.args) + '</em>' : '');
        desc = esc(item.cmd.desc);
        icon = ic(item.cmd.icon, 15);
      } else {
        label = '<em>/' + esc(item.cmd.name) + '</em> ' + esc(item.label);
        desc = esc(item.desc);
        icon = item.icon;
      }
      html += '<div class="slash-item" role="option" id="slash-' + i + '" data-index="' + i + '" aria-selected="false">' +
        '<span class="slash-icon">' + icon + '</span><span class="slash-text"><span class="slash-cmd">' + label + '</span><span class="slash-desc">' + desc + '</span></span></div>';
    });
    html += '<div class="slash-foot" aria-hidden="true"><span><span class="kbd">↑</span> <span class="kbd">↓</span> choose</span><span><span class="kbd">Enter</span> run · <span class="kbd">Esc</span> close</span></div>';
    el.innerHTML = html;
    setActive(0);
  }

  function setActive(i) {
    if (!menu.items.length) return;
    menu.active = (i + menu.items.length) % menu.items.length;
    $$('.slash-item', menu.el).forEach(function (el) {
      const on = Number(el.dataset.index) === menu.active;
      el.classList.toggle('is-active', on); el.setAttribute('aria-selected', String(on));
      if (on) { prompt.setAttribute('aria-activedescendant', el.id); el.scrollIntoView({ block: 'nearest' }); }
    });
  }

  function closeMenu() {
    menu.el.hidden = true; menu.items = [];
    prompt.setAttribute('aria-expanded', 'false');
    prompt.removeAttribute('aria-activedescendant');
  }

  function pick(i) {
    const item = menu.items[i];
    if (!item) return false;
    if (item.kind === 'cmd' && (item.cmd.suggest || item.cmd.args)) {
      setPrompt('/' + item.cmd.name + ' ');
      return true;
    }
    const text = item.kind === 'cmd' ? '/' + item.cmd.name : '/' + item.cmd.name + ' ' + item.value;
    setPrompt('');
    closeMenu();
    execute(text);
    return true;
  }

  function setPrompt(value) {
    prompt.value = value;
    autosize(); updateSend(); updateMenu();
    prompt.focus();
    prompt.setSelectionRange(value.length, value.length);
  }
  function autosize() { prompt.style.height = 'auto'; prompt.style.height = Math.min(prompt.scrollHeight, 160) + 'px'; }
  function updateSend() { $('#sendBtn').disabled = !prompt.value.trim(); }

  function submit() {
    const text = prompt.value.trim();
    if (!text) return;
    setPrompt('');
    closeMenu();
    if (text.charAt(0) === '/') execute(text);
    else runIntent(text);
  }

  prompt.addEventListener('input', function () { autosize(); updateSend(); updateMenu(); });
  prompt.addEventListener('keydown', function (event) {
    const open = !menu.el.hidden && menu.items.length;
    if (open && event.key === 'ArrowDown') { event.preventDefault(); setActive(menu.active + 1); }
    else if (open && event.key === 'ArrowUp') { event.preventDefault(); setActive(menu.active - 1); }
    else if (open && (event.key === 'Tab' || (event.key === 'Enter' && !event.shiftKey))) { event.preventDefault(); pick(menu.active); }
    else if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); submit(); }
    else if (event.key === 'Escape' && !menu.el.hidden) { event.preventDefault(); closeMenu(); }
  });
  menu.el.addEventListener('mousedown', function (event) { event.preventDefault(); });
  menu.el.addEventListener('click', function (event) {
    const item = event.target.closest('.slash-item');
    if (item) pick(Number(item.dataset.index));
  });
  menu.el.addEventListener('mousemove', function (event) {
    const item = event.target.closest('.slash-item');
    if (item && Number(item.dataset.index) !== menu.active) setActive(Number(item.dataset.index));
  });
  $('#composer').addEventListener('submit', function (event) { event.preventDefault(); submit(); });
  document.addEventListener('pointerdown', function (event) { if (!event.target.closest('#composer')) closeMenu(); });

  /* ------------------------------------------------------------------------
     Events
     ------------------------------------------------------------------------ */
  $('#folders').addEventListener('click', function (event) {
    const toggle = event.target.closest('[data-toggle]');
    if (toggle) { const root = byId.get(toggle.dataset.toggle); root.open = !root.open; renderFolders(); $('[data-toggle="' + root.id + '"]').focus(); return; }
    const remove = event.target.closest('[data-remove]');
    if (remove) { removeRoot(remove.dataset.remove); return; }
    const dir = event.target.closest('[data-dir]');
    if (dir) { const n = byId.get(dir.dataset.dir); n.open = !n.open; renderFolders(); $('[data-dir="' + n.id + '"]').focus(); return; }
    const file = event.target.closest('[data-file]');
    if (file) { openFile(file.dataset.file); const again = $('[data-file="' + file.dataset.file + '"]'); if (again) again.focus(); }
  });
  $('#rail').addEventListener('click', function (event) {
    const btn = event.target.closest('[data-rail]');
    if (!btn) return;
    const root = byId.get(btn.dataset.rail);
    root.open = true; setCollapsed(false); renderFolders();
    const section = $('[data-folder="' + root.id + '"]');
    if (section) { section.scrollIntoView({ block: 'nearest' }); $('.folder-toggle', section).focus(); }
  });

  document.addEventListener('click', function (event) {
    const t = event.target;
    if (t.closest('[data-action="add-folder"]')) { pickFolder(); return; }
    const slash = t.closest('[data-slash]');
    if (slash) { setDrawer(false); setPrompt(slash.dataset.slash); return; }
    const fill = t.closest('[data-fill]');
    if (fill) { setPrompt(fill.dataset.fill); return; }
    const runBtn = t.closest('[data-run]');
    if (runBtn) { execute(runBtn.dataset.run); return; }
    if (t.closest('[data-close-file]')) { state.current = null; renderAll(); return; }
    const runFile = t.closest('[data-run-file]');
    if (runFile) { startRun(byId.get(runFile.dataset.runFile)); return; }
    if (t.closest('[data-stop-run]')) { stopRun(false); return; }
    if (t.closest('[data-close-run]')) { stopRun(true); run = null; renderRun(); return; }
    const jump = t.closest('[data-run-jump]');
    if (jump && run) { const out = $('#runSlot .run-output'); run.follow = true; out.scrollTop = out.scrollHeight; jump.hidden = true; return; }
    if (t.closest('[data-drop-ctx]')) { state.ctx = null; renderCtx(); prompt.focus(); }
  });

  $('#filter').addEventListener('input', function (event) { state.filter = event.target.value.trim().toLowerCase(); renderFolders(); });
  $('#themeBtn').addEventListener('click', toggleTheme);
  $('#collapseBtn').addEventListener('click', function () {
    if (desktop.matches) setCollapsed(!app.classList.contains('is-collapsed')); else setDrawer(false);
  });
  $('#menuBtn').addEventListener('click', function () { setDrawer(true); const first = $('.folder-toggle'); if (first) first.focus(); });
  $('#scrim').addEventListener('click', function () { setDrawer(false); });
  function syncCollapseBtn() {
    const btn = $('#collapseBtn');
    app.classList.remove('is-collapsed');
    btn.setAttribute('aria-expanded', 'true');
    btn.setAttribute('aria-label', desktop.matches ? 'Collapse side panel' : 'Close folders');
  }
  desktop.addEventListener('change', function () { setDrawer(false); syncCollapseBtn(); });
  syncCollapseBtn();

  document.addEventListener('keydown', function (event) {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((event.key === '/' && !typing) || ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k')) {
      event.preventDefault(); setDrawer(false); setPrompt('/');
    } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'b') {
      event.preventDefault(); if (desktop.matches) setCollapsed(!app.classList.contains('is-collapsed')); else setDrawer(!app.classList.contains('is-drawer-open'));
    } else if (event.key === 'Escape' && app.classList.contains('is-drawer-open')) {
      setDrawer(false); $('#menuBtn').focus();
    }
  });

  /* ------------------------------------------------------------------------
     Drag & drop folders from the OS
     ------------------------------------------------------------------------ */
  const overlay = $('#dropOverlay');
  let dragDepth = 0;
  const hasFiles = function (event) { return event.dataTransfer && Array.from(event.dataTransfer.types || []).indexOf('Files') >= 0; };
  const showDrop = function (on) { overlay.classList.toggle('open', on); $('#dropzone').classList.toggle('is-over', on); };

  window.addEventListener('dragenter', function (event) { if (!hasFiles(event)) return; event.preventDefault(); dragDepth++; showDrop(true); });
  window.addEventListener('dragover', function (event) { if (!hasFiles(event)) return; event.preventDefault(); event.dataTransfer.dropEffect = 'copy'; });
  window.addEventListener('dragleave', function (event) { if (!hasFiles(event)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) showDrop(false); });
  window.addEventListener('drop', function (event) { if (!hasFiles(event)) return; event.preventDefault(); dragDepth = 0; showDrop(false); handleDrop(event.dataTransfer); });

  const SKIP = /^(node_modules|\.git|dist|build|\.venv|__pycache__)$/;
  function readEntries(dir) {
    return new Promise(function (resolve) {
      const reader = dir.createReader(), all = [];
      const next = function () {
        reader.readEntries(function (batch) {
          if (!batch.length || all.length >= 300) { resolve(all); return; }
          all.push.apply(all, batch); next();
        }, function () { resolve(all); });
      };
      next();
    });
  }
  async function toNode(entry, depth) {
    if (entry.isFile) return F(entry.name);
    const node = D(entry.name, []);
    if (depth >= 4 || SKIP.test(entry.name)) return node;
    for (const child of (await readEntries(entry)).slice(0, 300)) node.children.push(await toNode(child, depth + 1));
    return node;
  }
  async function handleDrop(dataTransfer) {
    const entries = Array.from(dataTransfer.items || []).map(function (i) { return i.webkitGetAsEntry ? i.webkitGetAsEntry() : null; }).filter(Boolean);
    if (!entries.length) { addSample(); return; }
    const added = [];
    let lastFile = null;
    for (const entry of entries) {
      if (entry.isDirectory) { const node = await toNode(entry, 0); if (addRoot(node)) added.push(node.name); }
      else lastFile = link(F(entry.name, 'U'), null);
    }
    if (lastFile) { state.current = lastFile.id; state.ctx = lastFile.id; }
    renderAll();
    if (added.length) toast(added.length === 1 ? 'Added “' + added[0] + '”' : 'Added ' + added.length + ' folders');
  }

  $('#dirPicker').addEventListener('change', function (event) {
    const tops = new Map();
    Array.from(event.target.files || []).slice(0, 3000).forEach(function (file) {
      const parts = (file.webkitRelativePath || file.name).split('/');
      if (parts.some(function (p) { return SKIP.test(p); })) return;
      let dir = tops.get(parts[0]);
      if (!dir) { dir = D(parts[0], []); tops.set(parts[0], dir); }
      for (let i = 1; i < parts.length - 1; i++) {
        let next = dir.children.find(function (c) { return c.type === 'dir' && c.name === parts[i]; });
        if (!next) { next = D(parts[i], []); dir.children.push(next); }
        dir = next;
      }
      if (parts.length > 1) dir.children.push(F(parts[parts.length - 1]));
    });
    const added = [];
    tops.forEach(function (node) { if (addRoot(node)) added.push(node.name); });
    renderAll();
    if (added.length) toast('Added “' + added.join('”, “') + '”');
  });

  /* ------------------------------------------------------------------------
     Boot
     ------------------------------------------------------------------------ */
  $$('[data-i]').forEach(function (el) { el.insertAdjacentHTML('afterbegin', ic(el.dataset.i, Number(el.dataset.s) || 16)); el.removeAttribute('data-i'); });
  applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
  window.addEventListener('beforeunload', saveFlow);
  openFile(findFile('summarize.flow').id);
}());
</script>
</body>
</html>
