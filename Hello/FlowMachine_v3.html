<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amber Studio</title>
<script>
// Apply the saved theme before first paint to avoid a light-theme flash.
(function () {
  try {
    var saved = localStorage.getItem('amber_theme');
    var theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
  } catch (error) {}
}());
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   1. AMBER DESIGN TOKENS (from design.html)
   ========================================================================== */
:root {
  --bg: #F9F8F6;
  --surface: #FFFFFF;
  --surface-alt: #F3EFE9;
  --surface-hover: #ECE7DE;
  --surface-active: #E4DDD1;
  --surface-glass: rgba(255, 255, 255, 0.88);
  --border: #E5DFD5;
  --border-strong: #CEC5B7;
  --border-focus: #D4622B;

  --text: #191817;
  --text-muted: #68625B;
  --text-faint: #989187;

  --accent: #D4622B;
  --accent-hover: #BF5321;
  --accent-tint: rgba(212, 98, 43, 0.09);
  --accent-tint-hover: rgba(212, 98, 43, 0.16);
  --accent-glow: rgba(212, 98, 43, 0.26);
  --accent-contrast: #FFFFFF;

  --success: #1E8E3E;  --warning: #B77900;  --danger: #D93025;  --info: #2563EB;

  --r-xs: 6px;  --r-sm: 8px;  --r-md: 12px;  --r-lg: 16px;  --r-xl: 24px;  --r-pill: 9999px;

  --shadow-xs: 0 1px 2px rgba(25, 24, 23, 0.04);
  --shadow-sm: 0 1px 3px rgba(25, 24, 23, 0.06);
  --shadow-md: 0 4px 14px rgba(25, 24, 23, 0.07), 0 16px 28px rgba(25, 24, 23, 0.04);
  --shadow-lg: 0 12px 36px rgba(25, 24, 23, 0.10), 0 28px 64px rgba(25, 24, 23, 0.06);
  --shadow-xl: 0 20px 48px rgba(25, 24, 23, 0.14);

  --font-serif: "Playfair Display", Georgia, serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", monospace;

  --z-dropdown: 1000;  --z-sticky: 1020;  --z-modal: 1050;  --z-toast: 1080;
  --dur-fast: 140ms;  --dur-med: 260ms;  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --tap-target: 44px;

  --ft-purple: #7C3AED;
}

[data-theme="dark"] {
  --bg: #121211;
  --surface: #1B1A19;
  --surface-alt: #242220;
  --surface-hover: #2C2926;
  --surface-active: #35322E;
  --surface-glass: rgba(27, 26, 25, 0.88);
  --border: rgba(255, 255, 255, 0.10);
  --border-strong: rgba(255, 255, 255, 0.18);
  --border-focus: #F08E5A;

  --text: #F5F3EF;
  --text-muted: #A59D92;
  --text-faint: #736C63;

  --accent: #F08E5A;
  --accent-hover: #F3A072;
  --accent-tint: rgba(240, 142, 90, 0.15);
  --accent-tint-hover: rgba(240, 142, 90, 0.24);
  --accent-glow: rgba(240, 142, 90, 0.32);
  --accent-contrast: #18110D;

  --success: #53C378;  --warning: #F2B957;  --danger: #F16E63;  --info: #6BA5FA;

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 16px 44px rgba(0, 0, 0, 0.7);
  --shadow-xl: 0 20px 48px rgba(0, 0, 0, 0.6);

  --ft-purple: #A78BFA;
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background-color var(--dur-med) var(--ease-out), color var(--dur-med) var(--ease-out);
}
button { font: inherit; color: inherit; }
/* Scrolling still works (wheel, touch, keyboard); only the bars are hidden. */
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-glow); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
@media (forced-colors: active) { :focus-visible { outline: 2px solid Highlight; outline-offset: 2px; box-shadow: none; } }
.sr-only { position: absolute !important; width: 1px !important; height: 1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }

.li { display: inline-flex; align-items: center; justify-content: center; line-height: 0; flex-shrink: 0; }
.li svg { stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.kbd { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: max(34px, var(--tap-target));
  padding: 7px 14px;
  border: 1px solid transparent; border-radius: var(--r-pill);
  font-size: 12.5px; font-weight: 600; line-height: 1; white-space: nowrap;
  cursor: pointer; transition: all var(--dur-fast) var(--ease-out);
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: var(--accent-contrast); box-shadow: 0 1px 3px var(--accent-glow); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); box-shadow: var(--shadow-xs); }
.btn-secondary:hover { background: var(--surface-alt); border-color: var(--border-strong); }
.btn-sm { min-height: max(28px, var(--tap-target)); padding: 5px 10px; font-size: 12px; gap: 5px; }

.icon-btn {
  width: max(30px, var(--tap-target)); height: max(30px, var(--tap-target)); flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-muted); cursor: pointer;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }

/* ==========================================================================
   3. LAYOUT
   ========================================================================== */
.app { height: 100vh; height: 100dvh; display: flex; }

/* Side panel: drawer on phones, docked (and collapsible to a rail) from 901px */
.side {
  position: fixed; inset: 0 auto 0 0; z-index: var(--z-modal);
  width: min(320px, 88vw);
  display: flex; flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
  transform: translateX(-102%);
  transition: transform var(--dur-med) var(--ease-out);
}
.app.is-drawer-open .side { transform: none; box-shadow: var(--shadow-xl); }
.scrim { position: fixed; inset: 0; z-index: calc(var(--z-modal) - 1); background: rgba(18, 18, 17, 0.46); backdrop-filter: blur(3px); }
.scrim[hidden] { display: none; }

.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 10px 10px 16px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-serif); font-size: 1.2rem; font-weight: 700; white-space: nowrap; }
.brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

.side-search { position: relative; padding: 0 12px 8px; }
.side-search .li { position: absolute; left: 24px; top: calc(50% - 4px); transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
.side-search input {
  width: 100%; min-height: max(34px, var(--tap-target));
  padding: 6px 12px 6px 34px;
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface-alt); color: var(--text);
  font: 16px var(--font-sans); outline: none;
  transition: border-color var(--dur-fast), box-shadow var(--dur-fast), background var(--dur-fast);
}
.side-search input::placeholder { color: var(--text-faint); }
.side-search input:focus { background: var(--surface); border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); }

.side-label { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 4px 18px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }

.folders { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 4px; }

/* Folder = one collapsible section */
.folder { border: 1px solid transparent; border-radius: var(--r-md); transition: background var(--dur-fast), border-color var(--dur-fast); }
.folder.is-open { background: var(--surface-alt); border-color: var(--border); }
.folder.is-new { animation: folderIn 1.4s var(--ease-out) 1; }
@keyframes folderIn { 0% { box-shadow: 0 0 0 3px var(--accent-glow); border-color: var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.folder-head { display: flex; align-items: center; padding-right: 4px; }
.folder-toggle {
  flex: 1 1 auto; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  min-height: max(40px, var(--tap-target)); padding: 0 8px 0 10px;
  border: 0; border-radius: var(--r-md); background: transparent;
  font-size: 13.5px; font-weight: 600; color: var(--text); text-align: left; cursor: pointer;
}
.folder:not(.is-open) .folder-toggle:hover { background: var(--surface-hover); }
.chev { display: inline-flex; color: var(--text-faint); transition: transform var(--dur-fast) var(--ease-out); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.folder-ico { color: var(--accent); display: inline-flex; }
.folder-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); flex: 0 0 auto; }
.folder-count { flex: 0 0 auto; min-width: 22px; padding: 0 6px; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--surface); color: var(--text-faint); font-family: var(--font-mono); font-size: 10.5px; line-height: 18px; text-align: center; }
.folder-act { width: max(26px, var(--tap-target)); height: max(26px, var(--tap-target)); }
@media (hover: hover) {
  .folder-act { opacity: 0; }
  .folder-head:hover .folder-act, .folder-head:focus-within .folder-act { opacity: 1; }
}

/* Smooth collapse without measuring heights */
.folder-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-med) var(--ease-out); }
.folder.is-open .folder-body { grid-template-rows: 1fr; }
.folder-inner { min-height: 0; overflow: hidden; }
.folder-inner > .tree { padding: 0 4px 8px; }

.tree { list-style: none; }
.row {
  width: 100%;
  display: flex; align-items: center; gap: 7px;
  min-height: max(28px, calc(var(--tap-target) - 6px));
  padding: 0 8px 0 calc(10px + var(--lvl) * 14px);
  border: 0; border-radius: var(--r-sm); background: transparent;
  font-size: 13px; color: var(--text-muted); text-align: left; cursor: pointer;
}
.row:hover { background: var(--surface-hover); color: var(--text); }
.row.is-active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-xs), inset 2px 0 0 var(--accent); }
.row .chev { width: 12px; }
.row-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-name mark { background: var(--accent-tint-hover); color: inherit; border-radius: 2px; }
.git { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; }
.git-M .git { color: var(--warning); }
.git-U .git { color: var(--success); }
.tree-empty { padding: 4px 12px 6px 34px; font-size: 12px; color: var(--text-faint); }
.side-empty { margin: 8px 8px 0; padding: 14px; color: var(--text-muted); font-size: 12.5px; text-align: center; }

.ft-folder { color: var(--accent); }
.ft-ts { color: var(--info); }
.ft-json { color: var(--warning); }
.ft-css { color: var(--ft-purple); }
.ft-md { color: var(--text-faint); }
.ft-py, .ft-img { color: var(--success); }
.ft-flow { color: var(--accent); }
.preview.is-flow { display: flex; overflow: hidden; padding-bottom: 12px; }
.flow-frame { flex: 1 1 auto; width: 100%; min-height: 320px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-sm); }

.dropzone {
  margin: 4px 12px 10px;
  padding: 12px;
  display: flex; align-items: center; gap: 10px;
  border: 1.5px dashed var(--border-strong); border-radius: var(--r-md);
  color: var(--text-muted); font-size: 12px; line-height: 1.4;
  transition: border-color var(--dur-fast), background var(--dur-fast), color var(--dur-fast);
}
.dropzone strong { display: block; color: var(--text); font-size: 12.5px; }
.dropzone .li { color: var(--accent); }
.dropzone.is-over { border-color: var(--accent); background: var(--accent-tint); color: var(--accent); }

.side-foot { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-top: 1px solid var(--border); }
.side-foot small { margin-left: auto; padding-right: 6px; color: var(--text-faint); font-size: 11px; }

.rail { display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0; }
.rail-folder {
  width: 40px; height: 40px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent; border-radius: var(--r-md);
  background: var(--accent-tint); color: var(--accent);
  font-size: 12px; font-weight: 700; cursor: pointer;
}
.rail-folder:hover { border-color: var(--accent); }
.rail-add { border: 1.5px dashed var(--border-strong); background: transparent; color: var(--text-muted); }

/* Main column */
.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.main-head { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 54px; padding: 8px 14px; }
.crumbs { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 4px; list-style: none; overflow: hidden; white-space: nowrap; font-size: 12.5px; color: var(--text-muted); }
.crumbs li { overflow: hidden; text-overflow: ellipsis; }
.crumbs li + li::before { content: "/"; margin-right: 4px; color: var(--text-faint); }
.crumbs li:last-child { color: var(--text); font-weight: 600; }
.head-badge { flex: 0 0 auto; padding: 2px 10px; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--surface); color: var(--text-muted); font-size: 11.5px; font-weight: 600; }

.preview { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 12px 16px; }
.file-card { max-width: 860px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.file-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--border); }
.file-title { min-width: 0; display: flex; align-items: center; gap: 10px; }
.file-title > div { min-width: 0; display: flex; flex-direction: column; }
.file-title strong { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-title small { color: var(--text-faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-actions { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.file-actions .btn span.label { display: none; }

.code { overflow-x: auto; padding: 10px 0 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.75; }
.cl { display: grid; grid-template-columns: 42px max-content; min-width: 100%; }
.ln { padding-right: 14px; text-align: right; color: var(--text-faint); user-select: none; }
.lc { white-space: pre; padding-right: 24px; }
.tk-k { color: var(--accent); font-weight: 600; }
.tk-s { color: var(--success); }
.tk-n { color: var(--info); }
.tk-c { color: var(--text-faint); font-style: italic; }
.tk-t { color: var(--ft-purple); }
.tk-h { color: var(--accent); font-weight: 700; }

.empty { max-width: 560px; margin: 6vh auto 0; padding: 0 8px; text-align: center; }
.empty-orb { width: 64px; height: 64px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-tint); color: var(--accent); }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.empty h1 { font-family: var(--font-serif); font-size: clamp(1.7rem, 6vw, 2.3rem); line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 10px; }
.empty p { color: var(--text-muted); }
.suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
.suggestion { min-height: max(34px, var(--tap-target)); padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--surface); color: var(--text-muted); font-size: 12.5px; cursor: pointer; box-shadow: var(--shadow-xs); }
.suggestion:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
.suggestion code { font-family: var(--font-mono); font-weight: 600; color: var(--accent); }

/* ==========================================================================
   4. CHAT DOCK
   ========================================================================== */
.dock { flex: 0 0 auto; padding: 0 10px max(10px, env(safe-area-inset-bottom)); }
.dock-inner { position: relative; max-width: 860px; margin: 0 auto; }

@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* One-line result of the last action, instead of a chat log */
.action-status {
  display: flex; align-items: center; gap: 8px;
  width: fit-content; max-width: 100%;
  margin: 0 auto 8px; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface); box-shadow: var(--shadow-sm);
  font-size: 12.5px; color: var(--text-muted);
  animation: msgIn var(--dur-med) var(--ease-out);
}
.action-status[hidden] { display: none; }
.action-status .status-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.action-status.is-ok .li { color: var(--success); }
.action-status.is-warn .li { color: var(--warning); }
.action-status.is-run { color: var(--text); }
.spinner { width: 13px; height: 13px; flex: 0 0 13px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Script run output: always a dark terminal, like the Amber code block */
.run-card { max-width: 860px; margin: 12px auto; border: 1px solid #2B2824; border-radius: var(--r-lg); background: #141312; color: #ECE7DE; box-shadow: var(--shadow-md); overflow: hidden; animation: msgIn var(--dur-med) var(--ease-out); }
.run-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 14px; background: #1B1A19; border-bottom: 1px solid #2B2824; }
.run-title { min-width: 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12.5px; }
.run-title code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-cmd { color: #F08E5A; font-weight: 700; }
.run-card.is-done .run-title .li { color: #53C378; }
.run-card.is-failed .run-title .li { color: #F16E63; }
.run-card.is-stopped .run-title .li { color: #F2B957; }
.run-card .spinner { border-color: rgba(255, 255, 255, 0.2); border-top-color: #F08E5A; }
.run-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.run-badge { padding: 2px 8px; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: var(--r-pill); color: #A59D92; font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }
.run-card .btn-secondary { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.14); color: #F5F3EF; box-shadow: none; }
.run-card .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }
.run-card .icon-btn { color: #A59D92; }
.run-card .icon-btn:hover { background: rgba(255, 255, 255, 0.08); color: #F5F3EF; }
.run-body { position: relative; }
.run-output { height: min(220px, 34vh); overflow-y: auto; overscroll-behavior: contain; margin: 0; padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.run-output > span { display: block; }

.o-dim { color: #736C63; } .o-info { color: #F2B957; } .o-ok { color: #53C378; } .o-err { color: #F16E63; }

.composer {

  border: 1px solid var(--border); border-radius: var(--r-xl);

  transition: border-color var(--dur-fast), box-shadow var(--dur-fast);

.composer:focus-within { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-md); }

.ctx-chip button { width: max(20px, var(--tap-target)); height: max(20px, var(--tap-target)); display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: transparent; color: var(--text-faint); cursor: pointer; }
.ctx-chip button:hover { background: var(--surface-hover); color: var(--text); }
.prompt { display: block; width: 100%; max-height: 160px; padding: 6px 0; border: 0; outline: none; resize: none; background: transparent; color: var(--text); font: 16px/1.5 var(--font-sans); }
.prompt:focus-visible { box-shadow: none; }
.prompt::placeholder { color: var(--text-faint); }
.composer-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.composer-tools { display: flex; align-items: center; gap: 4px; min-width: 0; }
.tool-btn { display: inline-flex; align-items: center; gap: 6px; min-height: max(30px, var(--tap-target)); min-width: max(30px, var(--tap-target)); justify-content: center; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r-pill); background: transparent; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tool-btn:hover { background: var(--surface-alt); color: var(--text); }
.tool-btn .slash { font-family: var(--font-mono); font-weight: 700; color: var(--accent); }
.tool-btn .label { display: none; }
.composer-send { display: flex; align-items: center; gap: 10px; }
.hint { display: none; font-size: 11px; color: var(--text-faint); }
.send { width: max(34px, var(--tap-target)); height: max(34px, var(--tap-target)); display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-contrast); cursor: pointer; transition: background var(--dur-fast), transform var(--dur-fast); }
.send:hover { background: var(--accent-hover); }
.send:active { transform: scale(0.94); }
.send:disabled { background: var(--surface-active); color: var(--text-faint); cursor: default; transform: none; }

/* Slash command menu */
.slash-menu {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: var(--z-dropdown);
  max-height: min(52vh, 360px); overflow-y: auto;
  padding: 6px;
  border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface); box-shadow: var(--shadow-lg);
  animation: msgIn var(--dur-fast) var(--ease-out);
}
.slash-menu[hidden] { display: none; }
.slash-group { padding: 8px 10px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); }
.slash-item { display: flex; align-items: center; gap: 10px; min-height: max(40px, var(--tap-target)); padding: 6px 10px; border-radius: var(--r-sm); cursor: pointer; }
.slash-item.is-active { background: var(--accent-tint); }
.slash-icon { width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border-radius: var(--r-sm); background: var(--surface-alt); color: var(--accent); }
.slash-item.is-active .slash-icon { background: var(--surface); }
.slash-text { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
.slash-cmd { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slash-cmd em { font-style: normal; font-weight: 500; color: var(--text-faint); }
.slash-cmd mark { background: transparent; color: var(--accent); }
.slash-desc { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slash-empty { padding: 14px 10px; color: var(--text-muted); font-size: 12.5px; text-align: center; }
.slash-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; padding: 8px 10px 4px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-faint); }

  .file-actions .btn span.label { display: inline; }

<div class="app" id="app">
  <!-- SIDE PANEL -->
  <aside class="side" id="side" aria-label="Folders">
    <div class="side-head">
      <div class="brand"><span class="brand-dot"></span><span class="brand-name">Amber Studio</span></div>
      <button class="icon-btn" id="collapseBtn" type="button" aria-label="Collapse side panel" aria-expanded="true" aria-controls="side" data-i="panel-left"></button>
    </div>

    <div class="side-search">
      <span data-i="search" data-s="14"></span>
      <label class="sr-only" for="filter">Filter files</label>
      <input id="filter" type="search" placeholder="Filter files" autocomplete="off" spellcheck="false">
    </div>

    <div class="side-label">
      <span>Folders</span>
      <button class="icon-btn" type="button" aria-label="Add folder" title="Add folder" data-action="add-folder" data-i="plus"></button>
    </div>

    <div class="folders" id="folders"></div>
    <nav class="rail" id="rail" aria-label="Folders (collapsed)"></nav>

    <div class="dropzone" id="dropzone">
      <span data-i="folder-plus" data-s="20"></span>
      <span><strong>Drop folders here</strong>Each one gets its own section.</span>
    </div>

    <div class="side-foot">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle color theme" title="Toggle theme"><span id="themeIcon"></span></button>
      <button class="icon-btn" type="button" aria-label="Show commands" title="Commands" data-slash="/" data-i="help-circle"></button>
      <small>Type <span class="kbd">/</span> for commands</small>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- MAIN -->
  <main class="main">
    <header class="main-head">
      <button class="icon-btn mobile-only" id="menuBtn" type="button" aria-label="Open folders" aria-controls="side" aria-expanded="false" data-i="menu"></button>
      <ol class="crumbs" id="crumbs" aria-label="Current location"></ol>
      <span class="head-badge" id="headBadge">3 folders</span>
    </header>

    <section class="preview" id="preview" aria-live="polite"></section>

    <section class="dock" aria-label="AI actions">
      <div class="dock-inner">
        <div class="action-status" id="actionStatus" role="status" aria-live="polite" hidden></div>

        <form class="composer" id="composer" autocomplete="off">
          <div class="slash-menu" id="slashMenu" role="listbox" aria-label="Commands" hidden></div>
          <div class="ctx-row" id="ctxRow"></div>
          <label class="sr-only" for="prompt">Tell the AI what to do</label>
          <textarea class="prompt" id="prompt" rows="1" placeholder="Tell the AI what to do, or type / for commands" role="combobox" aria-expanded="false" aria-controls="slashMenu" aria-autocomplete="list"></textarea>
          <div class="composer-bar">
            <div class="composer-tools">
              <button class="tool-btn" type="button" data-action="add-folder" aria-label="Add folder"><span data-i="folder-plus" data-s="14"></span><span class="label">Folder</span></button>
              <button class="tool-btn" type="button" data-slash="/" aria-label="Commands"><span class="slash">/</span><span class="label">Commands</span></button>
            </div>
            <div class="composer-send">
              <span class="hint"><span class="kbd">Enter</span> run</span>
              <button class="send" id="sendBtn" type="submit" aria-label="Run" disabled data-i="arrow-up" data-s="18"></button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>
</div>

<div class="drop-overlay" id="dropOverlay" aria-hidden="true">
  <div class="drop-card">
    <div class="empty-orb" style="margin:0"><span data-i="folder-plus" data-s="28"></span></div>
    <h2>Drop to add folders</h2>
    <p>Every folder becomes a new collapsible section in the side panel.</p>
  </div>
</div>

<input type="file" id="dirPicker" webkitdirectory multiple hidden>

  function initials(name) { return (name.replace(/[^a-z0-9]+/gi, ' ').trim().split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2) || '?').toUpperCase(); }

  const FILE_TYPES = {
    ts: ['file-code', 'ft-ts', 'TypeScript'], tsx: ['file-code', 'ft-ts', 'TypeScript React'], js: ['file-code', 'ft-json', 'JavaScript'], mjs: ['file-code', 'ft-json', 'JavaScript'], cjs: ['file-code', 'ft-json', 'JavaScript'],
    json: ['braces', 'ft-json', 'JSON'], css: ['hash', 'ft-css', 'CSS'], md: ['file-text', 'ft-md', 'Markdown'],
    py: ['file-code', 'ft-py', 'Python'], flow: ['workflow', 'ft-flow', 'Flow'], toml: ['file-text', 'ft-md', 'TOML'], png: ['image', 'ft-img', 'Image'], svg: ['image', 'ft-img', 'SVG']
  };
  function fileType(node) { return FILE_TYPES[extOf(node.name)] || ['file', '', 'Plain text']; }
  function fileIcon(node, size) { const t = fileType(node); return '<span class="' + t[1] + '" style="display:inline-flex">' + ic(t[0], size || 15) + '</span>'; }

  /* ------------------------------------------------------------------------
     Mock file content + tiny highlighter
     ------------------------------------------------------------------------ */
  function mockContent(node) {
    const base = node.name.replace(/\.[^.]+$/, '');
    const pascal = base.replace(/(^|[-_.])(\w)/g, function (m, s, c) { return c.toUpperCase(); });
    const ext = extOf(node.name);
    if (ext === 'js' || ext === 'mjs' || ext === 'cjs') return [
      '#!/usr/bin/env node',
      "import { readdir } from 'node:fs/promises';",
      "import { join } from 'node:path';",
      '',
      '// ' + base + ': walks src/ and reports each module.',
      "const SRC = join(import.meta.dirname, '..', 'src');",
      '',
      'const files = await readdir(SRC, { recursive: true });',
      "console.log('Bundling ' + files.length + ' modules');",
      '',
      'for (const file of files) {',
      "  console.log('ok ' + file);",
      '}'
    ];
    if (ext === 'tsx' || ext === 'ts') return [
      "import { useState } from 'react';",
      "import { Icon } from './Icon';",
      '',
      'type ' + pascal + 'Props = {',
      "  variant?: 'primary' | 'secondary';",
      '  onSubmit?: (text: string) => void;',
      '};',
      '',
      '// Commands start with a slash, everything else goes to the assistant.',
      'export function ' + pascal + '({ variant = ' + "'primary'" + ', onSubmit }: ' + pascal + 'Props) {',
      "  const [value, setValue] = useState('');",
      "  const isCommand = value.startsWith('/');",
      '',
      '  return (',
      '    <form className={variant} onSubmit={() => onSubmit?.(value)}>',
      '      <textarea value={value} onChange={(e) => setValue(e.target.value)} />',
      '      {isCommand ? <Icon name="slash" /> : null}',
      '    </form>',
      '  );',
      '}'
    ];
    if (ext === 'css') return [
      ':root {',
      '  --accent: #D4622B;',
      '  --surface: #FFFFFF;',
      '  --r-md: 12px;',
      '}',
      '',
      '/* One collapsible section per folder. */',
      '.folder {',
      '  border-radius: var(--r-md);',
      '  transition: background 140ms;',
      '}',
      '.folder.is-open { background: var(--surface-alt); }'
    ];
    if (ext === 'json') return [
      '{',
      '  "name": "' + (rootOf(node) || node).name + '",',
      '  "version": "0.1.0",',
      '  "private": true,',
      '  "scripts": { "dev": "vite", "build": "vite build" }',
      '}'
    ];
    if (ext === 'md') return [
      '# ' + base,
      '',
      'Design notes for the simplified Amber file panel.',
      '',
      '## Principles',
      '',
      '- One collapsible section per folder',
      '- Drag folders from your desktop to add them',
      '- A single chat input; type / to run a command',
      '',
      '## Open questions',
      '',
      '1. Should sections remember their open state?',
      '2. Which commands deserve a keyboard shortcut?'
    ];
    if (ext === 'py') return [
      'from fastapi import APIRouter',
      '',
      'router = APIRouter(prefix="/' + base + '")',
      '',
      '',
      '@router.get("/")',
      'async def list_items(path: str = "."):',
      '    # Resolve inside the workspace root only.',
      '    return {"items": [], "path": path}'
    ];
    return ['# ' + node.name, 'Preview is not available for this file type in the design mock.'];
  }

  const KEYWORDS = /^(import|from|export|default|const|let|function|return|type|async|await|def|class|true|false|null)$/;
  const TOKEN_RE = /(\/\/.*$|\/\*.*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(#[0-9A-Fa-f]{3,8}\b|\b\d+(?:\.\d+)?(?:px|ms|%)?\b)|(\b[A-Za-z_]\w*\b)/g;
  function highlight(line, ext) {
    if (ext === 'md') {
      if (/^#{1,6}\s/.test(line)) return '<span class="tk-h">' + esc(line) + '</span>';
      const m = /^(\s*(?:[-*]|\d+\.))(\s.*)$/.exec(line);
      return m ? '<span class="tk-k">' + esc(m[1]) + '</span>' + esc(m[2]) : esc(line);
    }
    if (ext === 'py' && /^\s*#/.test(line)) return '<span class="tk-c">' + esc(line) + '</span>';
    let out = '', last = 0, match;
    TOKEN_RE.lastIndex = 0;
    while ((match = TOKEN_RE.exec(line))) {
      out += esc(line.slice(last, match.index));
      const text = esc(match[0]);
      if (match[1]) out += '<span class="tk-c">' + text + '</span>';
      else if (match[2]) out += '<span class="tk-s">' + text + '</span>';
      else if (match[3]) out += '<span class="tk-n">' + text + '</span>';
      else if (KEYWORDS.test(match[4])) out += '<span class="tk-k">' + text + '</span>';
      else if (/^[A-Z]/.test(match[4])) out += '<span class="tk-t">' + text + '</span>';
      else out += text;
      last = match.index + match[0].length;
    }
    return out + esc(line.slice(last));
  }

  /* ------------------------------------------------------------------------
     Rendering
     ------------------------------------------------------------------------ */
  function matchesFilter(node) {
    if (!state.filter) return true;
    if (node.type === 'file' && node.name.toLowerCase().includes(state.filter)) return true;
    return node.type === 'dir' && node.children.some(matchesFilter);
  }
  function filterName(name) {
    const i = state.filter ? name.toLowerCase().indexOf(state.filter) : -1;
    if (i < 0) return esc(name);
    return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + state.filter.length)) + '</mark>' + esc(name.slice(i + state.filter.length));
  }

  function nodeHTML(node, level) {
    if (!matchesFilter(node)) return '';
    if (node.type === 'dir') {
      const open = node.open || !!state.filter;
      return '<li><button class="row" type="button" style="--lvl:' + level + '" aria-expanded="' + open + '" data-dir="' + node.id + '">' +
        '<span class="chev">' + ic('chevron-right', 12) + '</span><span class="ft-folder" style="display:inline-flex">' + ic(open ? 'folder-open' : 'folder', 15) + '</span>' +
        '<span class="row-name">' + filterName(node.name) + '</span></button>' +
        (open ? '<ul class="tree">' + sortChildren(node.children).map(function (c) { return nodeHTML(c, level + 1); }).join('') + '</ul>' : '') + '</li>';
    }
    return '<li><button class="row' + (node.id === state.current ? ' is-active' : '') + (node.git ? ' git-' + node.git : '') + '" type="button" style="--lvl:' + level + '" data-file="' + node.id + '"' + (node.id === state.current ? ' aria-current="true"' : '') + '>' +
      '<span class="chev"></span>' + fileIcon(node) + '<span class="row-name">' + filterName(node.name) + '</span>' +
      (node.git ? '<span class="git" title="' + (node.git === 'M' ? 'Modified' : 'New') + '">' + node.git + '</span>' : '') + '</button></li>';
  }

  function renderFolders() {
    const host = $('#folders');
    const sections = roots.map(function (root) {
      const open = root.open || !!state.filter;
      const files = walkFiles(root);
      const inner = sortChildren(root.children).map(function (c) { return nodeHTML(c, 0); }).join('');
      if (state.filter && !inner) return '';
      const changed = files.filter(function (f) { return f.git; }).length;
      return '<section class="folder' + (open ? ' is-open' : '') + (root.fresh ? ' is-new' : '') + '" data-folder="' + root.id + '">' +
        '<div class="folder-head">' +
          '<button class="folder-toggle" type="button" aria-expanded="' + open + '" aria-controls="fb-' + root.id + '" data-toggle="' + root.id + '">' +
            '<span class="chev">' + ic('chevron-right', 14) + '</span>' +
            '<span class="folder-ico">' + ic(open ? 'folder-open' : 'folder', 17) + '</span>' +
            '<span class="folder-name">' + esc(root.name) + '</span>' +
            (changed ? '<span class="folder-dot" title="' + changed + ' changed"></span>' : '') +
            '<span class="folder-count" title="' + files.length + ' files">' + files.length + '</span>' +
          '</button>' +
          '<button class="icon-btn folder-act" type="button" data-remove="' + root.id + '" aria-label="Remove ' + esc(root.name) + '" title="Remove from panel">' + ic('x', 14) + '</button>' +
        '</div>' +
        '<div class="folder-body" id="fb-' + root.id + '"><div class="folder-inner"><ul class="tree">' + (inner || '<li class="tree-empty">This folder is empty</li>') + '</ul></div></div>' +
      '</section>';
    }).join('');
    host.innerHTML = sections || (roots.length
      ? '<p class="side-empty">No files match “' + esc(state.filter) + '”.</p>'
      : '<p class="side-empty">No folders yet. Drop one below or type <span class="kbd">/add-folder</span>.</p>');
    $$('.folder', host).forEach(function (section) { $('.folder-body', section).inert = !section.classList.contains('is-open'); });
    roots.forEach(function (r) { delete r.fresh; });

    $('#rail').innerHTML = roots.map(function (root) {
      return '<button class="rail-folder" type="button" data-rail="' + root.id + '" title="' + esc(root.name) + '" aria-label="Open ' + esc(root.name) + '">' + esc(initials(root.name)) + '</button>';
    }).join('') + '<button class="rail-folder rail-add" type="button" data-action="add-folder" aria-label="Add folder" title="Add folder">' + ic('plus', 16) + '</button>';
  }

  function renderHead() {
    const node = byId.get(state.current);
    const parts = node ? pathOf(node) : ['All folders'];
    $('#crumbs').innerHTML = parts.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('');
    $('#headBadge').textContent = roots.length + (roots.length === 1 ? ' folder' : ' folders');
  }

  function renderPreview() {
    const host = $('#preview');
    const node = byId.get(state.current);
    if (node && extOf(node.name) === 'flow') {
      if (flowFrame && flowNodeId === node.id && host.contains(flowFrame)) return;
      saveFlow();
      host.classList.add('is-flow');
      host.innerHTML = '';
      mountFlow(host, node);
      return;
    }
    if (flowFrame) { saveFlow(); flowFrame = null; flowNodeId = null; }
    host.classList.remove('is-flow');
    if (!node) {
      host.innerHTML = '<div id="runSlot"></div><div class="empty">' +
        '<div class="empty-orb">' + ic('layers', 28) + '</div>' +
        '<div class="eyebrow">' + roots.length + ' folders · ' + allFiles().length + ' files</div>' +
        '<h1>Pick a file, or tell the AI what to do</h1>' +
        '<p>Open a folder on the left to browse it. Drop more folders anywhere on the page. Describe an action below, or type <span class="kbd">/</span> to run a command.</p>' +
        '<div class="suggestions">' +
          '<button class="suggestion" type="button" data-fill="open summarize.flow">open summarize.flow</button>' +
          '<button class="suggestion" type="button" data-fill="open the readme">open the readme</button>' +
          '<button class="suggestion" type="button" data-fill="/find chat"><code>/find</code> chat</button>' +
          '<button class="suggestion" type="button" data-fill="collapse all folders">collapse all folders</button>' +
          '<button class="suggestion" type="button" data-run="/add-sample"><code>/add-sample</code> folder</button>' +
        '</div></div>';
      renderRun();
      return;
    }
    const ext = extOf(node.name);
    host.innerHTML = '<article class="file-card">' +
      '<header class="file-head">' +
        '<div class="file-title">' + fileIcon(node, 20) + '<div><strong>' + esc(node.name) + '</strong><small>' + esc(pathOf(node).slice(0, -1).join(' / ')) + ' · ' + esc(fileType(node)[2]) + '</small></div></div>' +
        '<div class="file-actions">' +
          (runtimeOf(node) ? '<button class="btn btn-primary" type="button" data-run-file="' + node.id + '" aria-label="Run with ' + runtimeOf(node).label + '">' + ic('play', 13) + '<span class="label">Run</span></button>' : '') +
          '<button class="btn btn-secondary" type="button" data-fill="/rename " aria-label="Rename this file">' + ic('pencil', 14) + '<span class="label">Rename</span></button>' +
          '<button class="icon-btn" type="button" data-close-file aria-label="Close preview" title="Close">' + ic('x', 16) + '</button>' +
        '</div>' +
      '</header>' +
      '<div class="code" tabindex="0" aria-label="' + esc(node.name) + ' preview">' +
        mockContent(node).map(function (line, i) {
          return '<div class="cl"><span class="ln">' + (i + 1) + '</span><span class="lc">' + (highlight(line, ext) || ' ') + '</span></div>';
        }).join('') +
      '</div></article><div id="runSlot"></div>';
    renderRun();
  }

  // Only the canvas is shown; hidden Flow Machine controls stay in the DOM so commands can still click them.
  const FLOW_EMBED_CSS = '<style>#topbar,#leftpanel,#statusbar,#minimapHint,#aiDock{display:none!important}</style>';
  const FLOW_NODE_TYPES = [['trigger', 'Trigger'], ['runPrompt', 'Run Prompt'], ['loop', 'Loop (For Each)'], ['data', 'Data'], ['script', 'Script (Python)']];
  let flowHtml = null, flowFrame = null, flowNodeId = null, pendingFlowCmd = null;

  function flowMachineHtml() {
    if (flowHtml === null) {
      try { flowHtml = new TextDecoder().decode(Uint8Array.from(atob(FLOW_MACHINE_B64), function (c) { return c.charCodeAt(0); })); }
      catch (error) { flowHtml = ''; }
    }
    return flowHtml;
  }
  function flowKey(node) { return 'studio_flow:' + pathOf(node).join('/'); }
  function flowDoc() { try { return flowFrame && flowFrame.contentDocument; } catch (error) { return null; } }
  function flowOpen() { const n = byId.get(state.current); return !!(n && extOf(n.name) === 'flow' && flowFrame); }
  function isRunnable(n) { return !!runtimeOf(n) || extOf(n.name) === 'flow'; }
  function flowNodeNames() { const doc = flowDoc(); return doc ? Array.from(doc.querySelectorAll('.node .title-input')).map(function (i) { return i.value; }) : []; }

  // Flow Machine keeps one state in localStorage; swap it per .flow file.
  function saveFlow() {
    const doc = flowDoc(), node = byId.get(flowNodeId);
    if (!doc || !node) return;
    const btn = doc.getElementById('btnSave');
    if (btn) btn.click();
    const raw = localStorage.getItem('flow_machine_state');
    if (raw) localStorage.setItem(flowKey(node), raw);
  }

  function mountFlow(host, node) {
    const html = flowMachineHtml();
    if (!html) { host.innerHTML = '<div class="empty"><h1>Flow Machine is not bundled</h1><p>Run the build command to embed flow_machine.html.</p></div>'; return; }
    const saved = localStorage.getItem(flowKey(node));
    if (saved) localStorage.setItem('flow_machine_state', saved); else localStorage.removeItem('flow_machine_state');
    localStorage.setItem('flow_machine_theme', document.documentElement.getAttribute('data-theme') || 'light');
    const frame = document.createElement('iframe');
    frame.className = 'flow-frame';
    frame.title = node.name + ' in Flow Machine';
    frame.addEventListener('load', function () { wireFlow(frame, node, !saved); });
    frame.srcdoc = html.replace('</head>', FLOW_EMBED_CSS + '</head>');
    host.appendChild(frame);
    flowFrame = frame; flowNodeId = node.id;
  }

  function wireFlow(frame, node, isNew) {
    if (frame !== flowFrame) return;
    const doc = flowDoc();
    if (!doc) return;
    if (isNew) { const name = doc.getElementById('flowName'); if (name) name.value = node.name.replace(/\.flow$/i, ''); }
    const status = doc.getElementById('aiStatus');
    if (status) new MutationObserver(function () {
      if (status.hidden) return;
      const text = status.querySelector('.ai-status-text');
      showStatus(status.classList.contains('is-run') ? 'run' : status.classList.contains('is-warn') ? 'warn' : 'ok', text ? text.textContent : '');
    }).observe(status, { attributes: true, childList: true, subtree: true });
    doc.addEventListener('keydown', function (event) {
      const t = doc.activeElement;
      const typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
      if (event.key === '/' && !typing && !event.ctrlKey && !event.metaKey) { event.preventDefault(); event.stopImmediatePropagation(); setPrompt('/'); }
    }, true);
    if (pendingFlowCmd) { const cmd = pendingFlowCmd; pendingFlowCmd = null; sendToFlow(cmd); }
  }

  // Drives the flow's own (hidden) AI input, so every Flow Machine command works unchanged.
  function sendToFlow(text) {
    const doc = flowDoc();
    const input = doc && doc.getElementById('aiPrompt'), form = doc && doc.getElementById('aiComposer');
    if (!input || !form) { pendingFlowCmd = text; return; }
    input.value = text;
    form.requestSubmit();
  }

  function newFlow() {
    const current = byId.get(state.current);
    const folder = (current && current.parent) || roots[0];
    if (!folder) return null;
    let name = 'untitled.flow', i = 1;
    while (folder.children.some(function (c) { return c.name === name; })) name = 'untitled-' + (++i) + '.flow';
    const node = link(F(name, 'U'), folder);
    folder.children.push(node);
    localStorage.setItem(flowKey(node), JSON.stringify({ state: { nodes: [], edges: [] }, name: name.replace(/\.flow$/, ''), desc: '' }));
    openFile(node.id);
    return node;
  }
